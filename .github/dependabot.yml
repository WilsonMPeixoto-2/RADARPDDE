version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 6
    rebase-strategy: auto
    groups:
      browser-quality:
        patterns:
          - "@axe-core/playwright"
          - "@playwright/test"
      supabase-tooling:
        patterns:
          - "@supabase/supabase-js"
          - "supabase"
      build-and-validation:
        patterns:
          - "acorn"
          - "acorn-walk"
          - "ajv"
          - "esbuild"
          - "http-server"
          - "prettier"
          - "typescript"
    ignore:
      # O runtime homologado permanece Node 24.x. Tipos de uma major futura só entram
      # junto com uma migração deliberada do runtime, não por PR automático.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # As versões 2.116.0 e 2.117.0 foram homologadas e rejeitadas pela mesma
      # regressão em duas garantias pgTAP/RLS de service_role. Os bloqueios são
      # exatos para permitir que uma versão posterior volte a ser avaliada.
      - dependency-name: "supabase"
        versions:
          - "2.116.0"
          - "2.117.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      actions:
        patterns:
          - "*"
