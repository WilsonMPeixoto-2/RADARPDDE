name: Gerar lock temporário da estabilização

on:
  pull_request:
    paths:
      - .github/workflows/temporary-dependency-lock.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch interna
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerar lock com versões exatas
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact fast-check@4.9.0 msw@2.15.0 dependency-cruiser@18.2.0 @types/node@24.13.3
      - name: Commitar lock na branch do PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lock já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sincronizar lock exato da estabilização"
          git push origin HEAD:${TARGET_BRANCH}
