name: Gerar lock temporário da estabilização

on:
  push:
    branches:
      - fix/stabilizacao-avaliacoes-reais-2026-08-22
    paths:
      - .github/workflows/temporary-dependency-lock.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Gerar package e lock reproduzíveis
        run: npm install --package-lock-only --ignore-scripts --save-dev fast-check msw dependency-cruiser
      - name: Publicar package e lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stabilization-dependency-lock
          path: |
            package.json
            package-lock.json
          retention-days: 1
