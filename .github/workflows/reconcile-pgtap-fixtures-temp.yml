name: Reconciliar fixtures pgTAP temporariamente

on:
  push:
    branches:
      - docs/reconciliacao-integral-pos-pr162-20260807
    paths:
      - scripts/reconcile-pgtap-fixtures-temp.mjs
      - .github/workflows/reconcile-pgtap-fixtures-temp.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch documental
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/reconciliacao-integral-pos-pr162-20260807
          fetch-depth: 0

      - name: Reconciliar fixtures ao schema atual
        run: node scripts/reconcile-pgtap-fixtures-temp.mjs

      - name: Validar diff textual
        run: git diff --check

      - name: Registrar correção e remover ferramenta temporária
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/reconcile-pgtap-fixtures-temp.mjs .github/workflows/reconcile-pgtap-fixtures-temp.yml
          git add supabase/tests/database
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: alinhar pgTAP ao schema institucional atual"
          git push origin HEAD:docs/reconciliacao-integral-pos-pr162-20260807
