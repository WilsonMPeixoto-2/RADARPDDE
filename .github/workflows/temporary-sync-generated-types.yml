name: Sincronizar tipos gerados temporariamente

on:
  push:
    branches:
      - fix/stabilizacao-avaliacoes-reais-2026-08-22
    paths:
      - .github/workflows/temporary-sync-generated-types.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/stabilizacao-avaliacoes-reais-2026-08-22
          fetch-depth: 0
      - name: Baixar artefatos já gerados no gate Supabase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .generated-sync
          mkdir -p .generated-sync
          gh run download 32622473399 --repo "$GITHUB_REPOSITORY" --name generated-supabase-artifacts --dir .generated-sync
      - name: Sincronizar tipos versionados
        run: |
          test -f .generated-sync/src/types/database.types.ts
          cp .generated-sync/src/types/database.types.ts src/types/database.types.ts
          if git diff --quiet -- src/types/database.types.ts; then
            echo "Tipos já sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.types.ts
          git commit -m "chore: sincronizar tipos Supabase gerados"
          git push origin HEAD:fix/stabilizacao-avaliacoes-reais-2026-08-22
