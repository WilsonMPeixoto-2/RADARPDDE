name: PR295 reconcile self patch

on:
  push:
    branches:
      - feat/edicao-lancamentos-auditavel
    paths:
      - '.github/workflows/pr295-reconcile-self-patch.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: feat/edicao-lancamentos-auditavel
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar correções determinísticas
        run: node scripts/pr295-reconcile-self-patch.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Executar unitários afetados
        run: node --test tests/unit/invoice-effects.test.js tests/unit/auditable-retification.test.js

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar E2E afetados
        run: npx playwright test tests/e2e/unidentified-expense.spec.js tests/e2e/pendency-cycle.spec.js tests/e2e/functional-core.spec.js tests/e2e/task-10-11-pendencias.spec.js tests/e2e/task-9-cross-view.spec.js --project=desktop-chromium

      - name: Commitar somente após testes verdes
        run: |
          git config user.name 'RADAR PDDE Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pr295-reconcile-self-patch.yml scripts/pr295-reconcile-self-patch.mjs
          git add src/domain/invoice-effects.js tests/unit/invoice-effects.test.js tests/e2e/pendency-cycle.spec.js tests/e2e/functional-core.spec.js tests/e2e/task-10-11-pendencias.spec.js tests/e2e/task-9-cross-view.spec.js
          git commit -m 'fix: preservar legado e reconciliar testes de drawer'
          git push origin HEAD:feat/edicao-lancamentos-auditavel
