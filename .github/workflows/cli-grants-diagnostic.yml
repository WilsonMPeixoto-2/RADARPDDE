name: Diagnóstico causal de grants da CLI

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/cli-grants-diagnostic.yml]

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  grants:
    name: CLI ${{ matrix.cli }} / auto_expose ${{ matrix.exposure }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cli: ['2.114.0', '2.121.0']
        exposure: ['unset', 'false']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Reservar portas no runner descartável
        shell: bash
        run: |
          set -euo pipefail
          current="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          reservation='54320-54323'
          if [[ -n "$current" ]]; then reservation="${current},${reservation}"; fi
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reservation}"
      - name: Instalar versão exata sem modificar manifestos
        env:
          CLI_VERSION: ${{ matrix.cli }}
        run: |
          npm ci
          if [ "$CLI_VERSION" != '2.114.0' ]; then
            npm install --no-save --package-lock=false "supabase@$CLI_VERSION"
          fi
          mkdir -p cli-grants
          npx --no-install supabase --version | tee cli-grants/version.txt
          grep -Fx "$CLI_VERSION" cli-grants/version.txt
          git diff --exit-code -- package.json package-lock.json
      - name: Isolar o bootstrap anterior às migrations RADAR
        env:
          API_EXPOSURE: ${{ matrix.exposure }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('supabase/config.toml')
          s=p.read_text()
          assert 'auto_expose_new_tables' not in s
          if os.environ['API_EXPOSURE']=='false':
              s=s.replace('[api]\n', '[api]\nauto_expose_new_tables = false\n')
          Path('cli-grants/application.toml').write_text(s)
          s=s.replace('[db.seed]\nenabled = true', '[db.seed]\nenabled = false')
          p.write_text(s+'\n[db.migrations]\nenabled = false\n')
          PY
          bash scripts/start-disposable-supabase-ci.sh
      - name: Capturar defaults e tabela testemunha antes das migrations
        run: |
          cat > cli-grants/before.sql <<'SQL'
          begin;
          create table public.cli_privilege_canary(id int);
          select jsonb_build_object(
            'stage','before-radar-migrations',
            'serverVersion',current_setting('server_version'),
            'currentUser',current_user,
            'serviceDelete',has_table_privilege('service_role','public.cli_privilege_canary','DELETE'),
            'anonDelete',has_table_privilege('anon','public.cli_privilege_canary','DELETE'),
            'authenticatedDelete',has_table_privilege('authenticated','public.cli_privilege_canary','DELETE'),
            'defaults',(select jsonb_agg(jsonb_build_object('role',pg_get_userbyid(d.defaclrole),'type',d.defaclobjtype,'acl',d.defaclacl::text)) from pg_default_acl d where d.defaclnamespace='public'::regnamespace)
          );
          rollback;
          SQL
          docker exec -i supabase_db_radar-pdde psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 < cli-grants/before.sql > cli-grants/before.json
          docker ps --format '{{.Names}} {{.Image}}' > cli-grants/images.txt
      - name: Aplicar migrations e seed inalterados
        run: |
          cp cli-grants/application.toml supabase/config.toml
          npm run supabase:reset
          docker exec -i supabase_db_radar-pdde psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 > cli-grants/after.json <<'SQL'
          select jsonb_build_object(
            'stage','after-radar-migrations',
            'migrations',(select count(*) from supabase_migrations.schema_migrations),
            'profilesDelete',has_table_privilege('service_role','public.user_profiles','DELETE'),
            'scopesDelete',has_table_privilege('service_role','public.user_school_scopes','DELETE'),
            'profilesAnonDelete',has_table_privilege('anon','public.user_profiles','DELETE'),
            'scopesAnonDelete',has_table_privilege('anon','public.user_school_scopes','DELETE'),
            'tables',(select jsonb_agg(jsonb_build_object('table',c.relname,'owner',pg_get_userbyid(c.relowner),'rls',c.relrowsecurity,'acl',c.relacl::text)) from pg_class c where c.oid in ('public.user_profiles'::regclass,'public.user_school_scopes'::regclass))
          );
          SQL
      - name: Executar pgTAP sem alterar asserções
        run: |
          set +e
          npm run supabase:test:db > cli-grants/pgtap.log 2>&1
          status=$?
          printf '%s\n' "$status" > cli-grants/pgtap-exit.txt
          tail -28 cli-grants/pgtap.log
          exit 0
      - name: Confrontar previsão causal com o resultado observado
        env:
          CLI_VERSION: ${{ matrix.cli }}
          API_EXPOSURE: ${{ matrix.exposure }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path('cli-grants')
          before=json.loads((p/'before.json').read_text())
          after=json.loads((p/'after.json').read_text())
          exit_code=int((p/'pgtap-exit.txt').read_text())
          log=(p/'pgtap.log').read_text()
          inherited=os.environ['CLI_VERSION']=='2.121.0' and os.environ['API_EXPOSURE']=='unset'
          assert before['serviceDelete']==inherited, before
          assert after['profilesDelete']==inherited and after['scopesDelete']==inherited, after
          assert after['migrations']==61 and not after['profilesAnonDelete'] and not after['scopesAnonDelete'], after
          assert all(t['rls'] for t in after['tables']), after
          assert re.search(r'Tests=674\b',log), log[-2000:]
          if inherited:
              assert exit_code!=0 and re.search(r'Failed tests:\s+32-33',log), log[-2000:]
              assert re.findall(r'Failed (\d+)/\d+ subtests',log)==['2'], log[-2000:]
              assert re.findall(r'Failed tests:\s+([^\n]+)',log)==['32-33'], log[-2000:]
          else:
              assert exit_code==0 and 'Result: PASS' in log, log[-2000:]
          report={'cli':os.environ['CLI_VERSION'],'autoExpose':os.environ['API_EXPOSURE'],'before':before,'after':after,'pgTapExit':exit_code,'pgTapTests':674,'expectedFailures':[32,33] if inherited else [],'causalPredictionMatched':True}
          (p/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Diagnóstico, não homologação do candidato\n\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Preservar evidências inclusive em falha
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-grants-${{ matrix.cli }}-${{ matrix.exposure }}
          path: cli-grants/
          retention-days: 30
          if-no-files-found: error
      - name: Desligar somente a stack descartável do job
        if: always()
        run: npx --no-install supabase stop --no-backup
