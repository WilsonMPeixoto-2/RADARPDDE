name: Retificação auditável direcionada

on:
  pull_request:
    paths:
      - 'app.js'
      - 'src/application/**'
      - 'src/domain/**'
      - 'src/integration/**'
      - 'tests/unit/auditable-retification.test.js'
      - 'tests/unit/auditable-retification-discoverability.test.js'
      - 'tests/e2e/invoice-auditable-retification.spec.js'
      - 'tests/e2e/invoice-retification-discoverability.spec.js'
      - 'tests/e2e/invoice-retification-projections.spec.js'
      - 'tests/e2e/pendency-manual-auditable-retification.spec.js'
      - '.github/workflows/retification-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-retification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Executar testes unitários da retificação
        run: >-
          node --test
          tests/unit/auditable-retification.test.js
          tests/unit/auditable-retification-discoverability.test.js
          tests/unit/evaluation-retification.test.js
          tests/unit/evaluation-retification-atomic.test.js
      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar regressões de retificação
        run: >-
          npx playwright test
          tests/e2e/evaluation-retification-ui.spec.js
          tests/e2e/invoice-auditable-retification.spec.js
          tests/e2e/invoice-retification-discoverability.spec.js
          tests/e2e/invoice-retification-projections.spec.js
          tests/e2e/pendency-manual-auditable-retification.spec.js
          --project=desktop-chromium

      - name: Publicar evidências da edição
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-editing-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
