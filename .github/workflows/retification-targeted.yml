name: Retificação auditável direcionada

on:
  pull_request:
    paths:
      - 'app.js'
      - 'src/application/**'
      - 'src/domain/**'
      - 'src/integration/**'
      - 'tests/unit/auditable-retification.test.js'
      - 'tests/unit/evaluation-retification.test.js'
      - 'tests/unit/evaluation-retification-atomic.test.js'
      - 'tests/unit/manual-pendency-retification-audit.test.js'
      - 'tests/e2e/invoice-auditable-retification.spec.js'
      - 'tests/e2e/invoice-retification-projections.spec.js'
      - 'tests/e2e/pendency-manual-auditable-retification.spec.js'
      - '.github/workflows/retification-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-retification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Executar testes unitários da retificação
        run: >-
          node --test
          tests/unit/auditable-retification.test.js
          tests/unit/evaluation-retification.test.js
          tests/unit/evaluation-retification-atomic.test.js
          tests/unit/manual-pendency-retification-audit.test.js
      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar regressões de retificação
        run: >-
          npx playwright test
          tests/e2e/invoice-auditable-retification.spec.js
          tests/e2e/invoice-retification-projections.spec.js
          tests/e2e/pendency-manual-auditable-retification.spec.js
          --project=desktop-chromium
