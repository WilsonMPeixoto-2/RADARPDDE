name: Regressão visual desktop

on:
  pull_request:
    branches: [main]
    paths:
      - app.js
      - index.html
      - styles.css
      - 'src/**'
      - 'tests/e2e/global-visual-polish.spec.js'
      - 'tests/e2e/unidentified-expense-visual.spec.js'
      - 'tests/support/unidentified-expense-fixture.js'
      - 'tests/e2e/**-snapshots/**'
      - playwright.visual.config.js
      - package.json
      - package-lock.json
      - '.github/workflows/visual-regression.yml'
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - styles.css
      - 'src/**'
      - 'tests/e2e/global-visual-polish.spec.js'
      - 'tests/e2e/unidentified-expense-visual.spec.js'
      - 'tests/support/unidentified-expense-fixture.js'
      - 'tests/e2e/**-snapshots/**'
      - playwright.visual.config.js
      - package.json
      - package-lock.json
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Seis baselines críticos
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Atualizar golden aprovado da Fase 1
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 403 && github.actor != 'github-actions[bot]'
        run: >-
          npx --no-install playwright test tests/e2e/unidentified-expense-visual.spec.js
          --config=playwright.visual.config.js
          --project=desktop-chromium
          --grep "drawer e feedback"
          --update-snapshots

      - name: Versionar golden aprovado da Fase 1
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 403 && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/unidentified-expense-visual.spec.js-snapshots/drawer-despesa-a-identificar-desktop-chromium-linux.png
          if git diff --cached --quiet; then
            echo "Baseline já estava atualizado."
          else
            git commit -m "test(visual): atualizar baseline da retificação descoberta"
            git push origin HEAD:feat/ux-edicao-lancamentos-fase1-2026-10-01
          fi

      - name: Executar baselines visuais
        run: npm run test:visual

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 14
          if-no-files-found: warn
