name: Regenerar Ajv temporário

on:
  push:
    branches:
      - perf/operational-context-set-based-2026-09-29
    paths:
      - '.github/workflows/regenerate-ajv-temp.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Regenerar e validar Ajv
        shell: bash
        run: |
          set -euo pipefail
          npm run build:ajv
          cp vendor/ajv.js /tmp/ajv-first.js
          npm run build:ajv
          cmp --silent /tmp/ajv-first.js vendor/ajv.js
          grep -q 'Ajv 8.20.0' vendor/ajv.js
          grep -q 'RadarAjv' vendor/ajv.js

      - name: Registrar bundle e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-ci-bot"
          git config user.email "radar-ci-bot@users.noreply.github.com"
          git add vendor/ajv.js
          git rm .github/workflows/regenerate-ajv-temp.yml
          git commit -m "build: regenerate Ajv bundle after security patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
