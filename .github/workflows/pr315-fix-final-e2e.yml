name: PR315 corrigir locator final do Prontuário

on:
  push:
    branches:
      - feat/post-login-prontuario-competencia-2026-09-14
    paths:
      - '.github/workflows/pr315-fix-final-e2e.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/post-login-prontuario-competencia-2026-09-14
          fetch-depth: 0
      - name: Configurar Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Corrigir locator mutável
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/e2e/school-details-desktop.spec.js')
          source = path.read_text(encoding='utf-8')
          old = "const toggle = page.getByRole('button', { name: 'Exibir dados da unidade', exact: true });"
          new = "const toggle = page.locator('button[aria-controls=\"school-registration-details\"]');"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Esperava exatamente 1 locator mutável, encontrei {count}.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Validar teste direcionado
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/school-details-desktop.spec.js --project=desktop-chromium
      - name: Publicar correção e remover andaime
        run: |
          rm .github/workflows/pr315-fix-final-e2e.yml
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: estabilizar toggle dos dados da unidade'
          git push origin HEAD:feat/post-login-prontuario-competencia-2026-09-14
