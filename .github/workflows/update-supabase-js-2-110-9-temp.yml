name: Atualizar Supabase JS para 2.110.9 temporariamente

on:
  push:
    branches:
      - maintenance/supabase-js-2.110.9-20260805
    paths:
      - '.github/workflows/update-supabase-js-2-110-9-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Obter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/supabase-js-2.110.9-20260805

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar árvore reproduzível atual
        run: npm ci

      - name: Atualizar somente Supabase JS
        run: npm install --save-dev --save-exact @supabase/supabase-js@2.110.9

      - name: Alinhar import fixado da Edge Function
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'supabase/functions/team-account-management/index.ts';
          const before = fs.readFileSync(file, 'utf8');
          const after = before.replaceAll('@supabase/supabase-js@2.110.8', '@supabase/supabase-js@2.110.9');
          if (after === before) throw new Error('Import 2.110.8 não encontrado na Edge Function.');
          if (after.includes('@supabase/supabase-js@2.110.8')) throw new Error('Import antigo permaneceu na Edge Function.');
          fs.writeFileSync(file, after);
          NODE

      - name: Regenerar bundle oficial do navegador
        run: npm run build:supabase-client

      - name: Verificar escopo exato da atualização
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.devDependencies['@supabase/supabase-js'] !== '2.110.9') throw new Error('Supabase JS não ficou em 2.110.9.');
          if (pkg.devDependencies.supabase !== '2.110.0') throw new Error('Supabase CLI foi alterada indevidamente.');
          if (lock.packages[''].devDependencies['@supabase/supabase-js'] !== '2.110.9') throw new Error('Lockfile raiz não registra Supabase JS 2.110.9.');
          if (lock.packages[''].devDependencies.supabase !== '2.110.0') throw new Error('Lockfile alterou a Supabase CLI.');
          const bundle = fs.readFileSync('vendor/supabase-client.js', 'utf8');
          if (!bundle.includes('@supabase/supabase-js 2.110.9')) throw new Error('Bundle não identifica Supabase JS 2.110.9.');
          NODE
          node --test tests/unit/supabase-modernization.test.js
          npm run check:generated

      - name: Versionar somente os artefatos autorizados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/supabase-client.js supabase/functions/team-account-management/index.ts
          git diff --cached --quiet && { echo 'Nenhuma alteração gerada.'; exit 1; }
          git commit -m 'chore: atualizar Supabase JS para 2.110.9'
          git push origin HEAD:maintenance/supabase-js-2.110.9-20260805
