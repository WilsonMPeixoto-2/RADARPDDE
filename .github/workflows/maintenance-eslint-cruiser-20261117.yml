name: "Temporary - RADAR second safe tooling updates"
on:
  push:
    branches:
      - chore/deps-eslint-cruiser-security-20261117
    paths:
      - .github/workflows/maintenance-eslint-cruiser-20261117.yml

permissions:
  contents: write

concurrency:
  group: radar-second-deps-20261117
  cancel-in-progress: false

jobs:
  upgrade-validate-cleanup:
    if: github.ref == 'refs/heads/chore/deps-eslint-cruiser-security-20261117'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Confirm runtime and starting dependency versions
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
          node - <<'NODE'
          const p = require('./package.json');
          if (!process.version.startsWith('v24.')) throw Error('Node must remain 24');
          const {execFileSync}=require('node:child_process');
          if (!execFileSync('npm',['--version'],{encoding:'utf8'}).trim().startsWith('11.')) throw Error('npm must remain 11');
          for (const [pkg, version] of Object.entries({'eslint':'10.14.0','dependency-cruiser':'18.7.2'})) {
            if (p.devDependencies[pkg] !== version) throw Error('Base version mismatch: '+pkg+'='+p.devDependencies[pkg]);
          }
          NODE
      - name: Upgrade two approved devDependencies and regenerate lockfile with npm 11
        run: |
          npm install --save-dev --save-exact eslint@10.15.0 dependency-cruiser@18.8.0 --no-fund
          npm ci --no-fund
      - name: Reconcile hardcoded tooling contracts and decision inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'tests/unit/tooling-contract.test.js': {
                  "packageJson.devDependencies.eslint, '10.14.0'": "packageJson.devDependencies.eslint, '10.15.0'",
                  "packageJson.devDependencies['dependency-cruiser'], '18.7.2'": "packageJson.devDependencies['dependency-cruiser'], '18.8.0'",
              },
              'docs/TECHNOLOGY_CAPABILITIES_TRACKER.md': {
                  '`eslint@10.14.0`': '`eslint@10.15.0`',
                  '`dependency-cruiser@18.7.2`': '`dependency-cruiser@18.8.0`',
              },
          }
          for name, updates in changes.items():
              path=Path(name)
              content=path.read_text()
              for before, after in updates.items():
                  assert content.count(before) == 1, (name,before,content.count(before))
                  content=content.replace(before,after)
              path.write_text(content)
          PY
      - name: Refresh security audit and require zero vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > dependency-health/npm-audit.json
          node - <<'NODE'
          const audit=require('./dependency-health/npm-audit.json');
          const summary=audit.metadata?.vulnerabilities;
          if (!summary || summary.total !== 0) throw Error('Security audit must be clean: '+JSON.stringify(summary));
          console.log('npm audit: zero vulnerabilities');
          NODE
      - name: Remove temporary workflow from tree before verifying repository contracts
        run: git rm -- .github/workflows/maintenance-eslint-cruiser-20261117.yml
      - name: Validate complete readiness, architecture, properties and build
        shell: bash
        run: |
          set -euo pipefail
          npm run test:readiness
          npm run test:properties
          npm run test:network-failures
          npm run audit:exceljs-policy
          npm run check:generated
          npm run check:architecture
          npm run build:vercel
      - name: Commit only the five reviewed files, excluding workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json dependency-health/npm-audit.json docs/TECHNOLOGY_CAPABILITIES_TRACKER.md tests/unit/tooling-contract.test.js
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            '.github/workflows/maintenance-eslint-cruiser-20261117.yml',
            'package.json',
            'package-lock.json',
            'dependency-health/npm-audit.json',
            'docs/TECHNOLOGY_CAPABILITIES_TRACKER.md',
            'tests/unit/tooling-contract.test.js',
          }
          assert paths==expected,(paths,expected)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): update ESLint and dependency-cruiser with zero-audit inventory"
          git push origin HEAD:refs/heads/chore/deps-eslint-cruiser-security-20261117
