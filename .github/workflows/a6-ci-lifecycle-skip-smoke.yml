name: A6 - Testar atalho de ciclos sem Supabase (isolado)
on:
  push:
    branches:
      - experiment/ci-lifecycle-docs-only-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-guard:
    name: A6 - Docs pulados, mudancas sensiveis executadas
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Proteger sintaxe, CI e contrato de classificacao
        run: |
          node --check scripts/ci/classify-pr-impact.mjs
          node --test tests/unit/ci-impact-classification.test.js
      - name: Confirmar classificacao real desta branch (sempre full)
        env:
          RADAR_CI_BASE_SHA: 3bf71ef3e2e8dc2f1c6c08bf5dc011842f8be4d6
        run: |
          node scripts/ci/classify-pr-impact.mjs > /tmp/a6-real.json
          cat /tmp/a6-real.json
          node -e "const j=require('/tmp/a6-real.json'); if(j.scope!=='full'||j.mode!=='shadow')process.exit(1)"
      - name: Simular diff seguro e expor decisao
        id: safe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {classifyDiff,maySkipLifecycleForAuditDocs} from './scripts/ci/classify-pr-impact.mjs';
          const files=['docs/audits/2026-10-23-relatorio.md'];
          const canSkip=maySkipLifecycleForAuditDocs({...classifyDiff(files),files});
          if (!canSkip) throw Error('Doc de auditoria deveria poupar ciclo Supabase');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_full=${canSkip ? 'false' : 'true'}\n`);
          NODE
      - name: Guarda negativo - falha se executado
        if: ${{ steps.safe.outputs.run_full != 'false' }}
        run: exit 97
      - name: Confirmar caminho skip
        if: ${{ always() }}
        run: test "${{ steps.safe.outputs.run_full }}" = 'false'
      - name: Simular mudanca SQL e expor decisao
        id: critical
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {classifyDiff,maySkipLifecycleForAuditDocs} from './scripts/ci/classify-pr-impact.mjs';
          const files=['docs/audits/2026-10-23-relatorio.md','supabase/migrations/new.sql'];
          const canSkip=maySkipLifecycleForAuditDocs({...classifyDiff(files),files});
          if (canSkip) throw Error('SQL deveria executar Supabase');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_full=${canSkip ? 'false' : 'true'}\n`);
          NODE
      - name: Guarda positivo - caminho full realmente roda
        if: ${{ steps.critical.outputs.run_full != 'false' }}
        shell: bash
        run: echo A6_FULL_PATH_EXECUTED=true > "${RUNNER_TEMP}/a6-full-path"
      - name: Confirmar caminho full
        run: test -f "${RUNNER_TEMP}/a6-full-path"
