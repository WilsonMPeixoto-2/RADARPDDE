name: Gerar matriz funcional na branch

on:
  push:
    branches:
      - feat/matriz-funcional-ponta-a-ponta-20260805
    paths:
      - docs/reference/functional-contract-matrix.json
      - docs/reference/functional-contract-matrix/**
      - scripts/check-functional-contract-matrix.mjs
      - .github/workflows/generate-functional-matrix-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/matriz-funcional-ponta-a-ponta-20260805
          fetch-depth: 0
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gerar Markdown canônico
        run: node scripts/check-functional-contract-matrix.mjs --write
      - name: Versionar somente o arquivo gerado
        shell: bash
        run: |
          if git diff --quiet -- docs/reference/FUNCTIONAL_CONTRACT_MATRIX.md; then
            echo "A matriz gerada já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/FUNCTIONAL_CONTRACT_MATRIX.md
          git commit -m "docs: gerar visão da matriz funcional"
          git push origin HEAD:feat/matriz-funcional-ponta-a-ponta-20260805
