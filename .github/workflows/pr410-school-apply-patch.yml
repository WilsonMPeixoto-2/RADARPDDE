name: PR410 temporary school apply RED

on:
  push:
    branches:
      - refactor/simplify-operational-sync-2026-10-04
    paths:
      - .github/workflows/pr410-school-apply-patch.yml

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/simplify-operational-sync-2026-10-04
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Confirmar falha causal antes do GREEN
        shell: bash
        run: |
          set +e
          node --test tests/unit/school-operational-context-application.test.js > /tmp/pr410-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr410-red.log
          if [ "$status" -eq 0 ]; then
            echo "RED inválido: os testes passaram antes da implementação." >&2
            exit 1
          fi
          grep -Fq "loadSchoolOperationalContext is not a function" /tmp/pr410-red.log
          echo "RED confirmado: o contrato falha porque loadSchoolOperationalContext ainda não existe."
