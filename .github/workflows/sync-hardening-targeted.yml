name: Hardening específico de sincronização operacional

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/application/data-service.js'
      - 'src/integration/operational-realtime-invalidation.js'
      - 'src/integration/operational-write-feedback.js'
      - 'src/integration/product-extensions-bootstrap.js'
      - 'src/styles/operational-write-feedback.css'
      - 'tests/unit/incremental-state-application.test.js'
      - 'tests/unit/operational-realtime-invalidation.test.js'
      - 'tests/unit/operational-write-feedback.test.js'
      - 'tests/unit/product-extensions-loader-resilience.test.js'
      - 'tests/e2e/supabase-realtime-invalidation.spec.js'
      - 'package.json'
      - '.github/workflows/sync-hardening-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-hardening-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-contracts:
    name: Contratos exatos do hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar sintaxe somente dos módulos alterados
        run: |
          node --check src/application/data-service.js
          node --check src/integration/operational-realtime-invalidation.js
          node --check src/integration/operational-write-feedback.js
          node --check src/integration/product-extensions-bootstrap.js
          node --check tests/e2e/supabase-realtime-invalidation.spec.js

      - name: Provar contratos específicos da correção
        run: npm run test:sync-hardening

  realtime-composition:
    name: Duas sessões, Realtime real e degradação visível
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Configurar origem local da Edge Function
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env

      - name: Iniciar Supabase descartável
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Provar trigger e autorização do Broadcast operacional
        run: npx supabase test db supabase/tests/database/realtime-operational-invalidation.test.sql

      - name: Preparar duas identidades e runtime autenticado
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Provar Broadcast, edição, Abort, métricas e aviso de degradação
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: >-
          npx playwright test tests/e2e/supabase-realtime-invalidation.spec.js
          --project=desktop-chromium
          --workers=1
          --max-failures=1
          --timeout=90000

      - name: Restaurar configuração e encerrar Supabase
        if: always()
        run: |
          npm run generate:runtime-config || true
          rm -f supabase/functions/.env
          npm run supabase:stop || true
