name: Validar migration PR361 em Production

on:
  push:
    branches:
      - ops/apply-pr361-production-migration-2026-09-23
    paths:
      - ".github/workflows/apply-pr361-production-migration.yml"

permissions:
  contents: read

concurrency:
  group: production-migration-pr361-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Provar migration 20260922234500 em Production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASS_REMOTE: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: scnryinorqeucbfkioxo

    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar alvo e segredos
        shell: bash
        run: |
          set -euo pipefail
          test "${PROJECT_REF}" = 'scnryinorqeucbfkioxo'
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${PGPASS_REMOTE}"

      - name: Vincular Supabase Production
        run: npx --no-install supabase link --project-ref "${PROJECT_REF}" --password "${PGPASS_REMOTE}"

      - name: Confirmar histórico e contrato pós-aplicação
        run: npx --no-install supabase db query --linked --file supabase/verification/remote-post-apply.sql

      - name: Provar RPC instalada em Production
        shell: bash
        run: |
          cat > /tmp/pr361-function-check.sql <<'SQL'
          do $$
          declare
            v_definition text;
          begin
            select pg_get_functiondef(
              'public.register_invoice_document_attempt(jsonb,integer,jsonb,integer,jsonb,integer,jsonb,jsonb,integer,jsonb)'::regprocedure
            ) into v_definition;

            if position('select nullif(name, '''') from public.programs' in v_definition) = 0
               or position('p_invoice ->> ''description''' in v_definition) = 0
               or position('identificação como bem permanente exige patrimônio novo e correspondente à despesa' in v_definition) = 0 then
              raise exception 'PR361_RPC_CONTRACT_NOT_INSTALLED';
            end if;

            if (select count(*) from supabase_migrations.schema_migrations) <> 55
               or not exists (
                 select 1 from supabase_migrations.schema_migrations
                 where version = '20260922234500'
               ) then
              raise exception 'PR361_MIGRATION_HISTORY_NOT_INSTALLED';
            end if;
          end
          $$;
          SQL
          npx --no-install supabase db query --linked --file /tmp/pr361-function-check.sql

      - name: Executar pgTAP específico da identificação fiscal em Production
        run: npx --no-install supabase test db supabase/tests/database/invoice-document-analysis-pendency.test.sql --linked

      - name: Resumo
        if: always()
        run: |
          {
            echo '### Validação remota PR #361'
            echo
            echo '- migration esperada: `20260922234500_fix_permanent_identification_asset_description`'
            echo '- histórico esperado: 55 migrations'
            echo '- contrato: descrição patrimonial canônica + guardas preservadas'
            echo '- prova funcional: pgTAP específico em Production'
          } >> "${GITHUB_STEP_SUMMARY}"
