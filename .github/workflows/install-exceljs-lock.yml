name: Instalar gerador Excel seguro

on:
  pull_request:
    paths:
      - '.github/workflows/install-exceljs-lock.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-excel-writer.mjs'
      - 'scripts/apply-write-excel-file-certification-patch.mjs'
      - 'src/domain/excel-integral-certification.js'
      - 'vendor/write-excel-file.min.js'

permissions:
  contents: write

jobs:
  instalar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Remover ExcelJS e instalar write-excel-file
        run: |
          npm uninstall exceljs
          npm install --save-exact write-excel-file@4.1.1

      - name: Registrar scripts de build e verificação
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          delete pkg.scripts['build:exceljs'];
          pkg.scripts['build:excel-writer'] = 'node scripts/build-excel-writer.mjs';
          pkg.scripts.check = pkg.scripts.check
            .replace(/\s*&& node --check scripts\/build-exceljs\.mjs/g, '')
            .replace(/\s*&& node --check scripts\/build-excel-writer\.mjs/g, '');
          pkg.scripts.check += ' && node --check scripts/build-excel-writer.mjs';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Adaptar certificação ao novo gerador
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'function excelJsCellValue' src/domain/excel-integral-certification.js; then
            node scripts/apply-write-excel-file-certification-patch.mjs
          else
            echo 'Certificação do novo gerador já aplicada.'
          fi

      - name: Gerar bundle oficial para o navegador
        run: npm run build:excel-writer

      - name: Remover bundle anterior
        run: rm -f vendor/exceljs.min.js

      - name: Confirmar segurança e reprodutibilidade
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies?.['write-excel-file']!=='4.1.1'||p.dependencies?.exceljs) process.exit(1);"
          node -e "const p=require('./package-lock.json'); if(p.packages?.['node_modules/write-excel-file']?.version!=='4.1.1'||p.packages?.['node_modules/exceljs']) process.exit(1);"
          npm audit --audit-level=high
          test -s vendor/write-excel-file.min.js
          grep -q 'writeXlsxFile' vendor/write-excel-file.min.js
          grep -q 'inspectSmeWriterContract' src/domain/excel-integral-certification.js

      - name: Gravar artefatos na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json vendor src/domain/excel-integral-certification.js; then
            echo 'Gerador Excel seguro e certificação já estão atualizados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package.json package-lock.json vendor src/domain/excel-integral-certification.js
          git commit -m 'build: substituir ExcelJS por write-excel-file 4.1.1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
