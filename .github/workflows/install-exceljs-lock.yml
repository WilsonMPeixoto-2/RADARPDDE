name: Preparar lockfile do ExcelJS

on:
  pull_request:
    paths:
      - '.github/workflows/install-exceljs-lock.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  gerar-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Gerar package.json e package-lock.json reproduzíveis
        run: npm install --save-exact --package-lock-only exceljs@4.4.0

      - name: Confirmar dependência
        run: node -e "const p=require('./package.json'); if(p.dependencies?.exceljs!=='4.4.0') process.exit(1);"

      - name: Publicar arquivos para integração
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exceljs-package-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
