name: Instalar ExcelJS e atualizar lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/install-exceljs-lock.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  instalar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar ExcelJS com versão fixada
        run: npm install --save-exact exceljs@4.4.0

      - name: Confirmar dependência e lockfile
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies?.exceljs!=='4.4.0') process.exit(1);"
          node -e "const p=require('./package-lock.json'); if(p.packages?.['node_modules/exceljs']?.version!=='4.4.0') process.exit(1);"

      - name: Gravar instalação na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'ExcelJS já está instalado e o lockfile está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: instalar ExcelJS 4.4.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
