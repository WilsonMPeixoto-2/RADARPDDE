name: Instalar ExcelJS e gerar bundle

on:
  pull_request:
    paths:
      - '.github/workflows/install-exceljs-lock.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-exceljs.mjs'
      - 'vendor/exceljs.min.js'

permissions:
  contents: write

jobs:
  instalar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar ExcelJS com versão fixada
        run: npm install --save-exact exceljs@4.4.0

      - name: Registrar scripts de build e verificação
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts['build:exceljs'] = 'node scripts/build-exceljs.mjs';
          if (!pkg.scripts.check.includes('node --check scripts/build-exceljs.mjs')) {
            pkg.scripts.check += ' && node --check scripts/build-exceljs.mjs';
          }
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Gerar bundle oficial para o navegador
        run: npm run build:exceljs

      - name: Confirmar dependência, lockfile e bundle
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies?.exceljs!=='4.4.0'||p.scripts?.['build:exceljs']!=='node scripts/build-exceljs.mjs') process.exit(1);"
          node -e "const p=require('./package-lock.json'); if(p.packages?.['node_modules/exceljs']?.version!=='4.4.0') process.exit(1);"
          test -s vendor/exceljs.min.js
          grep -q 'ExcelJS' vendor/exceljs.min.js

      - name: Gravar artefatos na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json vendor/exceljs.min.js; then
            echo 'ExcelJS e o bundle já estão atualizados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/exceljs.min.js
          git commit -m 'build: gerar bundle do ExcelJS 4.4.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
