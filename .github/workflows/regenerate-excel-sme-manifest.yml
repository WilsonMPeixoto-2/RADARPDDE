name: Regenerar manifesto do Excel SME

on:
  pull_request:
    paths:
      - '.github/workflows/regenerate-excel-sme-manifest.yml'

permissions:
  contents: write

jobs:
  regenerar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Regenerar e conferir manifesto
        run: |
          node scripts/generate-excel-certification-evidence.mjs
          node scripts/generate-excel-certification-evidence.mjs --check

      - name: Remover workflow auxiliar
        run: rm -f .github/workflows/regenerate-excel-sme-manifest.yml

      - name: Gravar evidência na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/evidence/excel-certification/synthetic-manifest.json .github/workflows/regenerate-excel-sme-manifest.yml
          git commit -m 'test: regenerar manifesto do Excel SME canônico'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
