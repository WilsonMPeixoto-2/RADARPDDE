name: Materializar lockfile de tooling

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tests/unit/tooling-contract.test.js
      - docs/TECHNOLOGY_CAPABILITIES_TRACKER.md
      - .github/workflows/materialize-tooling-lockfile.yml

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Atualizar lockfile a partir do manifesto
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Instalação reproduzível
        run: npm ci

      - name: Contrato de tooling
        run: node --test tests/unit/tooling-contract.test.js

      - name: Arquitetura
        run: npm run check:architecture

      - name: ESLint de segurança
        run: npm run lint:security

      - name: Inventário Knip
        run: npm run analyze:unused

      - name: Gravar lockfile materializado na branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(tooling): materializar lockfile atualizado"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
