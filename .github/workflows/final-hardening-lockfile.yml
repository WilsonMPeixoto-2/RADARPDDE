name: Regenerar lockfile do hardening

on:
  push:
    branches:
      - chore/final-hardening-2026-08-17
    paths:
      - package.json
      - .github/workflows/final-hardening-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v6
        with:
          ref: chore/final-hardening-2026-08-17
          fetch-depth: 0

      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar árvore reproduzível
        run: npm ci

      - name: Regenerar cliente Supabase do navegador
        run: npm run build:supabase-client

      - name: Commitar somente artefatos reproduzíveis alterados
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json vendor/supabase-client.js; then
            echo "Lockfile e bundle já estavam atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json vendor/supabase-client.js
          git commit -m "build: regenerar lockfile e bundle Supabase"
          git push origin HEAD:chore/final-hardening-2026-08-17
