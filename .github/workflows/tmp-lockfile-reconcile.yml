name: TEMP lockfile reconcile

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/tmp-lockfile-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerar lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Exportar lockfile
        shell: bash
        run: |
          echo 'LOCKFILE_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'
