name: Fechar documentação da Fase 2 v2

on:
  push:
    branches:
      - docs/close-phase2-production-2026-10-02
    paths:
      - '.github/workflows/temp-close-phase2-docs-v2.yml'

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/close-phase2-production-2026-10-02
          fetch-depth: 0

      - name: Reaplicar patch documental e corrigir apenas whitespace introduzido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source = Path('.github/workflows/temp-close-phase2-docs.yml').read_text()
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n\n          git diff --check"
          if marker_start not in source or marker_end not in source:
              raise SystemExit('Não foi possível localizar o patch Python no workflow v1')
          block = source.split(marker_start, 1)[1].split(marker_end, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, '<phase2-doc-closeout>', 'exec'), {})

          result = subprocess.run(['git', 'diff', '--check'], text=True, capture_output=True)
          diagnostics = (result.stdout + '\n' + result.stderr).splitlines()
          targets = []
          for line in diagnostics:
              match = re.match(r'^(.*?):(\d+): trailing whitespace\.$', line)
              if match:
                  targets.append((Path(match.group(1)), int(match.group(2))))
              elif line and ('trailing whitespace' not in line) and not line.startswith('+'):
                  raise SystemExit('git diff --check encontrou erro não tratado: ' + line)

          by_file = {}
          for path, line_no in targets:
              by_file.setdefault(path, set()).add(line_no)
          for path, line_numbers in by_file.items():
              lines = path.read_text().splitlines(keepends=True)
              for line_no in line_numbers:
                  idx = line_no - 1
                  ending = '\n' if lines[idx].endswith('\n') else ''
                  lines[idx] = lines[idx].rstrip(' \t\r\n') + ending
              path.write_text(''.join(lines))

          subprocess.run(['git', 'diff', '--check'], check=True)
          PY

          git diff --stat

      - name: Registrar fechamento documental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add docs/CURRENT_STAGE.md docs/README.md docs/reference/STATUS_DOCUMENTOS.md docs/handoff/2026-10-01-controller-type-retification.md docs/evidence/2026-10-01-controller-type-retification/REPORT.md
          git commit -m 'docs: encerrar Fase 2 após publicação em Production'
          git push origin HEAD:docs/close-phase2-production-2026-10-02
