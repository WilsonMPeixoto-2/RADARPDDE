name: Verificar reconciliação da migration SME

on:
  push:
    branches:
      - agent/reconcile-sme-migration-history
    paths:
      - .github/workflows/verify-sme-migration-history.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-sme-migration-history-production
  cancel-in-progress: false

env:
  SUPABASE_TELEMETRY_DISABLED: '1'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PGPASS_REMOTE: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_REF: scnryinorqeucbfkioxo
  PR_NUMBER: '109'

jobs:
  verify-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar migration canônica local
        run: |
          set -euo pipefail
          test "${PROJECT_REF}" = 'scnryinorqeucbfkioxo'
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo 'SUPABASE_ACCESS_TOKEN ausente.' >&2; exit 1; }
          test -n "${PGPASS_REMOTE}" || { echo 'SUPABASE_DB_PASSWORD ausente.' >&2; exit 1; }
          test -f supabase/migrations/20260728182226_sme_access_governance.sql
          test ! -e supabase/migrations/20260728190344_sme_access_governance.sql
          test "$(python - <<'PY'
          from pathlib import Path
          import hashlib
          content = Path('supabase/migrations/20260728182226_sme_access_governance.sql').read_text(encoding='utf-8').rstrip('\n')
          print(hashlib.sha256(content.encode()).hexdigest())
          PY
          )" = 'cddda35f4cc08b92093071f888cf958ae052ae82775c91366e4d729434427f0e'

      - name: Vincular Production
        run: npx --no-install supabase link --project-ref "${PROJECT_REF}" --password "${PGPASS_REMOTE}"

      - name: Validar histórico remoto e conteúdo reconstruído
        run: |
          cat > /tmp/sme-migration-verification.sql <<'SQL'
          do $$
          declare
              migration_hash text;
              migration_length integer;
          begin
              if (select count(*) from supabase_migrations.schema_migrations) <> 25 then
                  raise exception 'Contagem remota inesperada.';
              end if;

              if exists (
                  select 1 from supabase_migrations.schema_migrations
                  where version = '20260728190344'
              ) then
                  raise exception 'O registro derivado ainda existe.';
              end if;

              select
                  encode(extensions.digest(array_to_string(statements, E';\n\n') || ';', 'sha256'), 'hex'),
                  length(array_to_string(statements, E';\n\n') || ';')
              into migration_hash, migration_length
              from supabase_migrations.schema_migrations
              where version = '20260728182226'
                and name = 'sme_access_governance';

              if migration_length is distinct from 1411 then
                  raise exception 'Comprimento reconstruído divergente: %.', migration_length;
              end if;

              if migration_hash is distinct from 'cddda35f4cc08b92093071f888cf958ae052ae82775c91366e4d729434427f0e' then
                  raise exception 'Hash reconstruído divergente: %.', migration_hash;
              end if;
          end
          $$;
          SQL
          npx --no-install supabase db query --linked --file /tmp/sme-migration-verification.sql 2>&1 \
            | tee /tmp/sme-migration-verification.txt
          npx --no-install supabase migration list --linked --password "${PGPASS_REMOTE}" 2>&1 \
            | tee /tmp/sme-migration-list.txt

      - name: Simular próximo db push sem alterar Production
        run: |
          set -o pipefail
          npx --no-install supabase db push --linked --dry-run --password "${PGPASS_REMOTE}" 2>&1 \
            | tee /tmp/sme-migration-dry-run.txt
          grep -q 'Remote database is up to date' /tmp/sme-migration-dry-run.txt

      - name: Registrar evidência no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${PR_NUMBER}" --body "✅ Verificação remota somente leitura concluída no run ${GITHUB_RUN_ID}: 25 migrations alinhadas; versão canônica 20260728182226 presente; versão derivada 20260728190344 ausente; SQL reconstruído com 1.411 caracteres e SHA-256 canônico; db push --dry-run confirmou Production atualizada."

      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sme-migration-history-verification-${{ github.run_id }}
          path: |
            /tmp/sme-migration-verification.txt
            /tmp/sme-migration-list.txt
            /tmp/sme-migration-dry-run.txt
          if-no-files-found: warn
          retention-days: 30
