name: Aplicar atualizações da Rodada 1

on:
  push:
    branches:
      - chore/rodada-1-baixo-risco-20260801
    paths:
      - .github/workflows/rodada-1-aplicar-atualizacoes.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter branch da rodada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/rodada-1-baixo-risco-20260801

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Aplicar versões e integrações pertinentes
        shell: bash
        run: |
          python <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['devDependencies']['acorn'] = '8.18.0'
          package['devDependencies']['eslint'] = '10.8.0'
          package['scripts']['lint:security:html'] = (
              'eslint app.js config.js "src/**/*.js" --format html '
              '--output-file dependency-health/eslint-security.html --max-warnings 42'
          )
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = root / 'scripts/audit-functional-persistence.js'
          audit = audit_path.read_text(encoding='utf-8')

          inline_block = r'''function sourceLocationAt(text, offset) {
              const prefix = String(text || '').slice(0, offset);
              const line = (prefix.match(/\n/g) || []).length + 1;
              const lastBreak = prefix.lastIndexOf('\n');
              return {
                  line,
                  column: lastBreak === -1 ? prefix.length : prefix.length - lastBreak - 1
              };
          }

          function decodeHtmlEntities(value) {
              return String(value || '')
                  .replace(/&#x([0-9a-f]+);/gi, (_match, code) => String.fromCodePoint(Number.parseInt(code, 16)))
                  .replace(/&#(\d+);/g, (_match, code) => String.fromCodePoint(Number.parseInt(code, 10)))
                  .replace(/&quot;/gi, '"')
                  .replace(/&apos;|&#39;/gi, "'")
                  .replace(/&lt;/gi, '<')
                  .replace(/&gt;/gi, '>')
                  .replace(/&amp;/gi, '&');
          }

          function inspectInlineHandlers(text, file = '<markup>') {
              const handlers = new Set();
              const syntaxErrors = [];
              const pattern = /\bon(?:click|submit|change|input|blur|keydown|keyup)\s*=\s*(?:"([^"\r\n]*)"|'([^'\r\n]*)')/gi;
              let match;

              while ((match = pattern.exec(text)) !== null) {
                  const raw = match[1] ?? match[2] ?? '';
                  const quote = match[1] !== undefined ? '"' : "'";
                  const assignmentIndex = match[0].indexOf('=');
                  const quoteIndex = match[0].indexOf(quote, assignmentIndex);
                  const rawOffset = match.index + quoteIndex + 1;
                  const decoded = decodeHtmlEntities(raw);
                  const nameMatch = decoded.trimStart().match(/^([A-Za-z_$][\w$]*)/);

                  if (nameMatch && !INLINE_GLOBALS.has(nameMatch[1])) {
                      handlers.add(nameMatch[1]);
                  }

                  if (!decoded.trim() || decoded.includes('${')) continue;

                  const startLocation = sourceLocationAt(text, rawOffset);
                  try {
                      acorn.parse(decoded, {
                          ecmaVersion: 'latest',
                          sourceType: 'script',
                          allowAwaitOutsideFunction: true,
                          allowReturnOutsideFunction: true,
                          locations: true,
                          startLocation
                      });
                  } catch (error) {
                      syntaxErrors.push({
                          file,
                          line: error.loc?.line || startLocation.line,
                          column: error.loc?.column ?? startLocation.column,
                          message: String(error.message || 'JavaScript inválido')
                              .replace(/\s*\(\d+:\d+\)\s*$/, '')
                      });
                  }
              }

              return {
                  handlers: [...handlers].sort(),
                  syntaxErrors
              };
          }

          function extractFormControls'''

          audit, count = re.subn(
              r'function extractInlineHandlers\(text\) \{.*?\n\}\n\nfunction extractFormControls',
              inline_block,
              audit,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Não foi possível substituir o extrator de handlers inline.')

          inspect_markup = r'''function inspectMarkup(files) {
              const htmlPath = path.join(ROOT, 'index.html');
              const html = fs.existsSync(htmlPath) ? fs.readFileSync(htmlPath, 'utf8') : '';
              const jsText = files.map(file => file.source).join('\n');
              const allText = `${html}\n${jsText}`;
              const inlineInspections = [
                  inspectInlineHandlers(html, 'index.html'),
                  ...files.map(file => inspectInlineHandlers(file.source, file.file))
              ];
              const handlers = [...new Set(
                  inlineInspections.flatMap(inspection => inspection.handlers)
              )].sort();
              const syntaxErrors = inlineInspections.flatMap(inspection => inspection.syntaxErrors);
              const controls = extractFormControls(allText)
                  .filter((control, index, collection) => (
                      collection.findIndex(candidate => candidate.id === control.id) === index
                  ));

              const unusedControls = controls
                  .filter(control => {
                      const escaped = control.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                      const getById = new RegExp(`getElementById\\(\\s*['\"]${escaped}['\"]\\s*\\)`);
                      const selector = new RegExp(`querySelector(?:All)?\\(\\s*['\"][^'\"]*#${escaped}(?:[^'\"]*)['\"]\\s*\\)`);
                      const literalReference = new RegExp(`['\"]${escaped}['\"]`);
                      return !getById.test(jsText) && !selector.test(jsText) && !literalReference.test(jsText);
                  })
                  .sort((left, right) => left.id.localeCompare(right.id));

              return { handlers, controls, unusedControls, syntaxErrors };
          }

          function buildFindings'''

          audit, count = re.subn(
              r'function inspectMarkup\(files\) \{.*?\n\}\n\nfunction buildFindings',
              inspect_markup,
              audit,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Não foi possível integrar a inspeção de handlers ao markup.')

          marker = "    markupInspection.handlers.forEach(handler => {\n"
          addition = (
              "    markupInspection.syntaxErrors.forEach(error => {\n"
              "        findings.push(\n"
              "            `Handler inline com JavaScript inválido: ${error.file}:${error.line}:${error.column} `\n"
              "            + `(${error.message}).`\n"
              "        );\n"
              "    });\n\n"
          )
          if marker not in audit:
              raise SystemExit('Ponto de integração dos achados de markup não encontrado.')
          audit = audit.replace(marker, addition + marker, 1)

          report_marker = "        inlineHandlers: markupInspection.handlers,\n        formControls: markupInspection.controls,\n"
          report_replacement = (
              "        inlineHandlers: markupInspection.handlers,\n"
              "        inlineHandlerSyntaxErrors: markupInspection.syntaxErrors,\n"
              "        formControls: markupInspection.controls,\n"
          )
          if report_marker not in audit:
              raise SystemExit('Contrato do relatório de auditoria não encontrado.')
          audit = audit.replace(report_marker, report_replacement, 1)

          export_marker = "    inspectJavaScript,\n    inspectMarkup\n"
          export_replacement = "    inspectJavaScript,\n    inspectInlineHandlers,\n    inspectMarkup\n"
          if export_marker not in audit:
              raise SystemExit('Exportações do auditor não encontradas.')
          audit = audit.replace(export_marker, export_replacement, 1)
          audit_path.write_text(audit, encoding='utf-8')

          old_checkout = '9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0'
          new_checkout = '3d3c42e5aac5ba805825da76410c181273ba90b1'
          replaced = 0
          for workflow in (root / '.github/workflows').glob('*.yml'):
              content = workflow.read_text(encoding='utf-8')
              occurrences = content.count(old_checkout)
              if occurrences:
                  workflow.write_text(content.replace(old_checkout, new_checkout), encoding='utf-8')
                  replaced += occurrences
          if replaced == 0:
              raise SystemExit('Nenhuma referência do checkout 7.0.0 foi localizada.')
          if any(old_checkout in path.read_text(encoding='utf-8') for path in (root / '.github/workflows').glob('*.yml')):
              raise SystemExit('Ainda há workflow usando checkout 7.0.0.')

          health_path = root / '.github/workflows/dependency-health.yml'
          health = health_path.read_text(encoding='utf-8')
          directory_step = "      - name: Preparar diretório de evidências\n        run: mkdir -p dependency-health\n"
          html_step = (
              directory_step
              + "\n      - name: Gerar relatório HTML do lint de segurança\n"
              + "        run: npm run lint:security:html\n"
          )
          if directory_step not in health:
              raise SystemExit('Etapa de evidências do workflow de dependências não encontrada.')
          health = health.replace(directory_step, html_step, 1)
          summary_marker = '          echo "### Saúde das dependências" >> "${GITHUB_STEP_SUMMARY}"\n'
          summary_line = '          echo "- ESLint: relatório HTML navegável preservado como evidência da rodada." >> "${GITHUB_STEP_SUMMARY}"\n'
          if summary_marker not in health:
              raise SystemExit('Resumo do workflow de dependências não encontrado.')
          health = health.replace(summary_marker, summary_marker + summary_line, 1)
          health_path.write_text(health, encoding='utf-8')
          PY

      - name: Regenerar lockfile sem executar scripts de instalação
        run: npm install --package-lock-only --ignore-scripts

      - name: Validar implementação dirigida pelo teste
        run: |
          npm ci
          node --test tests/unit/audit-functional-persistence-contract.test.js
          npm run check
          mkdir -p dependency-health
          npm run lint:security:html

      - name: Registrar alterações reproduzíveis na branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/audit-functional-persistence.js tests/unit/audit-functional-persistence-contract.test.js .github/workflows
          git commit -m 'chore: aplicar atualizações técnicas da rodada 1'
          git push origin HEAD:chore/rodada-1-baixo-risco-20260801
