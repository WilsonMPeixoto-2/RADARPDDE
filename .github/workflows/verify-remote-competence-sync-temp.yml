name: Verificar sincronização de competências remotas

on:
  push:
    branches:
      - fix/sync-remote-competences-20260806
    paths:
      - app.js
      - tests/e2e/exercise-management.spec.js
      - .github/workflows/verify-remote-competence-sync-temp.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sync-remote-competences-20260806

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências e Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar regressão de competências
        run: >-
          npx playwright test
          tests/e2e/exercise-management.spec.js
          --project=desktop-chromium
          --reporter=line
