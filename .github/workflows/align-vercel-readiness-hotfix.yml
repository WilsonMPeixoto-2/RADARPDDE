name: Alinhar readiness ao Build Output API

on:
  push:
    branches:
      - fix/excel-sme-build-output-api-20260803
    paths:
      - '.github/workflows/align-vercel-readiness-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: align-vercel-readiness-hotfix
  cancel-in-progress: true

jobs:
  alinhar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/excel-sme-build-output-api-20260803

      - name: Atualizar contrato do readiness
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const target = 'scripts/check-supabase-readiness.js';
          let source = fs.readFileSync(target, 'utf8');

          const artifactNeedle = "    'scripts/build-vercel.mjs',\n";
          const artifactReplacement = [
            "    'scripts/build-vercel.mjs',",
            "    'scripts/build-vercel-output.mjs',",
            "    'scripts/verify-excel-sme-template.mjs',",
            ''
          ].join('\n');
          if (!source.includes(artifactNeedle)) {
            throw new Error('Ponto de inclusão dos artefatos Vercel não encontrado.');
          }
          source = source.replace(artifactNeedle, artifactReplacement);

          const oldContract = [
            "    if (vercelConfig?.buildCommand !== 'npm run build:vercel') findings.push('A Vercel deve executar npm run build:vercel.');",
            "    if (vercelConfig?.outputDirectory !== 'dist') findings.push('A Vercel deve publicar exclusivamente o diretório dist.');"
          ].join('\n');
          const newContract = [
            "    const buildCommand = String(vercelConfig?.buildCommand || '');",
            "    if (!buildCommand.includes('node scripts/build-vercel.mjs')) {",
            "        findings.push('A Vercel deve gerar o artefato público versionado em dist.');",
            "    }",
            "    if (!buildCommand.includes('node scripts/build-vercel-output.mjs')) {",
            "        findings.push('A Vercel deve gerar .vercel/output pela Build Output API.');",
            "    }",
            "    if (Object.prototype.hasOwnProperty.call(vercelConfig || {}, 'outputDirectory')) {",
            "        findings.push('A configuração Build Output API não deve declarar outputDirectory paralelo.');",
            "    }"
          ].join('\n');
          if (!source.includes(oldContract)) {
            throw new Error('Contrato Vercel antigo não encontrado.');
          }
          source = source.replace(oldContract, newContract);

          fs.writeFileSync(target, source);
          fs.rmSync('.github/workflows/align-vercel-readiness-hotfix.yml');
          NODE

      - name: Validar o readiness atualizado
        run: |
          node --check scripts/check-supabase-readiness.js
          node scripts/check-supabase-readiness.js

      - name: Registrar a correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-supabase-readiness.js .github/workflows/align-vercel-readiness-hotfix.yml
          git commit -m 'fix: alinhar readiness à Build Output API da Vercel'
          git push origin HEAD:fix/excel-sme-build-output-api-20260803
