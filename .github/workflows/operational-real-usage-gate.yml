name: Uso real operacional com volume semelhante a Production

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'config*.js'
      - 'src/domain/**'
      - 'src/application/**'
      - 'src/data/**'
      - 'src/integration/**'
      - 'src/styles/**'
      - 'styles.css'
      - 'src/integration/auth-bootstrap.js'
      - 'src/integration/operational-context-refresh.js'
      - 'src/integration/operational-realtime-invalidation.js'
      - 'src/integration/operational-write-feedback.js'
      - 'supabase/migrations/**'
      - 'supabase/fixtures/operational-production-shape.sql'
      - 'supabase/fixtures/operational-session-contexts.sql'
      - 'tests/unit/operational-real-usage-session.test.js'
      - 'tests/e2e/operational-production-shape-performance.spec.js'
      - 'tests/support/performance-journey-observer.js'
      - 'tests/support/operational-session-observer.js'
      - 'tests/e2e/operational-sustained-sessions.spec.js'
      - 'tests/e2e/operational-refresh-visibility.spec.js'
      - 'tests/e2e/operational-refresh-focus.spec.js'
      - 'scripts/bootstrap-operational-session-fixtures.mjs'
      - 'scripts/operational-stat-snapshot.sql'
      - 'tests/unit/operational-stale-read-amplification.test.js'
      - 'tests/unit/operational-realtime-slow-read-window.test.js'
      - 'tests/unit/operational-focus-inflight.test.js'
      - 'tests/unit/operational-session-comparison.test.js'
      - 'tests/unit/operational-document-attempt-authority.test.js'
      - 'tests/e2e/operational-cross-school-refresh.spec.js'
      - 'scripts/compare-operational-sessions.mjs'
      - '.github/workflows/operational-real-usage-gate.yml'
  workflow_dispatch:
    inputs:
      rounds:
        description: Rodadas por escritor (40 diagnóstico curto; 400 estado acumulado)
        type: choice
        options: ['400', '40']
        default: '400'

permissions:
  contents: read

concurrency:
  group: operational-real-usage-${{ github.ref }}
  # Checkpoints de análise não devem apagar uma reprodução ainda em andamento.
  cancel-in-progress: false

jobs:
  sustained-browser-comparison:
    name: Stress sustentado legado (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      RADAR_OPERATIONAL_VARIANT: ${{ matrix.variant }}
      RADAR_E2E_SUPABASE_LOCAL: '1'
      RADAR_E2E_SUSTAINED_OPERATIONAL: '1'
      RADAR_OPERATIONAL_ROUNDS: ${{ inputs.rounds || '400' }}
    steps:
      - name: Obter candidato e baseline fixo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Instalar ferramentas fixadas
        run: npm ci
      - name: Fixar a raiz do produto testado
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RADAR_OPERATIONAL_VARIANT" == baseline ]]; then
            runtime_root="${GITHUB_WORKSPACE}/.operational-baseline"
            # A comparação corrente parte da versão realmente publicada após o
            # PR #408, não da antiga baseline #406 usada na descoberta inicial.
            git worktree add --detach "$runtime_root" d9bf67f7d8a1ce2e468ec3c793ff992d8e10dfd6
            npm ci --prefix "$runtime_root"
          else
            runtime_root="$GITHUB_WORKSPACE"
          fi
          printf 'RADAR_OPERATIONAL_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"
          printf 'RADAR_SERVE_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Iniciar backend correspondente ao produto
        working-directory: ${{ env.RADAR_OPERATIONAL_ROOT }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/start-disposable-supabase-ci.sh"
          npm run supabase:reset
      - name: Preparar volume calibrado
        run: docker exec -i supabase_db_radar-pdde psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/fixtures/operational-production-shape.sql
      - name: Preparar seis escolas e carteiras distintas
        run: docker exec -i supabase_db_radar-pdde psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/fixtures/operational-session-contexts.sql
      - name: Preparar seis Controladores e Assistente sem credenciais Production
        working-directory: ${{ env.RADAR_OPERATIONAL_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx --no-install supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          export RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true
          export RADAR_SUPABASE_URL="$API_URL"
          export RADAR_SUPABASE_ADMIN_KEY="$SERVICE_ROLE_KEY"
          export RADAR_AUTH_FIXTURE_PASSWORD="$FIXTURE_PASSWORD"
          node "$GITHUB_WORKSPACE/scripts/bootstrap-local-auth-fixtures.mjs"
          node "$GITHUB_WORKSPACE/scripts/bootstrap-operational-session-fixtures.mjs"
          unset RADAR_SUPABASE_ADMIN_KEY
          RADAR_DATA_MODE=supabase-preview RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true RADAR_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          node "$GITHUB_WORKSPACE/scripts/generate-runtime-config.mjs" --output "$RADAR_OPERATIONAL_ROOT/config.runtime.js"
          printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "$FIXTURE_PASSWORD" >> "$GITHUB_ENV"
      - name: Registrar baseline SQL sem reset
        id: sql-baseline
        run: |
          docker exec supabase_db_radar-pdde psql -X -q -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'create extension if not exists pg_stat_statements'
          docker exec -i supabase_db_radar-pdde psql -X -qAt -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/operational-stat-snapshot.sql > "$RUNNER_TEMP/operational-pg-stat-before.json"
      - name: Executar stress histórico e medir a cadeia completa
        run: npx playwright test tests/e2e/operational-sustained-sessions.spec.js --project=desktop-chromium --workers=1 --retries=0
      - name: Preservar delta SQL e separar aborts de execução no banco
        if: ${{ always() && steps.sql-baseline.outcome == 'success' }}
        run: |
          mkdir -p test-results/operational-sustained
          cp "$RUNNER_TEMP/operational-pg-stat-before.json" test-results/operational-sustained/pg-stat-before.json
          docker exec -i supabase_db_radar-pdde psql -X -qAt -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/operational-stat-snapshot.sql > test-results/operational-sustained/pg-stat-after.json
      - name: Provar relevância entre escolas, pico realista e colaboração Controlador-Assistente
        # Executar após o snapshot SQL mantém a comparação longa histórica inalterada.
        run: npx playwright test tests/e2e/operational-cross-school-refresh.spec.js --project=desktop-chromium --workers=1 --retries=0 --output=test-results/cross-school-browser
      - name: Preservar resultados mesmo se a jornada falhar
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-sustained-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Preservar métricas pequenas separadas dos vídeos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-metrics-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            test-results/operational-sustained/
            test-results/**/observer-*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Encerrar pilha descartável
        if: always()
        working-directory: ${{ env.RADAR_OPERATIONAL_ROOT }}
        run: npx --no-install supabase stop --no-backup

  sustained-session-contracts:
    name: Sessões sustentadas, escrita e invalidação
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Provar jornada concorrente sustentada
        run: node --test tests/unit/operational-real-usage-session.test.js tests/unit/production-refresh-stability.test.js tests/unit/operational-realtime-invalidation.test.js tests/unit/operational-stale-read-amplification.test.js tests/unit/operational-realtime-slow-read-window.test.js tests/unit/operational-focus-inflight.test.js tests/unit/operational-session-comparison.test.js tests/unit/operational-document-attempt-authority.test.js

      - name: Instalar Chromium para continuidade de foco
        run: npx playwright install --with-deps chromium

      - name: Preservar foco, edição, scroll e painel no refresh
        run: npx playwright test tests/e2e/operational-refresh-focus.spec.js tests/e2e/operational-refresh-visibility.spec.js --project=desktop-chromium --workers=1 --retries=0

  operational-cost-comparison:
    name: Comparação de custo e estabilidade (diagnóstico)
    needs: sustained-browser-comparison
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter comparador do candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Recuperar métricas do baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: operational-metrics-baseline-${{ github.run_id }}
          path: operational-input/baseline
      - name: Recuperar métricas do candidato
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: operational-metrics-candidate-${{ github.run_id }}
          path: operational-input/candidate
      - name: Comparar tentativas, SQL, bytes e DOM
        run: >-
          node scripts/compare-operational-sessions.mjs
          --baseline operational-input/baseline
          --candidate operational-input/candidate
          --output operational-comparison
      - name: Mostrar resultado no resumo da execução
        if: ${{ always() && hashFiles('operational-comparison/comparison.md') != '' }}
        run: cat operational-comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar comparação compacta e referências
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-comparison-${{ github.run_id }}
          path: operational-comparison/
          if-no-files-found: warn
          retention-days: 30

  production-shaped-volume:
    name: 163 escolas, contexto pesado e RPC autenticada
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Configurar origem local da Edge Function
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env

      - name: Iniciar Supabase descartável e aplicar migrations
        run: |
          bash scripts/start-disposable-supabase-ci.sh
          npm run supabase:reset

      - name: Construir massa sintética com forma de Production
        # CLI 2.114.0 usa prepared statement em db query; esta fixture contém
        # uma transação com vários comandos. psql executa o arquivo integral.
        run: docker exec -i supabase_db_radar-pdde psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/fixtures/operational-production-shape.sql

      - name: Preparar identidade real de Controlador no ambiente descartável
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Medir 20 leituras e refreshes reais da aplicação
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
          RADAR_E2E_PRODUCTION_SHAPE: '1'
        run: >-
          npx playwright test
          tests/e2e/operational-production-shape-performance.spec.js
          --project=desktop-chromium
          --workers=1
          --max-failures=1
          --timeout=180000

      - name: Publicar baseline sanitizado
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-production-shape-${{ github.run_id }}
          path: |
            test-results/operational-production-shape/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Restaurar configuração e encerrar Supabase
        if: always()
        run: |
          npm run generate:runtime-config || true
          rm -f supabase/functions/.env
          npm run supabase:stop || true
