name: PR410 temporary Realtime migration GREEN

on:
  push:
    branches:
      - refactor/simplify-operational-sync-2026-10-04
    paths:
      - .github/workflows/pr410-realtime-migration-green-temp.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/simplify-operational-sync-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar inventário da 60ª migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 anchor, encontrado {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/check-supabase-final-alignment-current.js',
              'const EXPECTED_MIGRATION_COUNT = 59;',
              'const EXPECTED_MIGRATION_COUNT = 60;'
          )
          replace_once(
              'supabase/verification/remote-post-apply.sql',
              "        '20261004132755'\n    ];",
              "        '20261004132755',\n        '20261004210000'\n    ];"
          )
          replace_once(
              'docs/runbooks/SUPABASE_CONNECTION.md',
              'O conjunto versionado contém atualmente **59** migrations.',
              'O conjunto versionado contém atualmente **60** migrations.'
          )
          replace_once(
              'docs/runbooks/SUPABASE_CONNECTION.md',
              'A 59ª desta branch é a candidata `20261004132755_read_school_operational_context`, ainda sem aplicação ou consumo em Production; não corresponde à migration experimental do #409.',
              'A 59ª desta branch é a candidata `20261004132755_read_school_operational_context`; a 60ª é `20261004210000_realtime_school_invalidation_context`, que acrescenta somente contexto mínimo de escola ao Broadcast. Ambas permanecem sem aplicação em Production e não correspondem à migration experimental do #409.'
          )
          PY
          node scripts/check-supabase-final-alignment-current.js
          git diff --check
      - name: Subir Supabase descartável e provar GREEN do contrato Realtime
        shell: bash
        run: |
          npm run supabase:start
          npm run supabase:reset
          npm run supabase:test:db
        env:
          RADAR_ALLOWED_ORIGIN: http://127.0.0.1:4175
      - name: Encerrar Supabase
        if: always()
        run: npm run supabase:stop || true
      - name: Commitar bookkeeping somente após GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-supabase-final-alignment-current.js supabase/verification/remote-post-apply.sql docs/runbooks/SUPABASE_CONNECTION.md
          git commit -m "chore: alinhar inventário da migration Realtime escolar"
          git push origin HEAD:refactor/simplify-operational-sync-2026-10-04
