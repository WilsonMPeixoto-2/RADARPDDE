name: Validação isolada da correção arquitetural

on:
  push:
    branches:
      - fix/supabase-query-architecture-2026-09-11

permissions:
  contents: read

concurrency:
  group: architecture-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Certificação estrutural e funcional
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar sintaxe dos arquivos alterados
        run: |
          node --check src/data/repository-contract.js
          node --check src/data/supabase-repository.js
          node --check src/data/repository-factory.js
          node --check src/data/state-bridge-metadata.js
          node --check src/integration/auth-gate.js
          node --check src/integration/administrative-log-read-model.js
          node --check src/integration/product-extensions-bootstrap.js
          node --check src/integration/school-timeline.js
          node --check src/integration/auditable-retification.js
          node --check src/application/audit-service.js
          node --check src/application/data-service.js

      - name: Executar regressões direcionadas
        run: >-
          node --test
          tests/unit/data-lifecycle-policy.test.js
          tests/unit/append-only-refresh-policy.test.js
          tests/unit/append-only-command-contract.test.js
          tests/unit/supabase-keyset-pagination.test.js
          tests/unit/r1-service-command-authority.test.js
          tests/unit/auth-gate-workspace-failure.test.js
          tests/unit/administrative-log-read-architecture.test.js
          tests/unit/administrative-log-read-model.test.js
          tests/unit/administrative-log-extension-load-order.test.js
          tests/unit/school-timeline-lazy-logs.test.js
          tests/unit/audit-service-incremental-persistence.test.js
          tests/unit/audit-service.test.js
          tests/unit/remote-bootstrap-storage-policy.test.js
          tests/unit/remote-operational-storage-hygiene.test.js

      - name: Executar checagem estrutural existente
        run: npm run check

      - name: Executar suíte unitária completa
        run: npm run test:unit

      - name: Executar testes de integração
        run: npm run test:integration

      - name: Validar fronteiras arquiteturais
        run: npm run check:architecture

      - name: Validar segurança e testes de interface
        run: |
          npm run lint:security
          npm run lint:e2e

      - name: Instalar navegador de validação
        run: npx playwright install --with-deps chromium

      - name: Validar fluxos operacionais prioritários no desktop
        run: >-
          npx playwright test
          tests/e2e/application-services.spec.js
          tests/e2e/monthly-evaluation-journey.spec.js
          tests/e2e/atomic-analysis-pendency.spec.js
          tests/e2e/evaluation-retification-ui.spec.js
          tests/e2e/invoice-document-analysis.spec.js
          tests/e2e/invoice-auditable-retification.spec.js
          tests/e2e/invoice-submit-guard.spec.js
          tests/e2e/unidentified-expense.spec.js
          tests/e2e/pendency-cross-competence.spec.js
          tests/e2e/pendency-manual-auditable-retification.spec.js
          tests/e2e/pendency-reanalysis-auth.spec.js
          tests/e2e/global-competence-selector.spec.js
          tests/e2e/inventory-prontuario-link.spec.js
          tests/e2e/data-error-ux.spec.js
          --project=desktop-chromium
          --workers=1
