name: Preflight da Gestão de Equipe em produção

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/team-account-management/**'
      - 'supabase/functions/_shared/cors-policy.mjs'
      - 'scripts/check-production-team-account-preflight.mjs'
      - '.github/workflows/production-team-account-preflight.yml'

permissions:
  contents: read

concurrency:
  group: production-team-account-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: OPTIONS autorizado e origem indevida bloqueada
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validar Edge Function publicada
        run: node scripts/check-production-team-account-preflight.mjs
