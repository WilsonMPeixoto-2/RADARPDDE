name: Sincronizar documentação canônica PR260

on:
  push:
    branches:
      - stabilization/functional-reliability-2026-09-04
    paths:
      - '.github/workflows/sync-pr260-canonical-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stabilization/functional-reliability-2026-09-04

      - name: Corrigir linguagem histórica em CURRENT_STAGE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CURRENT_STAGE.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'A porta de entrada executável corrente é [`superpowers/plans/2026-09-03-plano-remanescente-source-first.md`](superpowers/plans/2026-09-03-plano-remanescente-source-first.md). A evidência que sustenta o escopo está em [`audits/2026-09-03-reauditoria-codigo-fonte-plano-remanescente.md`](audits/2026-09-03-reauditoria-codigo-fonte-plano-remanescente.md).':
              'Naquele checkpoint, a porta de entrada executável era [`superpowers/plans/2026-09-03-plano-remanescente-source-first.md`](superpowers/plans/2026-09-03-plano-remanescente-source-first.md), sustentada por [`audits/2026-09-03-reauditoria-codigo-fonte-plano-remanescente.md`](audits/2026-09-03-reauditoria-codigo-fonte-plano-remanescente.md). Após a estabilização de 04/09, esse plano permanece apenas como referência histórica.',
              'Sequência executável:': 'Sequência então planejada:',
              'Hoje, a entrada canônica é a reconciliação de 03/09 indicada no topo deste arquivo.':
              'Naquele checkpoint, a entrada canônica era a reconciliação de 03/09. Após 04/09, prevalecem o estado e o handoff da estabilização funcional indicados no topo deste arquivo.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Trecho esperado não localizado: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar e commit
        shell: bash
        run: |
          git diff --check
          git diff -- docs/CURRENT_STAGE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STAGE.md
          if git diff --cached --quiet; then
            echo 'Nenhuma atualização adicional necessária.'
            exit 0
          fi
          git commit -m 'docs: neutralizar plano histórico após PR260'
          git push origin HEAD:stabilization/functional-reliability-2026-09-04
