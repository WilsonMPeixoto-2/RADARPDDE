name: Pilotos isolados TypeScript 7 e Knip 6

on:
  push:
    branches: [docs/audit-capacidades-pacotes-out2026]
    paths:
      - '.github/workflows/tooling-capability-pilots.yml'
      - 'scripts/audit/inspect-knip-deep.mjs'
      - 'scripts/audit/verify-knip-dynamic-references.mjs'
      - 'tsconfig.js-contract-pilot.json'
      - 'src/domain/operation-key.js'
      - 'knip.config.cjs'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read

jobs:
  typescript-pilot:
    name: TS7 - baseline e contraprova negativa
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar contrato JavaScript original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tooling
          npx --no-install tsc --version
          npx --no-install tsc -p tsconfig.js-contract-pilot.json --noEmit 2>&1 | tee artifacts/tooling/ts-baseline.log
      - name: Contraprova negativa sem alterar a branch
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp src/domain/operation-key.js "$backup"
          trap 'cp "$backup" src/domain/operation-key.js; rm -f "$backup"' EXIT
          printf '\n/** @type {string} */ const __radar_ts7_negative_probe = 123;\n' >> src/domain/operation-key.js
          set +e
          npx --no-install tsc -p tsconfig.js-contract-pilot.json --noEmit > artifacts/tooling/ts-negative.log 2>&1
          code=$?
          set -e
          cat artifacts/tooling/ts-negative.log
          test "$code" -ne 0
          grep -q 'TS2322' artifacts/tooling/ts-negative.log
          echo "PASS: TypeScript detectou a violação de tipo intencional."
      - name: Testar inferência da API real de chaves de operação
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp src/domain/operation-key.js "$backup"
          trap 'cp "$backup" src/domain/operation-key.js; rm -f "$backup"' EXIT
          printf '\n/** @type {number} */ const __radar_real_api_negative = module.exports.persistentId("nf", "00000000-0000-4000-8000-000000000000");\n' >> src/domain/operation-key.js
          set +e
          npx --no-install tsc -p tsconfig.js-contract-pilot.json --noEmit > artifacts/tooling/ts-real-api-negative.log 2>&1
          code=$?
          set -e
          cat artifacts/tooling/ts-real-api-negative.log
          if [ "$code" -ne 0 ] && grep -q 'TS2322' artifacts/tooling/ts-real-api-negative.log; then
            echo 'RESULT=REAL_API_CONTRACT_DETECTED'
          elif [ "$code" -eq 0 ]; then
            echo 'RESULT=INFERENCE_GAP_REAL_API: JSDoc/contrato explícito ainda necessário'
          else
            echo 'Erro inesperado de compilação na sonda do consumidor real'
            exit 1
          fi
      - name: Preservar logs TypeScript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ts7-a1-diagnostics
          path: artifacts/tooling/ts-*.log
          if-no-files-found: ignore
          retention-days: 7

  knip-pilot:
    name: Knip - relatório não bloqueante de arquivos e exports
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Executar diagnóstico Knip
        run: |
          node --check scripts/audit/inspect-knip-deep.mjs
          npx --no-install knip --version
          node scripts/audit/inspect-knip-deep.mjs
      - name: Classificar referências dinâmicas e controle positivo do Knip
        shell: bash
        env:
          RADAR_EXPECT_KNIP_A1: '1'
        run: |
          set -euo pipefail
          cp artifacts/tooling/knip-deep-diagnostic.json artifacts/tooling/knip-deep-baseline.json
          node scripts/audit/verify-knip-dynamic-references.mjs
          control=src/domain/__radar_knip_unused_control.js
          trap 'rm -f "$control"' EXIT
          printf "'use strict';\nmodule.exports = {unusedControl: true};\n" > "$control"
          node scripts/audit/inspect-knip-deep.mjs
          node -e "const r=require('./artifacts/tooling/knip-deep-diagnostic.json');if(!r.issues.some(x=>x.file==='src/domain/__radar_knip_unused_control.js'))process.exit(1);console.log('PASS: Knip detectou arquivo realmente sem referências.')"
      - name: Preservar relatório JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: knip-a1-diagnostics
          path: artifacts/tooling/knip-*.json
          if-no-files-found: ignore
          retention-days: 7
