name: Nomenclatura Painel

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/integration/controller-guide.js'
      - 'src/integration/navigation-context.js'
      - 'docs/reference/functional-contract-matrix.json'
      - 'docs/reference/FUNCTIONAL_CONTRACT_MATRIX.md'
      - 'tests/e2e/controller-guide.spec.js'
      - '.github/workflows/painel-label-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato de nomenclatura
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Provar rótulo visível sem alterar contrato técnico
        run: |
          node scripts/check-functional-contract-matrix.mjs
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const nav = html.match(/<div class="nav-item active" id="nav-dashboard" onclick="switchView\('dashboard'\)">[\s\S]*?<span>([^<]+)<\/span>/);
          if (!nav) throw new Error('nav-dashboard não localizado com contrato técnico preservado.');
          if (nav[1] !== 'Painel') throw new Error(`Rótulo esperado Painel; recebido ${nav[1]}`);
          if (/id="nav-dashboard"[\s\S]{0,500}<span>Dashboard<\/span>/.test(html)) {
            throw new Error('Dashboard ainda aparece como rótulo do menu.');
          }
          const guide = fs.readFileSync('src/integration/controller-guide.js', 'utf8');
          if (!guide.includes("routeLabel: 'Abrir Painel'")) throw new Error('Guia não usa Abrir Painel.');
          const navigation = fs.readFileSync('src/integration/navigation-context.js', 'utf8');
          if (!navigation.includes("dashboard: 'Painel'")) throw new Error('Contexto de navegação não usa Painel.');
          NODE

  browser:
    name: Menu e Guia exibem Painel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium

      - name: Executar jornada específica
        run: >-
          npx playwright test
          tests/e2e/controller-guide.spec.js
          --project=desktop-chromium
          --workers=1
          --max-failures=1
