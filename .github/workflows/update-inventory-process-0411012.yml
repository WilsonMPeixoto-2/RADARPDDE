name: Atualizar processo de inventário 04.11.012

on:
  push:
    branches:
      - main
    paths:
      - "supabase/operations/20260922_update_inventory_process_0411012.sql"
      - ".github/workflows/update-inventory-process-0411012.yml"

permissions:
  contents: read

concurrency:
  group: production-data-correction-0411012
  cancel-in-progress: false

jobs:
  update-production:
    name: Atualizar e verificar escola 04.11.012 em Production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASS_REMOTE: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: scnryinorqeucbfkioxo

    steps:
      - name: Obter código sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar alvo e credenciais
        shell: bash
        run: |
          set -euo pipefail
          test "${PROJECT_REF}" = 'scnryinorqeucbfkioxo'
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo 'SUPABASE_ACCESS_TOKEN ausente.' >&2; exit 1; }
          test -n "${PGPASS_REMOTE}" || { echo 'SUPABASE_DB_PASSWORD ausente.' >&2; exit 1; }

      - name: Vincular Supabase Production autorizado
        run: npx --no-install supabase link --project-ref "${PROJECT_REF}" --password "${PGPASS_REMOTE}"

      - name: Aplicar correção fail-closed e verificar resultado
        run: npx --no-install supabase db query --linked --file supabase/operations/20260922_update_inventory_process_0411012.sql

      - name: Registrar resumo sanitizado
        if: always()
        run: |
          {
            echo '### Correção de dado operacional — Escola 04.11.012'
            echo
            echo '- Campo: `schools.inventory_process`'
            echo '- Valor esperado: `000704.008168/2026-83`'
            echo '- Projeto: Production autorizado'
            echo '- O SQL aborta se a escola não for única, se a denominação divergir ou se já existir outro processo.'
          } >> "${GITHUB_STEP_SUMMARY}"
