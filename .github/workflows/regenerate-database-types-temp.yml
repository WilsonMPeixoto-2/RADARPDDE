name: Regenerar tipos do banco temporariamente

on:
  push:
    branches:
      - ops/integridade-continua-production-20260804
    paths:
      - '.github/workflows/regenerate-database-types-temp.yml'

permissions:
  contents: write

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Obter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/integridade-continua-production-20260804

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Iniciar e recriar Supabase local
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Regenerar tipos oficiais
        run: npm run supabase:gen:types

      - name: Versionar somente os tipos gerados
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/types/database.types.ts; then
            echo 'Tipos já estavam sincronizados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.types.ts
          git commit -m 'chore: regenerar tipos após auditoria de integridade'
          git push origin HEAD:ops/integridade-continua-production-20260804

      - name: Encerrar Supabase local
        if: always()
        run: npm run supabase:stop || true
