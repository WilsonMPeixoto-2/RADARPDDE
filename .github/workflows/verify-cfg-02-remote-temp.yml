name: Verificar correção CFG-02 em Supabase local

on:
  push:
    branches:
      - fix/cfg-02-exercise-competence-batch-20260806
    paths:
      - .github/workflows/verify-cfg-02-remote-temp.yml
      - src/application/configuration-service.js
      - tests/unit/configuration-service.test.js

permissions:
  contents: write

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cfg-02-exercise-competence-batch-20260806
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências e Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Iniciar e recriar Supabase local
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Criar identidades e runtime autenticado
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run check:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Criar ensaio autenticado efêmero
        shell: bash
        run: |
          cat > tests/e2e/cfg-02-remote-temp.spec.js <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const { test, expect } = require('@playwright/test');

          const fixtures = JSON.parse(fs.readFileSync(
            path.resolve(__dirname, '../../supabase/fixtures/auth-users.json'),
            'utf8'
          ));
          const password = process.env.RADAR_AUTH_FIXTURE_PASSWORD || '';
          const sme = fixtures.find(item => item.profileId === 'sme_management' && item.active);

          async function waitForRuntime(page) {
            await page.waitForFunction(() => (
              window.RadarDataContext?.ready === true
              && window.RadarAuthContext?.authorization?.role === 'sme_management'
            ));
          }

          test('cria segundo exercício enviando somente suas doze competências ao RPC', async ({ page }) => {
            await page.goto('/');
            await expect(page.locator('#radar-auth-gate')).toBeVisible();
            await page.locator('#radar-auth-email').fill(sme.email);
            await page.locator('#radar-auth-password').fill(password);
            await page.locator('#radar-auth-form button[type="submit"]').click();
            await waitForRuntime(page);

            const created = await page.evaluate(async () => {
              const services = window.RadarApplicationServices;
              const used = new Set((config.exercicios || []).map(String));
              const year = ['2099', '2098', '2097', '2096', '2095']
                .find(candidate => !used.has(candidate));
              if (!year) throw new Error('Exercício reservado indisponível.');
              const result = await services.configuration.createExercise({
                year,
                initialMonth: '03'
              });
              const [configs, competences, logs] = await Promise.all([
                services.data.repository.load('appConfig'),
                services.data.repository.load('competences'),
                services.data.repository.load('administrativeLogs')
              ]);
              return {
                year,
                initialCompetence: result.value.initialCompetence,
                closingCompetence: configs.find(item => item.id === 'global')?.closing_competence,
                competenceIds: competences
                  .filter(item => Number(item.exercise) === Number(year))
                  .map(item => item.id)
                  .sort(),
                logs: logs.filter(item => item.action === 'Exercício Criado')
                  .map(item => ({ actor: item.actor_user_id, details: item.details }))
              };
            });

            expect(created.initialCompetence).toBe(`${created.year}-03`);
            expect(created.closingCompetence).toBe(`${created.year}-03`);
            expect(created.competenceIds).toEqual(
              Array.from({ length: 12 }, (_item, index) => (
                `${created.year}-${String(index + 1).padStart(2, '0')}`
              ))
            );
            expect(created.logs.some(item => item.actor && item.details)).toBe(true);

            await page.reload();
            await waitForRuntime(page);
            const afterReload = await page.evaluate(async year => {
              const rows = await window.RadarApplicationServices.data.repository.load('competences');
              return rows.filter(item => Number(item.exercise) === Number(year)).map(item => item.id).sort();
            }, created.year);
            expect(afterReload).toEqual(created.competenceIds);
          });
          EOF

      - name: Executar criação, persistência e releitura
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: |
          npx playwright test \
            tests/e2e/cfg-02-remote-temp.spec.js \
            --project=desktop-chromium \
            --reporter=line

      - name: Certificar limpeza após reset
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/e2e/cfg-02-remote-temp.spec.js
          npm run supabase:reset
          COUNT="$(docker exec supabase_db_radar-pdde psql -U postgres -d postgres -Atc "select count(*) from public.competences where exercise between 2095 and 2099;")"
          test "${COUNT}" = "0"
          echo 'Nenhuma competência sintética permaneceu após o reset.'

      - name: Registrar evidência segura
        if: success()
        run: |
          {
            echo '## CFG-02 corrigida'
            echo ''
            echo '- Gestão SME autenticada criou um segundo exercício em banco já populado'
            echo '- somente as 12 competências do novo exercício chegaram ao RPC'
            echo '- configuração, autoria e releitura após reload confirmadas'
            echo '- reset final com zero resíduos confirmado por SQL direto'
            echo '- nenhuma conta ou dado de Production utilizado'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restaurar arquivos e encerrar ambiente
        if: always()
        run: |
          rm -f tests/e2e/cfg-02-remote-temp.spec.js
          git checkout -- config.runtime.js || true
          npm run supabase:stop || true

      - name: Remover workflow temporário após sucesso
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/verify-cfg-02-remote-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remover verificação temporária de CFG-02"
          git push origin HEAD:fix/cfg-02-exercise-competence-batch-20260806
