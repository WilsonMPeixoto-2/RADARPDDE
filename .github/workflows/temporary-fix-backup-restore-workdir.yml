name: Temporary backup restore workdir compatibility fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'chore/rodada-3b-supabase-cli-2-110-0-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/rodada-3b-supabase-cli-2-110-0-20260802
          fetch-depth: 0

      - name: Apply narrow compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-supabase-backup-restore.mjs')
          source = path.read_text(encoding='utf-8')
          old_import = "import { mkdtemp, mkdir, readFile, rm, stat, writeFile } from 'node:fs/promises';"
          new_import = "import { cp, mkdtemp, mkdir, readFile, rm, stat, writeFile } from 'node:fs/promises';"
          old_block = """  await writeFile(path.join(supabaseDir, 'config.toml'), createRestoreConfig(sourceConfig));
            await writeFile(path.join(supabaseDir, 'seed.sql'), '-- restauração descartável: seed desativado\\n');
          }"""
          new_block = """  await writeFile(path.join(supabaseDir, 'config.toml'), createRestoreConfig(sourceConfig));
            await writeFile(path.join(supabaseDir, 'seed.sql'), '-- restauração descartável: seed desativado\\n');
            await cp(path.join(ROOT, 'supabase/functions'), path.join(supabaseDir, 'functions'), {
              recursive: true
            });
          }"""

          if source.count(old_import) != 1:
              raise SystemExit('Import esperado não encontrado exatamente uma vez.')
          if source.count(old_block) != 1:
              raise SystemExit('Bloco de preparação esperado não encontrado exatamente uma vez.')

          path.write_text(source.replace(old_import, new_import).replace(old_block, new_block), encoding='utf-8')
          PY

      - name: Verify narrow diff and syntax
        run: |
          node --check scripts/verify-supabase-backup-restore.mjs
          git diff --check
          git diff --exit-code -- . ':(exclude)scripts/verify-supabase-backup-restore.mjs'
          grep -F "await cp(path.join(ROOT, 'supabase/functions'), path.join(supabaseDir, 'functions')," scripts/verify-supabase-backup-restore.mjs

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-supabase-backup-restore.mjs
          git commit -m "fix: preservar funções na pilha descartável de restauração"
          git push origin HEAD:chore/rodada-3b-supabase-cli-2-110-0-20260802
