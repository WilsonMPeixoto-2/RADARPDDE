name: Homologação do Excel SME

on:
  pull_request:
    paths:
      - 'src/domain/excel-sme-export-model.js'
      - 'src/domain/excel-sme-monthly-renderer.js'
      - 'src/domain/excel-xlsx-renderer.js'
      - 'src/domain/excel-integral-certification.js'
      - 'scripts/generate-excel-sme-homologation.mjs'
      - 'tests/unit/excel-sme-monthly-renderer.test.js'
      - 'docs/evidence/excel-certification/synthetic-manifest.json'
      - '.github/workflows/excel-sme-homologation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-e-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validar renderer mensal
        run: node --test tests/unit/excel-sme-monthly-renderer.test.js

      - name: Gerar arquivo pelo renderer real
        run: node scripts/generate-excel-sme-homologation.mjs

      - name: Publicar arquivo para abertura no Excel desktop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: excel-sme-homologacao-${{ github.run_id }}
          path: artifacts/excel-homologation/RADAR_PDDE_EXCEL_SME_HOMOLOGACAO_12-2026.xlsx
          if-no-files-found: error
          retention-days: 7
