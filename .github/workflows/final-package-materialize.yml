name: Materializar pacote final de manutenção

on:
  push:
    branches:
      - chore/dependencies-current-2026-09-14
    paths:
      - .github/workflows/final-package-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/dependencies-current-2026-09-14
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Materializar pacote
        run: python scripts/final-package-materialize.py

      - name: Validar pacote direcionado
        run: |
          node --test tests/unit/index-script-loading-performance.test.js
          node --test tests/unit/tooling-contract.test.js tests/unit/supabase-modernization.test.js
          npm run check:architecture
          git diff --check -- . ':!vendor/supabase-client.js'

      - name: Registrar pacote final
        run: |
          rm .github/workflows/final-package-materialize.yml
          rm scripts/final-package-materialize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css docs/CURRENT_STAGE.md .github/workflows/final-package-materialize.yml scripts/final-package-materialize.py
          git commit -m "perf: fechar pacote final de manutenção do RADAR"
          git push origin HEAD:chore/dependencies-current-2026-09-14
