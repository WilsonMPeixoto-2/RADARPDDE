name: Aplicar correção regressiva da Rodada 1

on:
  pull_request:
    paths:
      - .github/workflows/validate.yml
      - scripts/patch-inline-expression.py

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ github.head_ref == 'chore/rodada-1-baixo-risco-20260801' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter branch da rodada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/rodada-1-baixo-risco-20260801

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Confirmar regressão antes da correção
        shell: bash
        run: |
          set +e
          node --test tests/unit/audit-functional-persistence-contract.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'O teste deveria demonstrar a regressão antes da correção.' >&2
            exit 1
          fi

      - name: Restringir parseExpressionAt a expressões
        run: python scripts/patch-inline-expression.py

      - name: Validar correção
        run: |
          node --test tests/unit/audit-functional-persistence-contract.test.js
          npm run check
          npm run audit:functional

      - name: Registrar somente código permanente
        shell: bash
        run: |
          rm -f scripts/patch-inline-expression.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-functional-persistence.js tests/unit/audit-functional-persistence-contract.test.js
          git add -A scripts/patch-inline-expression.py
          git commit -m 'fix: validar somente expressões em handlers inline'
          git push origin HEAD:chore/rodada-1-baixo-risco-20260801
