name: Validar RADAR PDDE

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Sintaxe, auditoria e testes de domínio
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O checkout de PR aponta para o commit sintetico de merge;
          # a profundidade 2 disponibiliza sua baseline sem buscar todo o historico.
          fetch-depth: 2

      - name: Configurar Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Observar impacto do diff (shadow; nunca pula checks)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          RADAR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/classify-pr-impact.mjs > "${RUNNER_TEMP}/radar-impact-shadow.json"
          cat "${RUNNER_TEMP}/radar-impact-shadow.json"
          node -e 'const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Classificacao de impacto (apenas observacional)\n\n- Escopo sugerido: `"+report.scope+"`\n- Motivo: "+report.reason+"\n- Gates alterados ou pulados: **nenhum**\n");' "${RUNNER_TEMP}/radar-impact-shadow.json"
      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar contrato JS de identidade e consumidor fiscal (TS 7)
        run: ./node_modules/.bin/tsc -p tsconfig.js-contract-boundary.json --pretty false

      - name: Validar referências locais dos workflows
        run: node scripts/check-workflow-references.mjs

      - name: Auditar dependências npm com política fail-closed
        shell: bash
        run: |
          mkdir -p dependency-health
          set +e
          npm audit --json > dependency-health/npm-audit.json
          set -e
          npm run audit:exceljs-policy

      - name: Verificar sintaxe da aplicação e infraestrutura
        run: npm run check

      - name: Executar testes de domínio existentes
        run: node --test tests/*.test.js

      - name: Executar testes de integração da migração
        run: npm run test:integration

      - name: Executar testes unitários com relatório estruturado
        id: unit_tests
        shell: bash
        timeout-minutes: 15
        run: |
          set +e
          node --test --test-reporter=junit tests/unit/*.test.js > unit-tests.xml
          status=$?
          set -e
          exit $status

      - name: Publicar relatório dos testes unitários
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-report
          path: unit-tests.xml
          retention-days: 7
          if-no-files-found: error

      - name: Gerar relatório detalhado da auditoria
        if: ${{ !cancelled() }}
        run: npm run audit:functional:json > functional-persistence-audit.json || true

      - name: Publicar relatório detalhado da auditoria
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-persistence-audit
          path: functional-persistence-audit.json
          retention-days: 7
          if-no-files-found: error

      - name: Auditar cobertura funcional e de persistência
        run: npm run audit:functional

  homologacao-supabase-preview:
    name: Auth, perfis, RLS e persistência no Preview
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'qa/supabase-preview-gate-run' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RADAR_DEPLOYMENT_URL: https://radarpdde-d5g8j0esm-wilson-m-peixotos-projects.vercel.app
      RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
      RADAR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
      RADAR_ALLOW_REMOTE_HOMOLOGATION: 'true'
      RADAR_E2E_SUPABASE_REMOTE: '1'

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar alvo, segredos e manifesto público
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADAR_SUPABASE_URL}"
          test -n "${RADAR_SUPABASE_SERVICE_ROLE_KEY}"
          test "${RADAR_SUPABASE_URL}" = 'https://scnryinorqeucbfkioxo.supabase.co'
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.RADAR_DEPLOYMENT_URL}/config.runtime.js`);
          if (!response.ok) throw new Error(`Manifesto indisponível: ${response.status}`);
          const source = await response.text();
          if (!source.includes('"environment": "preview"')) throw new Error('Preview sem environment=preview.');
          if (!source.includes('"dataMode": "supabase-preview"')) throw new Error('Preview sem dataMode=supabase-preview.');
          if (!source.includes('"supabaseRepositoryEnabled": true')) throw new Error('Repositório Supabase desativado no Preview.');
          if (!source.includes('"productionActivationApproved": false')) throw new Error('Preview com ativação de Production indevida.');
          process.stdout.write('Manifesto Preview validado sem exibir credenciais.\n');
          NODE

      - name: Gerar credencial efêmera protegida
        shell: bash
        run: |
          set -euo pipefail
          password="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(36).toString('base64url') + 'A1!')")"
          echo "::add-mask::${password}"
          echo "RADAR_HML_PASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "RADAR_HML_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "RADAR_HML_FIXTURE_FILE=${RUNNER_TEMP}/radar-hml-users.json" >> "${GITHUB_ENV}"

      - name: Criar identidades temporárias e perfis funcionais
        run: node scripts/ops/prepare-remote-homologation-users.mjs

      - name: Homologar login, sessão, telas, permissões e operações HML
        run: >-
          npx playwright test
          tests/e2e/supabase-preview-remote.spec.js
          --config=playwright.supabase-preview.config.js

      - name: Remover identidades e registros temporários
        if: always()
        run: node scripts/ops/cleanup-remote-homologation-users.mjs

      - name: Publicar evidências da homologação
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homologacao-supabase-preview-${{ github.run_id }}
          path: |
            playwright-report-supabase-preview/
            test-results/
          if-no-files-found: warn
          retention-days: 14
