name: Aplicar transformação da Rodada 1

on:
  pull_request:
    paths:
      - .github/workflows/validate.yml
      - scripts/apply-round-1.py
      - scripts/fix-round-1-location.py

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ github.head_ref == 'chore/rodada-1-baixo-risco-20260801' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter branch da rodada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/rodada-1-baixo-risco-20260801

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Restaurar o workflow canônico antes da transformação
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/validate.yml > .github/workflows/validate.yml

      - name: Aplicar versões e integrações pertinentes
        run: |
          python scripts/apply-round-1.py
          python scripts/fix-round-1-location.py

      - name: Regenerar lockfile sem executar scripts de instalação
        run: npm install --package-lock-only --ignore-scripts

      - name: Validar implementação dirigida pelo teste
        run: |
          npm ci
          node --test tests/unit/audit-functional-persistence-contract.test.js
          npm run check
          mkdir -p dependency-health
          npm run lint:security:html

      - name: Remover automações temporárias
        run: |
          rm -f scripts/apply-round-1.py scripts/fix-round-1-location.py
          rm -f .github/workflows/rodada-1-aplicar-atualizacoes.yml

      - name: Registrar alterações reproduzíveis na branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: aplicar atualizações técnicas da rodada 1'
          git push origin HEAD:chore/rodada-1-baixo-risco-20260801
