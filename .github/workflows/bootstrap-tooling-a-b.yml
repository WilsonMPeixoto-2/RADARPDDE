name: Bootstrap temporário — tooling A/B

on:
  push:
    branches:
      - chore/tooling-phases-a-b-2026-09-26

permissions:
  contents: write

concurrency:
  group: bootstrap-tooling-a-b
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/tooling-phases-a-b-2026-09-26
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Regenerar lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar árvore reproduzível
        run: npm ci

      - name: Regenerar bundle Supabase
        run: npm run build:supabase-client

      - name: Validar CSS e referências de workflows
        run: |
          npm run lint:css
          npm run check:workflow-references
          node --test tests/unit/workflow-references.test.js tests/unit/global-search-index.test.js

      - name: Instalar Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Gerar seis baselines visuais
        run: npm run test:visual -- --update-snapshots

      - name: Remover andaime temporário
        run: git rm .github/workflows/bootstrap-tooling-a-b.yml

      - name: Materializar arquivos gerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json vendor/supabase-client.js tests/e2e/*-snapshots
          git diff --cached --check -- package-lock.json tests/e2e
          git commit -m "chore: materializar lock, bundle e snapshots A/B"
          git push origin HEAD:chore/tooling-phases-a-b-2026-09-26
