name: Localizar NF teste 1234 para exclusão

on:
  push:
    branches:
      - ops/find-delete-test-invoice-1234-2026-09-22
    paths:
      - "supabase/operations/20260922_find_test_invoice_1234.sql"
      - ".github/workflows/find-test-invoice-1234.yml"

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASS_REMOTE: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: scnryinorqeucbfkioxo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validar alvo
        run: |
          set -euo pipefail
          test "${PROJECT_REF}" = 'scnryinorqeucbfkioxo'
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${PGPASS_REMOTE}"
      - name: Vincular Production
        run: npx --no-install supabase link --project-ref "${PROJECT_REF}" --password "${PGPASS_REMOTE}"
      - name: Localizar NF sem escrever
        run: npx --no-install supabase db query --linked --file supabase/operations/20260922_find_test_invoice_1234.sql
