name: Reconciliar documentação da migration de escola

on:
  push:
    branches:
      - fix/school-assignment-authorization-20260805
    paths:
      - .github/workflows/reconcile-school-migration-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/school-assignment-authorization-20260805
          fetch-depth: 0
      - name: Atualizar fontes operacionais
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 trecho, encontrado {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/runbooks/SUPABASE_CONNECTION.md',
              'O conjunto versionado contém atualmente **26** migrations. O histórico oficial reconhecido pela Supabase CLI é a fonte de verdade para conferir versões aplicadas e sua ordem efetiva; não manter uma segunda lista manual de aplicação.',
              'O conjunto versionado contém atualmente **27** migrations. Production permanece com **26 migrations aplicadas** até a aprovação e a execução controlada da migration `202608050001_school_assignment_authorization`. O histórico oficial reconhecido pela Supabase CLI é a fonte de verdade para conferir versões aplicadas e sua ordem efetiva; não manter uma segunda lista manual de aplicação.'
          )

          replace_once(
              'docs/runbooks/SUPABASE_CONNECTION.md',
              'A migration `202608040001_production_integrity_monitor` está aplicada em Production. A RPC pública é `SECURITY INVOKER`, a implementação privilegiada permanece em `radar_private`, e a execução é concedida somente ao `service_role`.',
              'A migration `202608040001_production_integrity_monitor` está aplicada em Production. A RPC pública é `SECURITY INVOKER`, a implementação privilegiada permanece em `radar_private`, e a execução é concedida somente ao `service_role`.\n\nA migration `202608050001_school_assignment_authorization` está versionada no PR nº 154 e ainda não foi aplicada em Production. Ela bloqueia a alteração de `schools.controller_id` por usuários autenticados sem papel `federal_assistant` ou `technical_admin`, preservando manutenção administrativa autorizada.'
          )

          replace_once(
              'docs/architecture/testing.md',
              'Na `main` e em Production existem 26 migrations. A última cria `radar_private.production_integrity_check()` e permanece restrita ao contexto administrativo apropriado.',
              'Production permanece com 26 migrations aplicadas. A branch do PR nº 154 contém 27 migrations versionadas; a última, `202608050001_school_assignment_authorization`, deve ser comprovada em banco descartável antes de aplicação remota autorizada.'
          )

          replace_once(
              '.github/workflows/supabase-readiness.yml',
              'Recriar banco com vinte e seis migrations e seed local',
              'Recriar banco com vinte e sete migrations e seed local'
          )
          PY
      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          git rm .github/workflows/reconcile-school-migration-docs.yml
          git add docs/runbooks/SUPABASE_CONNECTION.md docs/architecture/testing.md .github/workflows/supabase-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: distinguir migration versionada e aplicada"
          git push origin HEAD:fix/school-assignment-authorization-20260805
