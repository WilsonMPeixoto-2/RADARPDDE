name: Smoke autenticado real em Production

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-authenticated-read.yml'
      - 'playwright.production-authenticated-read.config.js'
      - 'tests/e2e/production-authenticated-read.spec.js'
      - 'tests/support/production-authenticated-read.js'
      - 'tests/unit/production-authenticated-read.test.js'
      - 'tests/unit/production-authenticated-read-workflow.test.js'
      - 'docs/superpowers/plans/2026-08-05-smoke-autenticado-leitura-production.md'
      - 'docs/runbooks/SUPABASE_CONNECTION.md'

permissions:
  contents: read

concurrency:
  group: production-authenticated-smoke
  cancel-in-progress: false

env:
  RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app

jobs:
  contracts:
    name: Contratos do smoke autenticado
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Obter código sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar sintaxe e contratos sem acessar Production
        run: |
          set -euo pipefail
          node --check tests/support/production-authenticated-read.js
          node --check tests/e2e/production-authenticated-read.spec.js
          node --check playwright.production-authenticated-read.config.js
          node --test \
            tests/unit/production-authenticated-read.test.js \
            tests/unit/production-authenticated-read-workflow.test.js

  authenticated-smoke:
    name: Contas reais x leitura + CRUD fiscal reversível
    if: >-
      github.event_name != 'pull_request' &&
      (vars.RADAR_PRODUCTION_AUTH_SMOKE_ENABLED == 'true' ||
       vars.RADAR_PRODUCTION_AUTH_READ_ENABLED == 'true')
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Obter código sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium

      - name: Preparar contas reais autorizadas
        id: credentials
        shell: bash
        env:
          ACCOUNTS_JSON: ${{ secrets.RADAR_PRODUCTION_AUTH_ACCOUNTS_JSON || secrets.RADAR_PRODUCTION_READ_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${ACCOUNTS_JSON:-}" ]; then
            echo 'Configure RADAR_PRODUCTION_AUTH_ACCOUNTS_JSON com as contas reais autorizadas.' >&2
            exit 1
          fi
          ACCOUNTS_FILE="${RUNNER_TEMP}/radar-production-auth-accounts.json"
          printf '%s' "${ACCOUNTS_JSON}" > "${ACCOUNTS_FILE}"
          chmod 600 "${ACCOUNTS_FILE}"
          printf 'accounts_file=%s\n' "${ACCOUNTS_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Executar smoke autenticado real e ciclo fiscal reversível
        id: smoke
        env:
          RADAR_E2E_PRODUCTION_AUTHENTICATED_READ: '1'
          RADAR_PRODUCTION_WRITE_SMOKE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RADAR_PRODUCTION_WRITE_SMOKE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RADAR_PRODUCTION_READ_ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: npx playwright test --config=playwright.production-authenticated-read.config.js

      - name: Remover material de autenticação
        if: always()
        shell: bash
        env:
          ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: |
          set -euo pipefail
          if [ -n "${ACCOUNTS_FILE:-}" ]; then
            rm -f -- "${ACCOUNTS_FILE}"
          fi

      - name: Resumir execução sem credenciais
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo '### Smoke autenticado real em Production'
            echo
            echo "- Resultado: ${SMOKE_OUTCOME:-não executado}"
            echo '- Leitura: login, sessão, busca, dashboard, carteira autorizada, prontuário e pendências para todas as contas fornecidas.'
            echo '- Escrita: somente em workflow_dispatch; uma conta Controlador ou Assistente marcada com allowWrite=true executa criar -> editar -> reler -> excluir uma NF sintética TESTE_AUTOMACAO.'
            echo '- Cleanup: a NF sintética deve desaparecer do banco e os campos funcionais da verificação devem retornar ao snapshot anterior.'
            echo '- Auditoria: logs administrativos do ciclo permanecem por desenho, identificando a operação de teste.'
            echo '- Artefatos: nenhum trace, screenshot ou vídeo de Production é publicado.'
            echo "- Evento: ${GITHUB_EVENT_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  provisioning-required:
    name: Credenciais de Production pendentes
    if: >-
      github.event_name != 'pull_request' &&
      vars.RADAR_PRODUCTION_AUTH_SMOKE_ENABLED != 'true' &&
      vars.RADAR_PRODUCTION_AUTH_READ_ENABLED != 'true'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Registrar estado sem falhar o monitor
        run: |
          {
            echo '### Smoke autenticado real em Production'
            echo
            echo '- Estado: aguardando habilitação do monitor e as contas reais autorizadas.'
            echo '- Aceita de uma a cinco contas, uma por perfil.'
            echo '- Para a execução manual com CRUD, exatamente uma conta Controlador ou Assistente deve usar allowWrite=true.'
            echo '- Segredo preferencial: RADAR_PRODUCTION_AUTH_ACCOUNTS_JSON.'
            echo '- Variável preferencial: RADAR_PRODUCTION_AUTH_SMOKE_ENABLED=true.'
          } >> "${GITHUB_STEP_SUMMARY}"
