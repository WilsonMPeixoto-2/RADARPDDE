name: A5 Shadow CI Smoke Isolado
on:
  push:
    branches:
      - experiment/ci-shadow-smoke-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Sintaxe dos arquivos e classificacao unitária
        run: |
          node --check scripts/ci/classify-pr-impact.mjs
          node --test tests/unit/ci-impact-classification.test.js
      - name: Executar classificador real em modo shadow sobre a branch
        env:
          RADAR_CI_BASE_SHA: 78227c8744519d1357dc97d39207fe0b3b27b79c
        run: |
          set -euo pipefail
          node scripts/ci/classify-pr-impact.mjs > /tmp/radar-a5-impact.json
          cat /tmp/radar-a5-impact.json
          node -e "const j=require('/tmp/radar-a5-impact.json'); if(j.scope!=='full'||j.mode!=='shadow')process.exit(1)"
      - name: Verificar fallback no SHA inválido
        env:
          RADAR_CI_BASE_SHA: xx-errado
        run: |
          set -euo pipefail
          node scripts/ci/classify-pr-impact.mjs > /tmp/radar-a5-fallback.json
          cat /tmp/radar-a5-fallback.json
          node -e "const j=require('/tmp/radar-a5-fallback.json'); if(j.scope!=='full'||j.mode!=='shadow')process.exit(1)"
