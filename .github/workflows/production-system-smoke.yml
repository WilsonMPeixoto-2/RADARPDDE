name: Monitoramento contínuo de Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-system-smoke.yml"
      - "docs/superpowers/plans/2026-08-04-alertas-incidentes-production.md"
      - "scripts/check-production-system.mjs"
      - "scripts/check-production-team-account-preflight.mjs"
      - "scripts/lib/production-system-smoke.mjs"
      - "scripts/manage-production-incident.mjs"
      - "tests/unit/production-anonymous-rls.test.js"
      - "tests/unit/production-incident-manager.test.js"
      - "tests/unit/production-system-smoke.test.js"
      - "tests/unit/production-system-workflow.test.js"
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-system-smoke
  cancel-in-progress: false

env:
  RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app

jobs:
  production-smoke:
    name: Site, assets, bloqueio anônimo e Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter código monitorado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false

      - name: Resolver commit e janela de propagação
        id: context
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          CURRENT_DEPLOYED_COMMIT="$(node --input-type=module <<'NODE'
          const manifestUrl = new URL('/radar-build-manifest.json', process.env.RADAR_PRODUCTION_URL);
          const response = await fetch(manifestUrl, {
            headers: { 'cache-control': 'no-cache' }
          });
          if (!response.ok) {
            throw new Error(`Manifesto de Production indisponível: HTTP ${response.status}.`);
          }
          const manifest = await response.json();
          const commit = String(manifest?.commitSha || '').trim().toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(commit)) {
            throw new Error('Manifesto de Production não contém commit SHA válido.');
          }
          process.stdout.write(commit);
          NODE
          )"

          EXPECTED_COMMIT="${CURRENT_DEPLOYED_COMMIT}"
          ATTEMPTS=1
          DEPLOYMENT_REQUIRED=false

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${BEFORE_SHA:-}" ] \
              || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              DEPLOYMENT_REQUIRED=true
            else
              while IFS= read -r changed_file; do
                case "${changed_file}" in
                  src/types/*)
                    ;;
                  index.html|app.js|config.js|styles.css|vercel.json|package.json|package-lock.json|assets/templates/*|src/*|vendor/*|scripts/build-vercel.mjs|scripts/generate-runtime-config.mjs|scripts/generate-excel-sme-assets-manifest.mjs)
                    DEPLOYMENT_REQUIRED=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")
            fi
          fi

          if [ "${DEPLOYMENT_REQUIRED}" = "true" ]; then
            EXPECTED_COMMIT="${GITHUB_SHA}"
            ATTEMPTS=60
          fi

          printf 'expected_commit=%s\n' "${EXPECTED_COMMIT}" >> "${GITHUB_OUTPUT}"
          printf 'attempts=%s\n' "${ATTEMPTS}" >> "${GITHUB_OUTPUT}"
          printf 'deployment_required=%s\n' "${DEPLOYMENT_REQUIRED}" >> "${GITHUB_OUTPUT}"

      - name: Verificar Production publicada
        id: smoke
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.context.outputs.expected_commit }}
          ATTEMPTS: ${{ steps.context.outputs.attempts }}
        run: |
          set +e

          node scripts/check-production-system.mjs \
            --base-url "${RADAR_PRODUCTION_URL}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --attempts "${ATTEMPTS}" \
            --interval-ms 10000
          CORE_STATUS=$?

          node scripts/check-production-team-account-preflight.mjs
          PREFLIGHT_STATUS=$?

          printf 'core_status=%s\n' "${CORE_STATUS}" >> "${GITHUB_OUTPUT}"
          printf 'preflight_status=%s\n' "${PREFLIGHT_STATUS}" >> "${GITHUB_OUTPUT}"

          if [ "${CORE_STATUS}" -ne 0 ] || [ "${PREFLIGHT_STATUS}" -ne 0 ]; then
            exit 1
          fi

      - name: Gerenciar incidente automático
        id: incident
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.context.outputs.expected_commit }}
          CORE_STATUS: ${{ steps.smoke.outputs.core_status }}
          PREFLIGHT_STATUS: ${{ steps.smoke.outputs.preflight_status }}
        run: |
          set -euo pipefail
          CORE_STATUS="${CORE_STATUS:-1}"
          PREFLIGHT_STATUS="${PREFLIGHT_STATUS:-1}"
          EXPECTED_COMMIT="${EXPECTED_COMMIT:-${GITHUB_SHA}}"
          INCIDENT_STATUS=failure

          if [ "${CORE_STATUS}" = "0" ] && [ "${PREFLIGHT_STATUS}" = "0" ]; then
            INCIDENT_STATUS=success
          fi

          node scripts/manage-production-incident.mjs \
            --status "${INCIDENT_STATUS}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${EXPECTED_COMMIT}" \
            --event "${GITHUB_EVENT_NAME}" \
            --core-status "${CORE_STATUS}" \
            --preflight-status "${PREFLIGHT_STATUS}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Resumir garantia operacional
        if: always()
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.context.outputs.expected_commit }}
          DEPLOYMENT_REQUIRED: ${{ steps.context.outputs.deployment_required }}
          CORE_STATUS: ${{ steps.smoke.outputs.core_status }}
          PREFLIGHT_STATUS: ${{ steps.smoke.outputs.preflight_status }}
          INCIDENT_OUTCOME: ${{ steps.incident.outcome }}
        run: |
          {
            echo '### Monitoramento contínuo de Production'
            echo
            echo "- Ambiente: \`${RADAR_PRODUCTION_URL}\`"
            echo "- Novo deployment exigido: \`${DEPLOYMENT_REQUIRED:-não resolvido}\`"
            echo "- Commit esperado: \`${EXPECTED_COMMIT:-não resolvido}\`"
            echo "- Site, manifesto, assets e bloqueio anônimo: \`${CORE_STATUS:-não executado}\`"
            echo "- Preflight das Edge Functions catalogadas: \`${PREFLIGHT_STATUS:-não executado}\`"
            echo "- Gestão automática do incidente: \`${INCIDENT_OUTCOME:-não executada}\`"
            echo "- Evento: \`${GITHUB_EVENT_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
