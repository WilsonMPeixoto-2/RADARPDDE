name: Habilitar observabilidade Vercel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enable-vercel-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    name: Ativar Web Analytics e Speed Insights
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_GfXuUuO3dF2jykpp9QgyqIDsxg4U
      VERCEL_TEAM_ID: team_EFJunPOtGozS99jZ6zkIQXHF
      VERCEL_TEAM_SLUG: wilson-m-peixotos-projects
    steps:
      - name: Conferir credencial
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::O secret VERCEL_TOKEN não está disponível neste repositório."
            exit 1
          fi

      - name: Ativar Web Analytics
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project web-analytics radarpdde-fix \
            --scope "$VERCEL_TEAM_SLUG" \
            --format json \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Ativar Speed Insights
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project speed-insights radarpdde-fix \
            --scope "$VERCEL_TEAM_SLUG" \
            --format json \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Verificar Web Analytics pela API
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/query/web-analytics/visits/count?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID")"
          node -e 'const x=JSON.parse(process.argv[1]); if (!x || typeof x !== "object") process.exit(1); console.log("Web Analytics query OK");' "$response"
