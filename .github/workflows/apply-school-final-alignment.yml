name: Alinhar gate final à migration de escola

on:
  push:
    branches:
      - fix/school-assignment-authorization-20260805
    paths:
      - .github/workflows/apply-school-final-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/school-assignment-authorization-20260805
          fetch-depth: 0
      - name: Atualizar gate final
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path('scripts/check-supabase-final-alignment.js')
          text = file.read_text(encoding='utf-8')

          replacements = [
              (
                  "const integrityMigrationPath = 'supabase/migrations/202608040001_production_integrity_monitor.sql';",
                  "const integrityMigrationPath = 'supabase/migrations/202608040001_production_integrity_monitor.sql';\nconst assignmentMigrationPath = 'supabase/migrations/202608050001_school_assignment_authorization.sql';"
              ),
              (
                  "    integrityMigrationPath,\n    'supabase/functions/_shared/team-account-domain.mjs',",
                  "    integrityMigrationPath,\n    assignmentMigrationPath,\n    'supabase/functions/_shared/team-account-domain.mjs',"
              ),
              (
                  "    'supabase/tests/database/production-integrity-monitor.test.sql',\n    'scripts/check-production-data-integrity.mjs',",
                  "    'supabase/tests/database/production-integrity-monitor.test.sql',\n    'supabase/tests/database/school-assignment-authorization.test.sql',\n    'scripts/check-production-data-integrity.mjs',"
              ),
              (
                  "    const authGate = read('src/integration/auth-gate.js');",
                  "    const assignmentMigration = read(assignmentMigrationPath);\n    [\n        /function public\\.enforce_school_controller_assignment_authorization\\(\\)[\\s\\S]*security invoker/i,\n        /old\\.controller_id is distinct from new\\.controller_id/i,\n        /v_role not in \\('federal_assistant', 'technical_admin'\\)/i,\n        /create trigger schools_controller_assignment_authorization[\\s\\S]*before update of controller_id on public\\.schools/i\n    ].forEach(pattern => {\n        if (!pattern.test(assignmentMigration)) {\n            findings.push(`Autorização da carteira escolar incompleta: ${pattern}`);\n        }\n    });\n\n    const authGate = read('src/integration/auth-gate.js');"
              ),
              (
                  "    if (migrationCount !== 26) {\n        findings.push(`Conjunto final deve conter 26 migrations; encontrado: ${migrationCount}.`);\n    }",
                  "    if (migrationCount !== 27) {\n        findings.push(`Conjunto final deve conter 27 migrations; encontrado: ${migrationCount}.`);\n    }"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'trecho esperado uma vez; encontrado {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          file.write_text(text, encoding='utf-8')
          PY
      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          git rm .github/workflows/apply-school-final-alignment.yml
          git add scripts/check-supabase-final-alignment.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: exigir autorização da carteira no gate final"
          git push origin HEAD:fix/school-assignment-authorization-20260805
