name: C3 lock bootstrap sem http-server

on:
  push:
    branches:
      - tmp/phase-c3-lock-no-http-server-2026-09-27

permissions:
  contents: write

jobs:
  lock:
    name: Gerar lock sem http-server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Gerar e validar lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/http-server']) process.exit(1)"
          npm ci --ignore-scripts
          test ! -e node_modules/.bin/http-server

      - name: Materializar lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lock já materializado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(c3-bootstrap): materializar lock sem http-server"
            git push
          fi

      - name: Publicar lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c3-lock-sem-http-server
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
