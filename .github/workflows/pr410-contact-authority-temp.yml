name: PR410 temporary contact authority GREEN

on:
  push:
    branches:
      - refactor/simplify-operational-sync-2026-10-04
    paths:
      - .github/workflows/pr410-contact-authority-temp.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/simplify-operational-sync-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar patch já versionado
        run: python3 scripts/pr410-contact-authority-temp.py
      - name: Verificar GREEN dirigido
        run: |
          node --check src/application/data-service.js
          node --test tests/unit/school-operational-context-application.test.js tests/unit/school-operational-context-contact-authority.test.js
          git diff --check
      - name: Commitar somente após GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/data-service.js tests/unit/school-operational-context-application.test.js
          git commit -m "fix: preservar autoridade de contatos na fatia escolar"
          git push origin HEAD:refactor/simplify-operational-sync-2026-10-04
