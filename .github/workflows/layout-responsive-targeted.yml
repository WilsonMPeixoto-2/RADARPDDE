name: Layout responsivo direcionado

on:
  push:
    branches:
      - fix/layout-desktop-responsive-2026-09-09

permissions:
  contents: read

jobs:
  layout-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar regressões responsivas
        run: npx playwright test tests/e2e/layout-responsive-regressions.spec.js --project=desktop-chromium
