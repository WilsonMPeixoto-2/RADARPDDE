name: Atualização única Archiver transitivo do ExcelJS

on:
  push:
    branches:
      - maintenance/dependency-refresh-adversarial-2026-09-05

permissions:
  contents: write

jobs:
  refresh-archiver-compatible:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Baseline limpa
        run: npm ci

      - name: Aplicar Archiver 6.0.2 compatível com API CommonJS do ExcelJS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides ||= {};
          pkg.overrides.exceljs = { ...(pkg.overrides.exceljs || {}), archiver: '6.0.2' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ls exceljs archiver archiver-utils glob inflight zip-stream

      - name: Provar contrato XLSX com Archiver 6 antes de outras substituições
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const ExcelJS = require('exceljs');
          (async () => {
            const wb = new ExcelJS.Workbook();
            wb.addWorksheet('Memoria').addRows([['A','B'], [1,2], [3,4]]);
            const bytes = await wb.xlsx.writeBuffer();
            const copy = new ExcelJS.Workbook();
            await copy.xlsx.load(bytes);
            if (copy.getWorksheet('Memoria').getCell('B3').value !== 4) throw new Error('writeBuffer divergiu');
            const file = path.join(os.tmpdir(), `radar-archiver6-${Date.now()}.xlsx`);
            await wb.xlsx.writeFile(file);
            const fileCopy = new ExcelJS.Workbook();
            await fileCopy.xlsx.readFile(file);
            if (fileCopy.getWorksheet('Memoria').getCell('B2').value !== 2) throw new Error('writeFile divergiu');
            fs.unlinkSync(file);
            const streamFile = path.join(os.tmpdir(), `radar-archiver6-stream-${Date.now()}.xlsx`);
            const streamWb = new ExcelJS.stream.xlsx.WorkbookWriter({ filename: streamFile, useStyles: true, useSharedStrings: true });
            const streamWs = streamWb.addWorksheet('Stream');
            streamWs.addRow(['x','y']).commit();
            streamWs.addRow([10,20]).commit();
            streamWs.commit();
            await streamWb.commit();
            const streamCopy = new ExcelJS.Workbook();
            await streamCopy.xlsx.readFile(streamFile);
            if (streamCopy.getWorksheet('Stream').getCell('B2').value !== 20) throw new Error('WorkbookWriter divergiu');
            fs.unlinkSync(streamFile);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Atualizar Glob somente na versão de Archiver Utils usada pelo Archiver 6
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const archiverUtilsVersion = JSON.parse(fs.readFileSync('node_modules/archiver-utils/package.json', 'utf8')).version;
          const key = `archiver-utils@${archiverUtilsVersion}`;
          pkg.overrides ||= {};
          pkg.overrides[key] = { ...(pkg.overrides[key] || {}), glob: '13.0.6' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync('/tmp/archiver-utils-version', `${archiverUtilsVersion}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci-after-archiver.log
          if grep -E 'npm warn deprecated (inflight|glob)@' /tmp/npm-ci-after-archiver.log; then
            echo 'Ainda há aviso deprecado de inflight/glob.' >&2
            exit 1
          fi
          npm ls exceljs archiver archiver-utils glob inflight zip-stream
          if npm ls inflight >/dev/null 2>&1; then echo 'inflight ainda presente' >&2; exit 1; fi
          if npm ls glob@7.2.3 >/dev/null 2>&1; then echo 'glob 7.2.3 ainda presente' >&2; exit 1; fi
          if npm ls glob@8 >/dev/null 2>&1; then echo 'glob 8 ainda presente' >&2; exit 1; fi

      - name: Testar compatibilidade do Glob moderno com Archiver Utils e Archiver
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const { PassThrough } = require('node:stream');
          const archiver = require('archiver');
          const unzipper = require('unzipper');
          const archiverFile = require('archiver-utils/file');
          (async () => {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'radar-glob-'));
            fs.writeFileSync(path.join(dir, 'a.txt'), 'A');
            fs.writeFileSync(path.join(dir, 'b.txt'), 'B');
            fs.writeFileSync(path.join(dir, 'c.json'), '{}');
            const expanded = archiverFile.expand({ cwd: dir }, ['*.txt']).sort();
            if (expanded.join(',') !== 'a.txt,b.txt') throw new Error(`archiver-utils file.expand divergiu: ${expanded.join(',')}`);
            const archive = archiver('zip');
            const sink = new PassThrough();
            const chunks = [];
            sink.on('data', chunk => chunks.push(chunk));
            const finished = new Promise((resolve, reject) => {
              sink.on('end', resolve);
              sink.on('error', reject);
              archive.on('error', reject);
            });
            archive.pipe(sink);
            archive.glob('*.txt', { cwd: dir });
            await archive.finalize();
            await finished;
            const zip = Buffer.concat(chunks);
            const directory = await unzipper.Open.buffer(zip);
            const names = directory.files.map(file => file.path).sort();
            if (names.join(',') !== 'a.txt,b.txt') throw new Error(`archiver.glob divergiu: ${names.join(',')}`);
            fs.rmSync(dir, { recursive: true, force: true });
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Stress de geração XLSX por memória arquivo e stream
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const ExcelJS = require('exceljs');
          (async () => {
            for (let i = 0; i < 30; i += 1) {
              const wb = new ExcelJS.Workbook();
              const ws = wb.addWorksheet(`R${i}`);
              ws.addRows([['A','B'], [i, i + 1], [i + 2, i + 3]]);
              const bytes = await wb.xlsx.writeBuffer();
              const copy = new ExcelJS.Workbook();
              await copy.xlsx.load(bytes);
              if (copy.getWorksheet(`R${i}`).getCell('B3').value !== i + 3) throw new Error(`writeBuffer divergiu em ${i}`);
            }
            const streamFile = path.join(os.tmpdir(), `radar-archiver-final-stream-${Date.now()}.xlsx`);
            const streamWb = new ExcelJS.stream.xlsx.WorkbookWriter({ filename: streamFile, useStyles: true, useSharedStrings: true });
            const streamWs = streamWb.addWorksheet('Stream');
            for (let row = 1; row <= 500; row += 1) streamWs.addRow([row, `linha-${row}`]).commit();
            streamWs.commit();
            await streamWb.commit();
            const readBack = new ExcelJS.Workbook();
            await readBack.xlsx.readFile(streamFile);
            if (readBack.getWorksheet('Stream').getCell('B500').value !== 'linha-500') throw new Error('WorkbookWriter stress divergiu');
            fs.unlinkSync(streamFile);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Certificações do Excel e gates locais
        shell: bash
        run: |
          set -euo pipefail
          npm run build:exceljs
          npm run check
          CI=false npm run check:generated
          npm run certify:excel:fixture
          node --test \
            tests/unit/excel-export-audit.test.js \
            tests/unit/excel-integral-certification.test.js \
            tests/unit/excel-sme-export-integration.test.js \
            tests/unit/excel-sme-monthly.test.js \
            tests/unit/excel-sme-renderer.test.js \
            tests/unit/excel-sme-template-loader.test.js \
            tests/unit/excel-sme-template-renderer.test.js \
            tests/unit/exceljs-audit-policy.test.js
          npm run test:unit
          npm run test:integration
          npm run typecheck:database
          npm run analyze:unused
          npm audit --audit-level=low

      - name: E2E do Excel
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/assistant-dashboard-excel-actions.spec.js --project=desktop-chromium

      - name: Registrar saúde e decisões de compatibilidade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-health
          npm outdated --json > dependency-health/npm-outdated-after-exceljs-archiver-2026-09-05.json 2>&1 || true
          npm audit --json > dependency-health/npm-audit-after-exceljs-archiver-2026-09-05.json 2>&1 || true
          npm ls exceljs uuid archiver archiver-utils glob inflight fast-csv lodash.isequal unzipper fstream rimraf zip-stream > dependency-health/deprecated-chain-after-exceljs-archiver-2026-09-05.txt || true
          cat > dependency-health/exceljs-archiver-selection-2026-09-05.txt <<EOF
          ExcelJS: 4.4.0
          Archiver 8.0.0: rejeitado; WorkbookWriter falha porque o pacote deixou de expor a função CommonJS esperada (TypeError: Archiver is not a function).
          Archiver 7.0.1: rejeitado; WorkbookWriter falha ao anexar o StreamBuf do ExcelJS (INPUTSTEAMBUFFERREQUIRED).
          Archiver 6.0.2: selecionado após writeBuffer, writeFile, WorkbookWriter, stress e certificações.
          Archiver Utils resolvido: $(cat /tmp/archiver-utils-version)
          Glob na cadeia Archiver Utils: 13.0.6, validado por file.expand e archiver.glob.
          EOF
          cat dependency-health/deprecated-chain-after-exceljs-archiver-2026-09-05.txt
          cat dependency-health/exceljs-archiver-selection-2026-09-05.txt

      - name: Commit e publicar atualização validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/exceljs.min.js \
            dependency-health/npm-outdated-after-exceljs-archiver-2026-09-05.json \
            dependency-health/npm-audit-after-exceljs-archiver-2026-09-05.json \
            dependency-health/deprecated-chain-after-exceljs-archiver-2026-09-05.txt \
            dependency-health/exceljs-archiver-selection-2026-09-05.txt
          git commit -m 'chore(deps): modernizar cadeia Archiver do ExcelJS'
          npm ci
          npm audit --audit-level=low
          git diff --exit-code
          git push origin HEAD:maintenance/dependency-refresh-adversarial-2026-09-05
