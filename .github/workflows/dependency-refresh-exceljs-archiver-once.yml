name: Atualização única Glob transitivo do ExcelJS

on:
  push:
    branches:
      - maintenance/dependency-refresh-adversarial-2026-09-05

permissions:
  contents: write

jobs:
  refresh-glob-compatible:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Baseline limpa e escopo de Archiver Utils
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls archiver-utils --all
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tree = JSON.parse(execFileSync('npm', ['ls', 'archiver-utils', '--all', '--json'], { encoding: 'utf8' }));
          function parentsWith(name, node, path = []) {
            const out = [];
            for (const [key, dep] of Object.entries(node?.dependencies || {})) {
              const next = [...path, key];
              if (key === name) out.push(next.join(' > '));
              out.push(...parentsWith(name, dep, next));
            }
            return out;
          }
          const paths = parentsWith('archiver-utils', tree);
          if (!paths.length) throw new Error('archiver-utils não encontrado');
          if (paths.some(p => !p.includes('exceljs'))) throw new Error(`archiver-utils também é usado fora do ExcelJS: ${paths.join(' | ')}`);
          console.log(`archiver-utils restrito à cadeia ExcelJS: ${paths.join(' | ')}`);
          NODE

      - name: Aplicar Glob 13 apenas às dependências de Archiver Utils
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides ||= {};
          pkg.overrides['archiver-utils'] = {
            ...(pkg.overrides['archiver-utils'] || {}),
            glob: '13.0.6'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci-modern-glob.log
          echo '=== árvore alvo ==='
          npm ls exceljs archiver archiver-utils glob inflight zip-stream
          if npm ls inflight >/dev/null 2>&1; then echo 'inflight ainda presente' >&2; exit 1; fi
          if npm ls glob@7.2.3 >/dev/null 2>&1; then echo 'glob 7.2.3 ainda presente' >&2; exit 1; fi
          if grep -E 'npm warn deprecated (inflight|glob)@' /tmp/npm-ci-modern-glob.log; then
            echo 'Persistiu aviso deprecado de inflight/glob.' >&2
            exit 1
          fi

      - name: Provar glob.sync de Archiver Utils 2 e 3
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const au2 = require('archiver-utils/file');
          const au3 = require('./node_modules/zip-stream/node_modules/archiver-utils/file');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'radar-archiver-utils-'));
          fs.writeFileSync(path.join(dir, 'a.txt'), 'A');
          fs.writeFileSync(path.join(dir, 'b.txt'), 'B');
          fs.writeFileSync(path.join(dir, 'c.json'), '{}');
          for (const [name, api] of [['archiver-utils@2.1.0', au2], ['archiver-utils@3.0.4', au3]]) {
            const files = api.expand({ cwd: dir }, ['*.txt']).sort();
            if (files.join(',') !== 'a.txt,b.txt') throw new Error(`${name} file.expand divergiu: ${files.join(',')}`);
          }
          fs.rmSync(dir, { recursive: true, force: true });
          NODE

      - name: Provar archiver.glob e ZIP real
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const { PassThrough } = require('node:stream');
          const archiver = require('archiver');
          const unzipper = require('unzipper');
          (async () => {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'radar-archiver-glob-'));
            fs.writeFileSync(path.join(dir, 'a.txt'), 'A');
            fs.writeFileSync(path.join(dir, 'b.txt'), 'B');
            fs.writeFileSync(path.join(dir, 'c.json'), '{}');
            const archive = archiver('zip');
            const sink = new PassThrough();
            const chunks = [];
            sink.on('data', chunk => chunks.push(chunk));
            const finished = new Promise((resolve, reject) => {
              sink.on('end', resolve);
              sink.on('error', reject);
              archive.on('error', reject);
            });
            archive.pipe(sink);
            archive.glob('*.txt', { cwd: dir });
            await archive.finalize();
            await finished;
            const directory = await unzipper.Open.buffer(Buffer.concat(chunks));
            const names = directory.files.map(file => file.path).sort();
            if (names.join(',') !== 'a.txt,b.txt') throw new Error(`archiver.glob divergiu: ${names.join(',')}`);
            fs.rmSync(dir, { recursive: true, force: true });
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Stress do ExcelJS incluindo WorkbookWriter
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const ExcelJS = require('exceljs');
          (async () => {
            for (let i = 0; i < 30; i += 1) {
              const wb = new ExcelJS.Workbook();
              const ws = wb.addWorksheet(`R${i}`);
              ws.addRows([['A','B'], [i, i + 1], [i + 2, i + 3]]);
              const bytes = await wb.xlsx.writeBuffer();
              const copy = new ExcelJS.Workbook();
              await copy.xlsx.load(bytes);
              if (copy.getWorksheet(`R${i}`).getCell('B3').value !== i + 3) throw new Error(`writeBuffer divergiu em ${i}`);
            }
            const file = path.join(os.tmpdir(), `radar-exceljs-file-${Date.now()}.xlsx`);
            const wb = new ExcelJS.Workbook();
            wb.addWorksheet('Arquivo').addRows([['A','B'], ['teste',42]]);
            await wb.xlsx.writeFile(file);
            const fileCopy = new ExcelJS.Workbook();
            await fileCopy.xlsx.readFile(file);
            if (fileCopy.getWorksheet('Arquivo').getCell('B2').value !== 42) throw new Error('writeFile divergiu');
            fs.unlinkSync(file);
            const streamFile = path.join(os.tmpdir(), `radar-exceljs-stream-${Date.now()}.xlsx`);
            const streamWb = new ExcelJS.stream.xlsx.WorkbookWriter({ filename: streamFile, useStyles: true, useSharedStrings: true });
            const streamWs = streamWb.addWorksheet('Stream');
            for (let row = 1; row <= 500; row += 1) streamWs.addRow([row, `linha-${row}`]).commit();
            streamWs.commit();
            await streamWb.commit();
            const readBack = new ExcelJS.Workbook();
            await readBack.xlsx.readFile(streamFile);
            if (readBack.getWorksheet('Stream').getCell('B500').value !== 'linha-500') throw new Error('WorkbookWriter divergiu');
            fs.unlinkSync(streamFile);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Certificações Excel e gates locais
        shell: bash
        run: |
          set -euo pipefail
          npm run build:exceljs
          npm run check
          CI=false npm run check:generated
          npm run certify:excel:fixture
          node --test \
            tests/unit/excel-export-audit.test.js \
            tests/unit/excel-integral-certification.test.js \
            tests/unit/excel-sme-export-integration.test.js \
            tests/unit/excel-sme-monthly.test.js \
            tests/unit/excel-sme-renderer.test.js \
            tests/unit/excel-sme-template-loader.test.js \
            tests/unit/excel-sme-template-renderer.test.js \
            tests/unit/exceljs-audit-policy.test.js
          npm run test:unit
          npm run test:integration
          npm run typecheck:database
          npm run analyze:unused
          npm audit --audit-level=low

      - name: E2E do Excel
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/assistant-dashboard-excel-actions.spec.js --project=desktop-chromium

      - name: Registrar saúde final e decisão de compatibilidade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-health
          npm outdated --json > dependency-health/npm-outdated-after-exceljs-glob-2026-09-05.json 2>&1 || true
          npm audit --json > dependency-health/npm-audit-after-exceljs-glob-2026-09-05.json 2>&1 || true
          npm ls exceljs uuid archiver archiver-utils glob inflight fast-csv lodash.isequal unzipper fstream rimraf zip-stream > dependency-health/deprecated-chain-after-exceljs-glob-2026-09-05.txt || true
          cat > dependency-health/exceljs-archiver-compatibility-2026-09-05.txt <<'EOF'
          ExcelJS 4.4.0 mantém Archiver 5.3.2 intencionalmente.
          Archiver 8.0.0 foi rejeitado: WorkbookWriter falha com "TypeError: Archiver is not a function".
          Archiver 7.0.1 foi rejeitado: WorkbookWriter falha com INPUTSTEAMBUFFERREQUIRED.
          Archiver 6.0.2 foi rejeitado: WorkbookWriter falha com INPUTSTEAMBUFFERREQUIRED.
          archiver-utils aparece somente na cadeia do ExcelJS; por isso o override de Glob é restrito a esse pacote, preservando Archiver 5.3.2 e sua semântica de streaming.
          EOF
          cat dependency-health/deprecated-chain-after-exceljs-glob-2026-09-05.txt

      - name: Commit e publicar atualização validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/exceljs.min.js \
            dependency-health/npm-outdated-after-exceljs-glob-2026-09-05.json \
            dependency-health/npm-audit-after-exceljs-glob-2026-09-05.json \
            dependency-health/deprecated-chain-after-exceljs-glob-2026-09-05.txt \
            dependency-health/exceljs-archiver-compatibility-2026-09-05.txt
          git commit -m 'chore(deps): modernizar Glob transitivo do ExcelJS'
          npm ci 2>&1 | tee /tmp/npm-ci-final.log
          if grep -E 'npm warn deprecated (inflight|glob)@' /tmp/npm-ci-final.log; then exit 1; fi
          npm audit --audit-level=low
          git diff --exit-code
          git push origin HEAD:maintenance/dependency-refresh-adversarial-2026-09-05
