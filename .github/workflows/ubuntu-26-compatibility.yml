name: Compatibilidade controlada Ubuntu 24.04 x 26.04

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/unit/ci-runner-version-contract.test.js'
      - 'tests/unit/tooling-contract.test.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain-smoke:
    name: Toolchain e Chromium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 24 e cache npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Registrar ambiente efetivo e verificar Docker
        shell: bash
        run: |
          set -euo pipefail
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          cat /etc/os-release
          node --version
          npm --version
          docker info --format '{{.ServerVersion}}'
      - name: Instalar lockfile e verificar CLI
        run: |
          npm ci
          npx --no-install supabase --version
      - name: Executar contratos e referências de workflows
        run: |
          node --test tests/unit/ci-runner-version-contract.test.js tests/unit/tooling-contract.test.js
          npm run check:workflow-references
      - name: Instalar e abrir Chromium real
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('data:text/html,<html><title>CI Ubuntu</title><body>RADAR</body></html>');
          if (await page.title() !== 'CI Ubuntu') throw new Error('Chromium did not render test page');
          await browser.close();
          NODE
      - name: Verificar imagem postgres-meta no GHCR
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/supabase/postgres-meta:v0.97.0
          docker image inspect ghcr.io/supabase/postgres-meta:v0.97.0 --format '{{.Id}}'
