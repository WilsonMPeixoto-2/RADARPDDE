name: Atualização única Unzipper transitivo do ExcelJS

on:
  push:
    branches:
      - maintenance/dependency-refresh-adversarial-2026-09-05

permissions:
  contents: write

jobs:
  refresh-exceljs-unzipper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Baseline limpa
        run: npm ci

      - name: Atualizar Unzipper apenas na cadeia do ExcelJS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides ||= {};
          pkg.overrides.exceljs = { ...(pkg.overrides.exceljs || {}), unzipper: '0.12.5' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ls exceljs unzipper fstream rimraf
          if npm ls fstream >/dev/null 2>&1; then echo 'fstream ainda presente' >&2; exit 1; fi
          if npm ls rimraf@2.7.1 >/dev/null 2>&1; then echo 'rimraf 2.7.1 ainda presente' >&2; exit 1; fi

      - name: Round-trip repetido de leitura XLSX
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ExcelJS = require('exceljs');
          (async () => {
            const source = new ExcelJS.Workbook();
            source.addWorksheet('Primeira').addRows([['A', 'B'], [1, 2], [3, 4]]);
            source.addWorksheet('Segunda').addRows([['C'], ['teste']]);
            const bytes = await source.xlsx.writeBuffer();
            for (let i = 0; i < 30; i += 1) {
              const copy = new ExcelJS.Workbook();
              await copy.xlsx.load(bytes);
              if (copy.getWorksheet('Primeira').getCell('B3').value !== 4) throw new Error(`round-trip falhou na iteração ${i}`);
              if (copy.getWorksheet('Segunda').getCell('A2').value !== 'teste') throw new Error(`segunda aba falhou na iteração ${i}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Certificações focadas do Excel
        shell: bash
        run: |
          set -euo pipefail
          npm run build:exceljs
          CI=false npm run check:generated
          npm run certify:excel:fixture
          node --test \
            tests/unit/excel-integral-certification.test.js \
            tests/unit/excel-sme-export-integration.test.js \
            tests/unit/excel-sme-monthly.test.js \
            tests/unit/excel-sme-renderer.test.js \
            tests/unit/excel-sme-template-loader.test.js \
            tests/unit/excel-sme-template-renderer.test.js
          npm run test:integration
          npm audit --audit-level=low

      - name: Registrar árvore remanescente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-health
          npm ls exceljs uuid archiver glob inflight fast-csv lodash.isequal unzipper fstream rimraf > dependency-health/deprecated-chain-after-exceljs-unzipper-2026-09-05.txt || true
          npm audit --json > dependency-health/npm-audit-after-exceljs-unzipper-2026-09-05.json 2>&1 || true
          cat dependency-health/deprecated-chain-after-exceljs-unzipper-2026-09-05.txt

      - name: Commit local da atualização validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/exceljs.min.js dependency-health/deprecated-chain-after-exceljs-unzipper-2026-09-05.txt dependency-health/npm-audit-after-exceljs-unzipper-2026-09-05.json
          git commit -m 'chore(deps): atualizar Unzipper transitivo do ExcelJS'
          npm ci
          npm audit --audit-level=low
          git diff --exit-code
          git push origin HEAD:maintenance/dependency-refresh-adversarial-2026-09-05
