name: Smoke de Production do Excel SME

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/excel-sme-production-smoke.yml'
      - 'assets/templates/CRE_04_CONTROLE_ONEDRIVE2026.xlsx'
      - 'vendor/exceljs.min.js'
      - 'scripts/build-vercel.mjs'
      - 'scripts/build-vercel-output.mjs'
      - 'scripts/generate-excel-sme-assets-manifest.mjs'
      - 'scripts/verify-excel-sme-template.mjs'
      - 'scripts/verify-excel-sme-production-assets.mjs'
      - 'src/domain/excel-sme-export-model.js'
      - 'src/domain/excel-sme-template-renderer.js'
      - 'src/domain/excel-sme-monthly-renderer.js'
      - 'src/integration/excel-sme-runtime-loader.js'
      - 'src/integration/excel-export-integration.js'
      - 'src/integration/load-excel-export.js'
      - 'tests/e2e/excel-export-button.spec.js'
      - 'tests/integration/excel-sme-assets-manifest.test.js'
      - 'tests/unit/excel-sme-*.test.js'
      - 'tests/unit/load-excel-export.test.js'
      - 'tests/unit/vercel-build.test.js'
      - 'tests/unit/vercel-build-output.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excel-sme-production-smoke
  cancel-in-progress: false

jobs:
  verificar-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validar verificadores
        run: |
          node --check scripts/verify-excel-sme-template.mjs
          node --check scripts/verify-excel-sme-production-assets.mjs

      - name: Aguardar deployment e validar assets publicados
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-excel-sme-production-assets.mjs \
            --base-url https://radarpdde-fix.vercel.app \
            --expected-commit "${EXPECTED_COMMIT_SHA}" \
            --attempts 60 \
            --interval-ms 10000

      - name: Registrar evidência
        run: |
          echo '### Excel SME — smoke de Production' >> "${GITHUB_STEP_SUMMARY}"
          echo '- Alias: radarpdde-fix.vercel.app' >> "${GITHUB_STEP_SUMMARY}"
          echo '- Commit esperado: `${{ github.sha }}`' >> "${GITHUB_STEP_SUMMARY}"
          echo '- Manifesto: versão, caminhos, tamanhos e SHA-256 verificados.' >> "${GITHUB_STEP_SUMMARY}"
          echo '- Template: HTTP 200, hash, tamanho, assinatura ZIP e estrutura OOXML verificados.' >> "${GITHUB_STEP_SUMMARY}"
          echo '- ExcelJS: HTTP 200, hash, tamanho e conteúdo não HTML verificados.' >> "${GITHUB_STEP_SUMMARY}"
