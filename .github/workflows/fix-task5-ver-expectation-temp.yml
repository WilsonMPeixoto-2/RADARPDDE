name: Alinhar expectativa VER da Task 5

on:
  push:
    branches:
      - docs/auditoria-funcional-frontend-supabase-design-20260806
    paths:
      - .github/workflows/fix-task5-ver-expectation-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch da auditoria
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/auditoria-funcional-frontend-supabase-design-20260806

      - name: Corrigir expectativa e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          grep -F "consolidated.value.result" tests/e2e/audit-task5-temp.spec.js
          sed -i 's/consolidated\.value\.result/consolidated.value.status/' tests/e2e/audit-task5-temp.spec.js
          grep -F "consolidated.value.status" tests/e2e/audit-task5-temp.spec.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-task5-ver-expectation-temp.yml
          git add tests/e2e/audit-task5-temp.spec.js
          git commit -m "test: usar contrato real da consolidação na Task 5"
          git push origin HEAD:docs/auditoria-funcional-frontend-supabase-design-20260806
