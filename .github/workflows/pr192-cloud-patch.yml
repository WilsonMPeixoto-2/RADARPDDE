name: PR 192 Cloud Patch

on:
  push:
    branches:
      - fix/incremental-operational-ui-2026-08-22
    paths:
      - .github/workflows/pr192-cloud-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/incremental-operational-ui-2026-08-22
          fetch-depth: 0

      - name: Apply targeted source patch
        run: node scripts/apply-pr192-fixes.mjs

      - name: Remove one-off patch machinery
        run: |
          rm -f scripts/apply-pr192-fixes.mjs
          rm -f .github/workflows/pr192-cloud-patch.yml

      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: completar caminho incremental do prontuário"
          git push origin HEAD:fix/incremental-operational-ui-2026-08-22
