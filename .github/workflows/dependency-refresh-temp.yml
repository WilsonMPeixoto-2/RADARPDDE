name: Materializar atualização de dependências

on:
  push:
    branches:
      - chore/dependencies-current-2026-09-14

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'materializar lockfile e bundles') }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Alinhar contratos versionados
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`${path}: trecho não encontrado: ${from}`);
            fs.writeFileSync(path, source.replaceAll(from, to));
          }
          replace('supabase/functions/team-account-management/index.ts', '@supabase/supabase-js@2.112.4', '@supabase/supabase-js@2.116.0');
          replace('tests/unit/tooling-contract.test.js', "packageJson.devDependencies.knip, '6.33.0'", "packageJson.devDependencies.knip, '6.35.1'");
          replace('tests/unit/supabase-modernization.test.js', "pkg.devDependencies['@supabase/supabase-js'], '2.112.4'", "pkg.devDependencies['@supabase/supabase-js'], '2.116.0'");
          replace('tests/unit/supabase-modernization.test.js', 'Supabase JS 2.112.4', 'Supabase JS 2.116.0');
          replace('tests/unit/supabase-modernization.test.js', /@supabase\\/supabase-js 2\\.112\\.4/.source, /@supabase\\/supabase-js 2\\.116\\.0/.source);
          replace('tests/unit/supabase-modernization.test.js', /@supabase\\/supabase-js@2\\.112\\.4/.source, /@supabase\\/supabase-js@2\\.116\\.0/.source);
          NODE

      - name: Resolver lockfile no npm atual
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar árvore reproduzível
        run: npm ci --ignore-scripts

      - name: Regenerar cliente Supabase do navegador
        run: npm run build:supabase-client

      - name: Validar contratos de dependência
        run: |
          npm run check:generated
          node --test tests/unit/supabase-modernization.test.js tests/unit/tooling-contract.test.js
          npm run analyze:unused
          npx playwright --version

      - name: Registrar lockfile e artefatos regenerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vendor/supabase-client.js supabase/functions/team-account-management/index.ts tests/unit/tooling-contract.test.js tests/unit/supabase-modernization.test.js
          git diff --cached --check
          git commit -m "chore: materializar lockfile e bundles das dependências atuais"
          git push origin HEAD:chore/dependencies-current-2026-09-14
