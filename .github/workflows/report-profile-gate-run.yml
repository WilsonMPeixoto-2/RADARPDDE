name: Consultar execução do gate remoto

on:
  push:
    branches:
      - hardening/node24-profile-viewport-gate
    paths:
      - '.github/workflows/report-profile-gate-run.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar execução do Supabase descartável
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 63537f38ecda9843add2fb5d5b2a9feaa3eac051
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate-remoto-perfis-viewports.yml/runs?branch=hardening/node24-profile-viewport-gate&per_page=20")"
          selected="$(jq --arg sha "${EXPECTED_SHA}" '.workflow_runs | map(select(.head_sha == $sha)) | .[0] // {}' <<<"${response}")"
          run_id="$(jq -r '.id // empty' <<<"${selected}")"
          status="$(jq -r '.status // "ausente"' <<<"${selected}")"
          conclusion="$(jq -r '.conclusion // "pendente"' <<<"${selected}")"
          url="$(jq -r '.html_url // empty' <<<"${selected}")"
          jobs='[]'
          if [[ -n "${run_id}" ]]; then
            jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '[.jobs[] | {id,name,status,conclusion}]')"
          fi
          gh pr comment 111 --repo "${GITHUB_REPOSITORY}" --body "Gate com Supabase descartável: run **${run_id:-não encontrado}**, estado **${status}**, conclusão **${conclusion}**, SHA \`${EXPECTED_SHA}\`. Jobs: \`${jobs}\`. ${url}"
