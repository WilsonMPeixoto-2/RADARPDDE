name: Consultar execução do gate remoto

on:
  push:
    branches:
      - hardening/node24-profile-viewport-gate
    paths:
      - '.github/workflows/report-profile-gate-run.yml'

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extrair diagnóstico do run inválido
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '30515035570'
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          view="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" 2>&1 || true)"
          failed="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 || true)"
          metadata_summary="$(jq -c '{id,status,conclusion,event,path,display_title,head_sha,run_attempt,created_at,updated_at}' <<<"${metadata}")"
          body="Diagnóstico nativo do gate remoto. Metadados: \`${metadata_summary}\`. gh run view: \`$(tr '\n' ' ' <<<"${view}" | cut -c1-1800)\`. log-failed: \`$(tr '\n' ' ' <<<"${failed}" | cut -c1-1800)\`."
          gh pr comment 111 --repo "${GITHUB_REPOSITORY}" --body "${body}"
