name: Consultar execução do gate remoto

on:
  push:
    branches:
      - hardening/node24-profile-viewport-gate
    paths:
      - '.github/workflows/report-profile-gate-run.yml'

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar execução mais recente
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 9264071b9af03efef2180748f070119de626fd79
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate-remoto-perfis-viewports.yml/runs?branch=hardening/node24-profile-viewport-gate&per_page=10")"
          selected="$(jq --arg sha "${EXPECTED_SHA}" '.workflow_runs | map(select(.head_sha == $sha)) | .[0] // .[0] // {}' <<<"${response}")"
          run_id="$(jq -r '.id // empty' <<<"${selected}")"
          status="$(jq -r '.status // "ausente"' <<<"${selected}")"
          conclusion="$(jq -r '.conclusion // "pendente"' <<<"${selected}")"
          url="$(jq -r '.html_url // empty' <<<"${selected}")"
          event="$(jq -r '.event // "desconhecido"' <<<"${selected}")"
          head_sha="$(jq -r '.head_sha // "desconhecido"' <<<"${selected}")"
          check_suite_id="$(jq -r '.check_suite_id // empty' <<<"${selected}")"
          detail='sem check run ou anotação disponível'
          if [[ -n "${check_suite_id}" ]]; then
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/check-suites/${check_suite_id}/check-runs")"
            detail="$(jq -c '[.check_runs[]? | {name, status, conclusion, title: .output.title, summary: .output.summary}]' <<<"${checks}")"
          fi
          gh pr comment 111 --repo "${GITHUB_REPOSITORY}" --body "Gate simplificado: run **${run_id:-não encontrado}**, evento **${event}**, estado **${status}**, conclusão **${conclusion}**, SHA \`${head_sha}\`. Detalhes: \`${detail}\`. ${url}"
