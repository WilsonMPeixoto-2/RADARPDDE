name: Consultar execução do gate remoto

on:
  push:
    branches:
      - hardening/node24-profile-viewport-gate
    paths:
      - '.github/workflows/report-profile-gate-run.yml'

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar execução mais recente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate-remoto-perfis-viewports.yml/runs?branch=hardening/node24-profile-viewport-gate&per_page=5")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"${response}")"
          status="$(jq -r '.workflow_runs[0].status // "ausente"' <<<"${response}")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // "pendente"' <<<"${response}")"
          url="$(jq -r '.workflow_runs[0].html_url // empty' <<<"${response}")"
          event="$(jq -r '.workflow_runs[0].event // "desconhecido"' <<<"${response}")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // "desconhecido"' <<<"${response}")"
          check_suite_id="$(jq -r '.workflow_runs[0].check_suite_id // empty' <<<"${response}")"
          detail='sem check run ou anotação disponível'
          if [[ -n "${check_suite_id}" ]]; then
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/check-suites/${check_suite_id}/check-runs")"
            detail="$(jq -r '[.check_runs[]? | {name, status, conclusion, title: .output.title, summary: .output.summary}] | tostring' <<<"${checks}")"
          fi
          gh pr comment 111 --repo "${GITHUB_REPOSITORY}" --body "Diagnóstico do gate remoto: run **${run_id:-não encontrado}**, evento **${event}**, estado **${status}**, conclusão **${conclusion}**, SHA \`${head_sha}\`. Detalhes: \`${detail}\`. ${url}"
