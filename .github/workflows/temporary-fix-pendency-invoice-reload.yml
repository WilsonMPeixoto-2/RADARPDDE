name: Corrigir round-trip canônico de pendência

on:
  push:
    branches:
      - fix/stabilizacao-avaliacoes-reais-2026-08-22
    paths:
      - .github/workflows/temporary-fix-pendency-invoice-reload.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/stabilizacao-avaliacoes-reais-2026-08-22
          fetch-depth: 0
      - name: Aplicar correção mínima e validar regressão focal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/state-bridge.js')
          source = path.read_text()
          old = """                documentoKey: pendency.document_key,\n                status: pendency.status,"""
          new = """                documentoKey: pendency.document_key,\n                registeredInvoiceId: text(\n                    pendency.registered_invoice_id\n                    || payload.registeredInvoiceId\n                    || payload.registered_invoice_id\n                ) || null,\n                status: pendency.status,"""
          if old not in source:
              if 'registeredInvoiceId: text(' in source:
                  print('Correção já presente; nenhuma substituição necessária.')
              else:
                  raise SystemExit('Trecho alvo não encontrado e correção não está presente.')
          else:
              path.write_text(source.replace(old, new, 1))
          PY
          node --test tests/unit/pendency-invoice-state-bridge.test.js
      - name: Commitar correção e remover workflow temporário
        run: |
          git rm .github/workflows/temporary-fix-pendency-invoice-reload.yml
          if git diff --quiet -- src/data/state-bridge.js; then
            echo "A correção já havia sido aplicada por outro commit."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/state-bridge.js .github/workflows/temporary-fix-pendency-invoice-reload.yml
          git commit -m "fix: restaurar vínculo canônico de NF na pendência"
          git push origin HEAD:fix/stabilizacao-avaliacoes-reais-2026-08-22
