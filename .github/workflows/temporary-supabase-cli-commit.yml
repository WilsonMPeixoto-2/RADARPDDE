name: Temporary Supabase CLI dependency commit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  commit-dependency-files:
    if: github.event.pull_request.head.ref == 'chore/rodada-3b-supabase-cli-2-110-0-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/rodada-3b-supabase-cli-2-110-0-20260802
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate exact dependency files
        run: npm install --save-dev --save-exact supabase@2.110.0

      - name: Verify and restrict changes
        run: |
          test "$(node -p "require('./package.json').devDependencies.supabase")" = "2.110.0"
          test "$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")" = "2.110.0"
          test "$(npx supabase --version)" = "2.110.0"
          git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: atualizar Supabase CLI para 2.110.0"
          git push origin HEAD:chore/rodada-3b-supabase-cli-2-110-0-20260802
