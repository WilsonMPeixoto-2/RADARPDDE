name: Supabase readiness

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'config.js'
      - 'config.runtime.js'
      - '.env.example'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/check-supabase-readiness.js'
      - 'scripts/bootstrap-local-auth-fixtures.mjs'
      - 'scripts/check-local-auth-fixtures.mjs'
      - 'scripts/check-team-account-function.mjs'
      - 'scripts/check-generated-artifacts.js'
      - 'scripts/build-supabase-client.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'scripts/audit-functional-persistence.js'
      - 'scripts/test-operational-correction-concurrency-local.mjs'
      - 'supabase/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'tests/e2e/data-error-ux.spec.js'
      - 'tests/e2e/supabase-full-contract.spec.js'
      - 'tests/e2e/supabase-local-mode.spec.js'
      - 'tests/e2e/supabase-auth-local.spec.js'
      - 'tests/e2e/supabase-late-auth-actions.spec.js'
      - 'tests/e2e/supabase-inventory-terminal-delete.spec.js'
      - 'tests/e2e/supabase-operational-correction-local.spec.js'
      - 'tests/e2e/supabase-t5-history-local.spec.js'
      - 'tests/e2e/supabase-operational-guidance-local.spec.js'
      - 'tests/e2e/supabase-t4-context-deletion-local.spec.js'
      - 'tests/e2e/supabase-t4-item-history-local.spec.js'
      - 'tests/fixtures/t4-item-history-local.sql'
      - 'tests/fixtures/t4-context-deletion-local.sql'
      - 'tests/fixtures/quality-provisional.sql'
      - 'tests/fixtures/operational-correction-local.sql'
      - 'tests/fixtures/t5-history-local.sql'
      - 'tests/fixtures/operational-guidance-local.sql'
      - 'tests/e2e/exercise-management.spec.js'
      - 'tests/e2e/frontend-contract.spec.js'
      - 'docs/architecture/supabase-readiness.md'
      - 'docs/reference/SUPABASE_*.md'
      - 'docs/runbooks/SUPABASE_*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.database-types.json'
      - '.github/workflows/supabase-readiness.yml'
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'config.js'
      - 'config.runtime.js'
      - '.env.example'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/check-supabase-readiness.js'
      - 'scripts/bootstrap-local-auth-fixtures.mjs'
      - 'scripts/check-local-auth-fixtures.mjs'
      - 'scripts/check-team-account-function.mjs'
      - 'scripts/check-generated-artifacts.js'
      - 'scripts/build-supabase-client.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'scripts/audit-functional-persistence.js'
      - 'scripts/test-operational-correction-concurrency-local.mjs'
      - 'supabase/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'tests/e2e/data-error-ux.spec.js'
      - 'tests/e2e/supabase-full-contract.spec.js'
      - 'tests/e2e/supabase-local-mode.spec.js'
      - 'tests/e2e/supabase-auth-local.spec.js'
      - 'tests/e2e/supabase-late-auth-actions.spec.js'
      - 'tests/e2e/supabase-inventory-terminal-delete.spec.js'
      - 'tests/e2e/supabase-operational-correction-local.spec.js'
      - 'tests/e2e/supabase-t5-history-local.spec.js'
      - 'tests/e2e/supabase-operational-guidance-local.spec.js'
      - 'tests/e2e/supabase-t4-context-deletion-local.spec.js'
      - 'tests/e2e/supabase-t4-item-history-local.spec.js'
      - 'tests/fixtures/t4-item-history-local.sql'
      - 'tests/fixtures/t4-context-deletion-local.sql'
      - 'tests/fixtures/quality-provisional.sql'
      - 'tests/fixtures/operational-correction-local.sql'
      - 'tests/fixtures/t5-history-local.sql'
      - 'tests/fixtures/operational-guidance-local.sql'
      - 'tests/e2e/exercise-management.spec.js'
      - 'tests/e2e/frontend-contract.spec.js'
      - 'docs/architecture/supabase-readiness.md'
      - 'docs/reference/SUPABASE_*.md'
      - 'docs/runbooks/SUPABASE_*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.database-types.json'
      - '.github/workflows/supabase-readiness.yml'

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  readiness:
    runs-on: ubuntu-26.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Executar validação completa de prontidão
        id: readiness-validation
        shell: bash
        run: |
          set +e
          npm run test:readiness > readiness-diagnostic.log 2>&1
          status=$?
          cat readiness-diagnostic.log
          exit "${status}"

      - name: Publicar diagnóstico completo do readiness
        if: ${{ failure() && steps.readiness-validation.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-diagnostic-${{ github.run_id }}
          path: readiness-diagnostic.log
          if-no-files-found: error
          retention-days: 1

  migration-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d radar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Aplicar bootstrap e todas as migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            case "$(basename "${migration}")" in
              202607230001_enable_pgtap_remote_validation.sql)
                echo "Ignorando ${migration} no PostgreSQL genérico; a extensão pgTAP é validada no job Supabase local."
                continue
                ;;
              20260920013656_realtime_operational_invalidation.sql)
                echo "Ignorando ${migration} no PostgreSQL genérico; o schema realtime é gerenciado pelo Supabase e validado no job Supabase local."
                continue
                ;;
            esac
            echo "Aplicando ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Exercitar versão, auditoria, contexto e autorização
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql

  supabase-local:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reservar portas do Supabase fora das portas efêmeras do Linux
        shell: bash
        run: |
          set -euo pipefail
          # Mesma proteção dos gates de confiabilidade e uso real, só neste runner.
          current="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          reservation='54320-54323'
          if [[ -n "$current" ]]; then
            reservation="${current},${reservation}"
          fi
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reservation}"
          sysctl -n net.ipv4.ip_local_reserved_ports

      - name: Configurar Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium para o gate Auth local
        run: npx playwright install --with-deps chromium

      - name: Configurar origem local da Edge Function
        shell: bash
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env

      - name: Iniciar Supabase local
        run: npm run supabase:start

      - name: Recriar banco com migrations versionadas e seed local
        run: npm run supabase:reset

      - name: Validar contratos operacionais do preflight remoto
        run: |
          npx supabase db query --local --file supabase/verification/remote-preflight.sql
          npx supabase db query --local --file supabase/verification/remote-post-apply.sql

      - name: Executar testes pgTAP
        run: npm run supabase:test:db

      - name: Medir leitura escolar e equivalência sob RLS em volume histórico
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -qAt -v ON_ERROR_STOP=1 \
            -f supabase/tests/benchmarks/read-school-operational-context.sql > school-read-benchmark.log 2>&1
          node scripts/explain-school-operational-read.mjs > school-read-explain.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -qAt -v ON_ERROR_STOP=1 \
            -f school-read-explain.sql > school-read-explain.log 2>&1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(line) for line in Path('school-read-benchmark.log').read_text().splitlines()
                  if line.startswith('{"role":')]
          assert len(rows) == 1, 'Benchmark precisa produzir exatamente um resultado estruturado'
          report = rows[0]
          assert report['equivalentSchoolCoverages'] == 489
          assert len(report['results']) == 4 and all(r['samples'] == 20 for r in report['results'])
          Path('school-read-benchmark.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n### Leitura escolar: SQL/RLS, sem conexão ao frontend\n\n')
              out.write('489 coberturas escolares equivalentes; 20 amostras por variante. Custos informativos, sem budget de produto presumido.\n\n')
              out.write('| Leitura | p50 ms | p95 ms | p99 ms | JSON sem compressão (bytes) |\n|---|---:|---:|---:|---:|\n')
              for r in report['results']:
                  out.write(f"| {r['school_id'] or 'global'} | {r['p50_ms']} | {r['p95_ms']} | {r['p99_ms']} | {r['payload_max_bytes']} |\n")
          PY

      - name: Preservar métricas e planos da leitura escolar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: school-operational-read-${{ github.run_id }}
          path: |
            school-read-benchmark.json
            school-read-benchmark.log
            school-read-explain.sql
            school-read-explain.log
          if-no-files-found: warn
          retention-days: 30

      - name: Provar primeira despesa em duas sessões com barreira controlada
        run: node scripts/test-first-expense-concurrency.mjs

      - name: Provar concorrência e idempotência da correção operacional (T2/T3)
        run: node scripts/test-operational-correction-concurrency-local.mjs

      - name: Executar lint de PL/pgSQL
        run: npm run supabase:lint:db

      - name: Regenerar tipos e cliente fixado
        shell: bash
        # CLI 2.114.0 respeita este override; ECR público atinge quota em runners compartilhados.
        # Limitar à geração de tipos para não trocar imagens do restante da stack local.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: 'ghcr.io'
        run: |
          set -euo pipefail
          mkdir -p src/types

          gen_types_with_registry_retry() {
            local attempt=1
            local max_attempts=3
            local log_file
            log_file="$(mktemp)"

            while true; do
              : > "${log_file}"
              set +e
              npm run supabase:gen:types 2>&1 | tee "${log_file}"
              local status=${PIPESTATUS[0]}
              set -e

              if [ "${status}" -eq 0 ]; then
                rm -f "${log_file}"
                return 0
              fi

              if ! grep -Eiq 'toomanyrequests|rate exceeded|postgres-meta|error running container: exit 125' "${log_file}"; then
                rm -f "${log_file}"
                return "${status}"
              fi

              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Falha transitória do registry persistiu após ${max_attempts} tentativas." >&2
                rm -f "${log_file}"
                return "${status}"
              fi

              local delay=$((attempt * 15))
              echo "Registry do Supabase indisponível/rate-limited; nova tentativa em ${delay}s (${attempt}/${max_attempts})."
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          gen_types_with_registry_retry
          npm run build:supabase-client
          npm run build:ajv

      - name: Publicar artefatos regenerados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-supabase-artifacts
          path: |
            src/types/database.types.ts
            vendor/supabase-client.js
            vendor/ajv.js
          if-no-files-found: error
          retention-days: 1

      - name: Confirmar artefatos reproduzíveis
        run: |
          npm run check:generated
          npm run typecheck:database

      - name: Preparar identidades Auth e configuração temporária
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_SUPABASE_URL=%s\n' "${API_URL}"
            printf 'RADAR_SUPABASE_PUBLISHABLE_KEY=%s\n' "${ANON_KEY}"
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
            printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175'
          } >> "${GITHUB_ENV}"

      - name: Validar login das sete identidades Auth
        id: auth-probe
        shell: bash
        run: |
          set +e
          npm run check:auth-fixtures > auth-probe.log 2>&1
          status=$?
          cat auth-probe.log
          exit "${status}"

      - name: Publicar diagnóstico seguro do login-probe
        if: ${{ failure() && steps.auth-probe.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-probe-diagnostic
          path: auth-probe.log
          if-no-files-found: error
          retention-days: 1

      - name: Validar autorização da Edge Function de Gestão de Equipe
        run: npm run check:team-account-function

      - name: Exercitar frontend, Auth e RLS na pilha Supabase local
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: npx playwright test tests/e2e/supabase-auth-local.spec.js tests/e2e/supabase-full-contract.spec.js tests/e2e/supabase-realtime-invalidation.spec.js --project=desktop-chromium

      # Cria histórico protegido: executar só após as suítes que substituem a base.
      - name: Exercitar login tardio e ações com histórico protegido
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-late-auth
        run: >-
          npx playwright test tests/e2e/supabase-late-auth-actions.spec.js
          tests/e2e/supabase-inventory-terminal-delete.spec.js
          --project=desktop-chromium --output=test-results-late-auth

      - name: Exercitar correção operacional autenticada (T2–T5) com piloto local
        id: operational-correction-e2e
        shell: bash
        env:
          RADAR_E2E_OPERATIONAL_CORRECTION_LOCAL: '1'
          RADAR_T6_LEGACY_CLIENT_REQUIRED: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-operational-correction
        run: |
          set -euo pipefail
          # R2 publicado: checkout separado e imutável; apenas a configuração local muda.
          legacy_sha='7523782bdc572a631783deeae2ea59be048dd725'
          legacy_root="$(mktemp -d "${RUNNER_TEMP}/radar-t6-r2.XXXXXX")"
          git fetch --no-tags --depth=1 origin "$legacy_sha"
          git worktree add --detach "$legacy_root" "$legacy_sha"
          trap 'git worktree remove --force "$legacy_root"' EXIT
          test "$(git -C "$legacy_root" rev-parse HEAD)" = "$legacy_sha"
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_OPERATIONAL_CORRECTION_PREVIEW=false \
          RADAR_OPERATIONAL_CORRECTION_RELEASE_ENABLED=false \
          RADAR_BONIFICATION_CORRECTION_RELEASE_ENABLED=false \
          RADAR_T4_CONTEXT_DELETION_RELEASE_ENABLED=false \
          RADAR_T4_ITEM_HISTORY_RELEASE_ENABLED=false \
          RADAR_SUPABASE_URL="${RADAR_SUPABASE_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${RADAR_SUPABASE_PUBLISHABLE_KEY}" \
          node "$legacy_root/scripts/generate-runtime-config.mjs"
          export RADAR_T6_LEGACY_CLIENT_ROOT="$legacy_root"
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -1 -v ON_ERROR_STOP=1 -f tests/fixtures/operational-correction-local.sql
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_OPERATIONAL_CORRECTION_PREVIEW=true \
          RADAR_SUPABASE_URL="${RADAR_SUPABASE_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${RADAR_SUPABASE_PUBLISHABLE_KEY}" \
          npm run generate:runtime-config
          npx playwright test \
            tests/e2e/supabase-operational-correction-local.spec.js \
            tests/e2e/supabase-t4-context-deletion-local.spec.js \
            tests/e2e/supabase-t4-item-history-local.spec.js \
            tests/e2e/supabase-t5-history-local.spec.js \
            --project=desktop-chromium --workers=1 --output=test-results-operational-correction

      - name: Exercitar orientação operacional autenticada sem piloto de correção
        # Esta prova de leitura é independente das correções T2–T5. Uma falha
        # nesse grupo não deve esconder o diagnóstico da orientação, mas uma
        # falha anterior de infraestrutura/Auth continua impedindo sua execução.
        if: ${{ !cancelled() && (success() || steps.operational-correction-e2e.outcome == 'failure') }}
        shell: bash
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-operational-guidance
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -1 -v ON_ERROR_STOP=1 -f tests/fixtures/operational-guidance-local.sql
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_OPERATIONAL_CORRECTION_PREVIEW=false \
          RADAR_T5_GRANULAR_HISTORY_RELEASE_ENABLED=false \
          RADAR_SUPABASE_URL="${RADAR_SUPABASE_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${RADAR_SUPABASE_PUBLISHABLE_KEY}" \
          npm run generate:runtime-config
          npx playwright test tests/e2e/supabase-operational-guidance-local.spec.js \
            --project=desktop-chromium --workers=1 --output=test-results-operational-guidance

      - name: Publicar relatório do contrato Supabase local
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-supabase-local
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1

      - name: Publicar relatório de login tardio
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-late-auth
          path: |
            playwright-report-late-auth/
            test-results-late-auth/
          if-no-files-found: warn
          retention-days: 1

      - name: Publicar relatório de correções T2–T5
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-operational-correction
          path: |
            playwright-report-operational-correction/
            test-results-operational-correction/
          if-no-files-found: warn
          retention-days: 1

      - name: Publicar relatório de orientação operacional
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-operational-guidance
          path: |
            playwright-report-operational-guidance/
            test-results-operational-guidance/
          if-no-files-found: warn
          retention-days: 1

      # O arquivo conjunto do run 45566937315 excedeu 512 MiB no download.
      # Manter provas visuais/contextos pequenos, sem remover os relatórios completos.
      - name: Publicar capturas e contextos das jornadas operacionais
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-visual-evidence
          path: |
            test-results-operational-correction/**/*.png
            test-results-operational-correction/**/error-context.md
            test-results-operational-correction/**/*.json
            playwright-report-operational-correction/data/*.png
            test-results-operational-guidance/**/*.png
            test-results-operational-guidance/**/error-context.md
            test-results-operational-guidance/**/*.json
            playwright-report-operational-guidance/data/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Restaurar configuração e remover segredo local
        if: always()
        run: |
          npm run generate:runtime-config
          rm -f supabase/functions/.env

      - name: Encerrar Supabase local
        if: always()
        run: npm run supabase:stop || true
