name: Regenerar lockfile do hotfix

on:
  push:
    branches:
      - fix/excel-sme-build-output-api-20260803
    paths:
      - package.json
      - .github/workflows/regenerate-hotfix-lock.yml

permissions:
  contents: write

concurrency:
  group: regenerate-hotfix-lock
  cancel-in-progress: true

jobs:
  regenerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/excel-sme-build-output-api-20260803

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Corrigir override de brace-expansion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.overrides ||= {};
          delete packageJson.overrides['brace-expansion@5.0.7'];
          delete packageJson.overrides['brace-expansion@5.0.8'];
          packageJson.overrides['brace-expansion@5.0.8'] = '5.0.9';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Regenerar package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validar versão corrigida
        run: |
          node -e "const p=require('./package-lock.json').packages['node_modules/brace-expansion']; if(p.version!=='5.0.9') throw new Error('brace-expansion esperado 5.0.9, recebido '+p.version)"

      - name: Registrar package.json e package-lock.json
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependências já estão atualizadas.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: atualizar brace-expansion para 5.0.9'
          git push origin HEAD:fix/excel-sme-build-output-api-20260803
