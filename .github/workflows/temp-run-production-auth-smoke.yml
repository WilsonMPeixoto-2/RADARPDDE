name: TEMP executar smoke real de Production

on:
  push:
    branches:
      - ops/run-production-auth-smoke-2026-10-07

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app
      RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
      RADAR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
      RADAR_ALLOW_REMOTE_HOMOLOGATION: 'true'

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Criar identidades reais temporárias em Production
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADAR_SUPABASE_URL:-}"
          test -n "${RADAR_SUPABASE_SERVICE_ROLE_KEY:-}"
          PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${PASSWORD}"
          RUN_ID="prod-smoke-${GITHUB_RUN_ID}"
          FIXTURE="${RUNNER_TEMP}/prod-smoke-fixture.json"
          ACCOUNTS="${RUNNER_TEMP}/prod-smoke-accounts.json"
          export RADAR_HML_PASSWORD="${PASSWORD}"
          export RADAR_HML_RUN_ID="${RUN_ID}"
          export RADAR_HML_FIXTURE_FILE="${FIXTURE}"
          node scripts/ops/prepare-remote-homologation-users.mjs
          jq --arg password "${PASSWORD}" '
            {
              accounts: [
                (.users[] | select(.key=="controllerTuane") | {profileId:.profileId,email:.email,password:$password,allowWrite:true}),
                (.users[] | select(.key=="assistant") | {profileId:.profileId,email:.email,password:$password}),
                (.users[] | select(.key=="inventory") | {profileId:.profileId,email:.email,password:$password}),
                (.users[] | select(.key=="sme") | {profileId:.profileId,email:.email,password:$password}),
                (.users[] | select(.key=="technicalAdmin") | {profileId:.profileId,email:.email,password:$password})
              ]
            }
          ' "${FIXTURE}" > "${ACCOUNTS}"
          chmod 600 "${FIXTURE}" "${ACCOUNTS}"
          printf 'fixture=%s\naccounts=%s\n' "${FIXTURE}" "${ACCOUNTS}" >> "${GITHUB_OUTPUT}"

      - name: Executar leitura real e CRUD reversível
        env:
          RADAR_E2E_PRODUCTION_AUTHENTICATED_READ: '1'
          RADAR_PRODUCTION_WRITE_SMOKE_ENABLED: '1'
          RADAR_PRODUCTION_WRITE_SMOKE_REQUIRED: '1'
          RADAR_PRODUCTION_READ_ACCOUNTS_FILE: ${{ steps.identities.outputs.accounts }}
        run: npx playwright test --config=playwright.production-authenticated-read.config.js

      - name: Limpar identidades temporárias de Production
        if: always()
        shell: bash
        env:
          RADAR_HML_FIXTURE_FILE: ${{ steps.identities.outputs.fixture }}
        run: |
          set -euo pipefail
          if [ -n "${RADAR_HML_FIXTURE_FILE:-}" ] && [ -f "${RADAR_HML_FIXTURE_FILE}" ]; then
            node scripts/ops/cleanup-remote-homologation-users.mjs
            rm -f -- "${RADAR_HML_FIXTURE_FILE}"
          fi
          ACCOUNTS="${{ steps.identities.outputs.accounts }}"
          if [ -n "${ACCOUNTS:-}" ]; then rm -f -- "${ACCOUNTS}"; fi
