name: TEMP executar smoke real de Production

on:
  push:
    branches:
      - ops/run-production-auth-smoke-2026-10-07

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Preparar contas autorizadas
        id: credentials
        shell: bash
        env:
          ACCOUNTS_JSON: ${{ secrets.RADAR_PRODUCTION_AUTH_ACCOUNTS_JSON || secrets.RADAR_PRODUCTION_READ_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${ACCOUNTS_JSON:-}" ]; then
            echo 'NO_AUTH_ACCOUNTS_SECRET' >&2
            exit 2
          fi
          RAW="${RUNNER_TEMP}/accounts-raw.json"
          OUT="${RUNNER_TEMP}/accounts.json"
          printf '%s' "${ACCOUNTS_JSON}" > "${RAW}"
          jq '
            .accounts as $a
            | ($a | map(.profileId == "controller" or .profileId == "federal_assistant") | index(true)) as $writer
            | if $writer == null then error("NO_ELIGIBLE_WRITER") else
                .accounts = [
                  range(0; ($a|length)) as $i
                  | ($a[$i] + {allowWrite: ($i == $writer)})
                ]
              end
          ' "${RAW}" > "${OUT}"
          rm -f "${RAW}"
          chmod 600 "${OUT}"
          printf 'accounts_file=%s\n' "${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Executar leitura real e CRUD reversível
        env:
          RADAR_E2E_PRODUCTION_AUTHENTICATED_READ: '1'
          RADAR_PRODUCTION_WRITE_SMOKE_ENABLED: '1'
          RADAR_PRODUCTION_WRITE_SMOKE_REQUIRED: '1'
          RADAR_PRODUCTION_READ_ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: npx playwright test --config=playwright.production-authenticated-read.config.js

      - name: Remover credenciais temporárias
        if: always()
        env:
          ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: |
          if [ -n "${ACCOUNTS_FILE:-}" ]; then rm -f -- "${ACCOUNTS_FILE}"; fi
