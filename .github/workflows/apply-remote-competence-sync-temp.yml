name: Aplicar sincronização de competências restauradas

on:
  push:
    branches:
      - fix/sync-remote-competences-20260806
    paths:
      - .github/workflows/apply-remote-competence-sync-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sync-remote-competences-20260806

      - name: Aplicar correção mínima e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          old_start = """function applyRadarMemoryState(state = {}) {
              config = cloneRadarValue(state.config || INITIAL_CONFIG);
              programas = cloneRadarValue(state.programs || []);
          """
          new_start = """function applyRadarMemoryState(state = {}) {
              config = cloneRadarValue(state.config || INITIAL_CONFIG);
              const restoredCompetences = Array.isArray(config.competencias)
                  ? cloneRadarValue(config.competencias).filter(item => (
                      item && /^\\d{4}-(0[1-9]|1[0-2])$/.test(String(item.key || ''))
                  ))
                  : [];
              if (restoredCompetences.length > 0) {
                  COMPETENCIAS.splice(0, COMPETENCIAS.length, ...restoredCompetences);
              }
              programas = cloneRadarValue(state.programs || []);
          """
          if source.count(old_start) != 1:
              raise SystemExit('Início de applyRadarMemoryState não localizado de forma única.')
          source = source.replace(old_start, new_start, 1)

          old_end = """    activeCompetenciaKey = config.competenciaFechamento || activeCompetenciaKey;
          }
          """
          new_end = """    activeCompetenciaKey = config.competenciaFechamento || activeCompetenciaKey;
              const restoredExercise = /^\\d{4}/.exec(String(activeCompetenciaKey || ''))?.[0] || '';
              const configuredExercises = Array.isArray(config.exercicios)
                  ? config.exercicios.map(String)
                  : [];
              if (restoredExercise && configuredExercises.includes(restoredExercise)) {
                  currentExercise = restoredExercise;
              }
          }
          """
          if source.count(old_end) != 1:
              raise SystemExit('Fim de applyRadarMemoryState não localizado de forma única.')
          source = source.replace(old_end, new_end, 1)

          old_render = """    container.innerHTML = `
                  <div class=\"page-header\">"""
          new_render = """    const activeCompetenceLabel = COMPETENCIAS.find(
                  competence => competence.key === activeCompetenciaKey
              )?.label || formatCompetenciaText(activeCompetenciaKey);

              container.innerHTML = `
                  <div class=\"page-header\">"""
          if source.count(old_render) < 1:
              raise SystemExit('Ponto de render do Controlador não localizado.')
          # O primeiro container.innerHTML após o bloco de filtros é o painel do Controlador neste trecho.
          marker = """    // Aplicar sub-filtro na lista de escolas a renderizar"""
          marker_index = source.find(marker)
          if marker_index < 0:
              raise SystemExit('Marcador do painel do Controlador ausente.')
          render_index = source.find(old_render, marker_index)
          if render_index < 0:
              raise SystemExit('Render do painel do Controlador ausente após o marcador.')
          source = source[:render_index] + source[render_index:].replace(old_render, new_render, 1)

          old_badge = """<div class=\"badge badge-info\">Mês Ativo: ${COMPETENCIAS.find(c => c.key === activeCompetenciaKey).label}</div>"""
          new_badge = """<div class=\"badge badge-info\">Mês Ativo: ${activeCompetenceLabel}</div>"""
          if source.count(old_badge) != 1:
              raise SystemExit('Badge inseguro não localizado de forma única.')
          source = source.replace(old_badge, new_badge, 1)

          path.write_text(source, encoding='utf-8')
          PY

          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-remote-competence-sync-temp.yml
          git add app.js
          git commit -m "fix: sincronizar competências restauradas antes do render"
          git push origin HEAD:fix/sync-remote-competences-20260806
