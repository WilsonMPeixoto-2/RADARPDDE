name: Estabilidade de posição do Prontuário

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'src/integration/prontuario-scroll-preservation.js'
      - 'src/integration/prontuario-conditional-reconciler.js'
      - 'src/integration/evaluation-retification-ui.js'
      - 'src/integration/task-12-13-retificacoes.js'
      - 'src/integration/operational-context-refresh.js'
      - 'src/integration/product-extensions-bootstrap.js'
      - 'tests/unit/prontuario-scroll-preservation.test.js'
      - 'tests/unit/operational-context-refresh.test.js'
      - 'tests/unit/product-extensions-loader-resilience.test.js'
      - 'tests/unit/prontuario-conditional-reconciler.test.js'
      - 'tests/unit/prontuario-inline-write-contract.test.js'
      - 'tests/unit/evaluation-retification.test.js'
      - 'tests/unit/evaluation-retification-atomic.test.js'
      - 'tests/e2e/prontuario-scroll-preservation.spec.js'
      - 'tests/e2e/invoice-document-analysis.spec.js'
      - 'tests/e2e/evaluation-retification-ui.spec.js'
      - 'tests/e2e/task-12-13-retificacoes.spec.js'
      - 'tests/e2e/monthly-evaluation-journey.spec.js'
      - 'tests/e2e/pendency-cycle.spec.js'
      - 'tests/e2e/supabase-evaluation-retification.spec.js'
      - 'package.json'
      - '.github/workflows/prontuario-position-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prontuario-position-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contratos de posição e composição
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar sintaxe da superfície alterada
        run: |
          node --check app.js
          node --check src/integration/prontuario-scroll-preservation.js
          node --check src/integration/prontuario-conditional-reconciler.js
          node --check src/integration/evaluation-retification-ui.js
          node --check src/integration/task-12-13-retificacoes.js
          node --check src/integration/operational-context-refresh.js
          node --check src/integration/product-extensions-bootstrap.js

      - name: Provar posição estável sem perder contratos funcionais
        run: npm run test:prontuario-position-stability

  browser:
    name: Jornadas reais sem salto de tela
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium

      - name: Executar somente jornadas pertinentes
        run: >-
          npx playwright test
          tests/e2e/prontuario-scroll-preservation.spec.js
          tests/e2e/invoice-document-analysis.spec.js
          tests/e2e/evaluation-retification-ui.spec.js
          tests/e2e/task-12-13-retificacoes.spec.js
          tests/e2e/monthly-evaluation-journey.spec.js
          --project=desktop-chromium
          --workers=1
          --max-failures=1

      - name: Provar novo envio e reanálise sem reposicionamento
        run: >-
          npx playwright test
          tests/e2e/pendency-cycle.spec.js
          --project=desktop-chromium
          --workers=1
          --max-failures=1
          --grep "preserva aba Pendências, competência de origem e foco após novo envio|reanálise iniciada na aba Pendências preserva contexto e foco após resolução"

      - name: Publicar evidências se houver falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prontuario-position-stability-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
