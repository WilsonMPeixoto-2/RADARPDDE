name: Fechar documentação pós-PR260

on:
  push:
    branches:
      - docs/close-pr260-production-20260904
    paths:
      - '.github/workflows/sync-pr260-production-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/close-pr260-production-20260904

      - name: Atualizar fechamento canônico
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          certified_head = 'c3d6fc2374476a4884cfebc2f4236e346ccf2700'
          merge_sha = '8fc58926565a72465980143f253f0a2fee4b8fc2'
          deployment = 'dpl_EmgxYkMpprpY2wLTRFk4bJQA4L2e'

          stage_path = Path('docs/CURRENT_STAGE.md')
          stage = stage_path.read_text(encoding='utf-8')
          stage = re.sub(
              r'^\*\*Situação:\*\*.*$',
              f'**Situação:** estabilização funcional concluída. PR #260 integrado em `{merge_sha}`, Supabase Production com 46 migrations e Vercel Production `{deployment}` READY no mesmo merge. As regras e provas posteriores aos hotfixes prevalecem sobre planos históricos.',
              stage,
              count=1,
              flags=re.M
          )
          marker = '## Fechamento em Production — 04/09'
          if marker not in stage:
              insert_after = '## Atualização de 04/09 — estabilização funcional e prova ponta a ponta'
              idx = stage.find(insert_after)
              if idx < 0:
                  raise SystemExit('Seção de 04/09 não localizada em CURRENT_STAGE.md')
              end = stage.find('\n## ', idx + len(insert_after))
              if end < 0:
                  end = len(stage)
              closure = f'''\n\n{marker}\n\n- head certificado antes do merge: `{certified_head}`;\n- todos os gates finais do PR #260 passaram no mesmo head, incluindo jornadas reais com Supabase, Playwright completo, readiness, perfis/viewports, backup/restauração, CodeQL, dependências, Lighthouse e homologação pré-Production;\n- merge da `main`: `{merge_sha}`;\n- Supabase Production: 46 migrations, RPC patrimonial e trigger de limpeza presentes, aliases `rowVersion`/`row_version` em payload = 0 e `production_integrity_check()` com `totalIssues = 0`;\n- Vercel Production: `{deployment}` READY, alias oficial servindo manifesto com SHA `{merge_sha}`;\n- código servido em Production contém a sincronização patrimonial e a proteção contra repetição de ações críticas.\n\nA estabilização passa a compor a baseline corrente. Novas revisões devem partir deste estado e não reabrir planos históricos como fila automática.\n'''
              stage = stage[:end] + closure + stage[end:]
          stage_path.write_text(stage, encoding='utf-8')

          handoff_path = Path('docs/handoff/2026-09-04-estabilizacao-funcional-pr260.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          old = 'Enquanto o PR #260 não estiver integrado, Production continua obedecendo à baseline anterior. Após a integração e a verificação do deployment, as regras funcionais e regressões descritas aqui passam a compor a baseline corrente.'
          new = f'O PR #260 foi integrado após o head certificado `{certified_head}` passar todos os gates finais. A `main` resultante é `{merge_sha}`. Supabase Production está com 46 migrations, integridade saudável e sem aliases técnicos residuais; Vercel Production `{deployment}` está READY e o alias oficial serve o manifesto desse mesmo merge. As regras funcionais e regressões descritas neste checkpoint compõem a baseline corrente.'
          if old in handoff:
              handoff = handoff.replace(old, new, 1)
          elif new not in handoff:
              raise SystemExit('Parágrafo final esperado não localizado no handoff')
          handoff_path.write_text(handoff, encoding='utf-8')

          manifest_path = Path('docs/reference/functional-contract-matrix.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['updatedAt'] = '2026-09-04'
          manifest['sourceCommit'] = certified_head
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerar matriz funcional
        run: node scripts/check-functional-contract-matrix.mjs --write

      - name: Validar documentação
        run: |
          node scripts/check-functional-contract-matrix.mjs
          git diff --check -- . ':(exclude)docs/reference/FUNCTIONAL_CONTRACT_MATRIX.md'

      - name: Remover auxiliar e publicar fechamento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-pr260-production-docs.yml
          git add docs/CURRENT_STAGE.md docs/handoff/2026-09-04-estabilizacao-funcional-pr260.md docs/reference/functional-contract-matrix.json docs/reference/FUNCTIONAL_CONTRACT_MATRIX.md
          git commit -m 'docs: fechar estabilização funcional em Production'
          git push origin HEAD:docs/close-pr260-production-20260904
