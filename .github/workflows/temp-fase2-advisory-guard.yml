name: Aplicar proteção final Fase 2

on:
  push:
    branches:
      - fix/controller-expense-type-retification-2026-10-01
    paths:
      - '.github/workflows/temp-fase2-advisory-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/controller-expense-type-retification-2026-10-01
          fetch-depth: 0
      - name: Aplicar proteção e provar contrato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('src/application/invoice-service.js')
          text = service.read_text()
          anchor = "        if (history.some(pendency => text(pendency.documentoKey || pendency.document_key) === 'consAssessoria')) {"
          replacement = """        const advisorySent = invoice.consultaAssessoriaEnviada === true;
                  const advisoryAnalysis = text(invoice.analiseConsultaAssessoria);
                  const hasRecordedAdvisory = advisorySent
                      || (advisoryAnalysis && advisoryAnalysis !== 'Não analisado');
                  if (hasRecordedAdvisory) {
                      message = 'A classificação fica preservada porque este lançamento já possui registro individual de Consulta à Assessoria.';
                  } else if (history.some(pendency => text(pendency.documentoKey || pendency.document_key) === 'consAssessoria')) {"""
          replacement = '\n'.join(line[8:] if line.startswith('        ') else line for line in replacement.splitlines())
          replacement = '\n'.join(('        ' + line) if line else line for line in replacement.splitlines())
          if text.count(anchor) != 1:
              raise SystemExit(f'Âncora de Assessoria localizada {text.count(anchor)} vezes; esperado 1')
          service.write_text(text.replace(anchor, replacement, 1))
          PY
          git diff --check
          node --test tests/unit/invoice-type-retification-advisory-state.test.js
      - name: Registrar somente a correção de domínio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add src/application/invoice-service.js
          git commit -m 'fix: preservar histórico real de Assessoria na retificação'
          git push origin HEAD:fix/controller-expense-type-retification-2026-10-01
