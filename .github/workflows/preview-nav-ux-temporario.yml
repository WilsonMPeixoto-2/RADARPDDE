name: Preview isolado — NAV-01 e UX-04

on:
  push:
    branches:
      - fix/pendency-context-mobile-preview-2026-09-25

permissions:
  contents: read

concurrency:
  group: radar-pdde-preview-nav-ux-2026-09-25
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview-isolado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar contexto e segredos da Vercel
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/pendency-context-mobile-preview-2026-09-25"
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"

      - name: Registrar estado de Production antes do Preview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://radarpdde-fix.vercel.app/radar-build-manifest.json"             -o /tmp/radar-production-before.json

      - name: Vincular projeto sem publicar
        run: npx --yes vercel@56.2.0 pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Construir artefato isolado de Preview
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          RADAR_DATA_MODE: local
          RADAR_ENVIRONMENT: preview
          RADAR_SUPABASE_REPOSITORY_ENABLED: 'false'
          RADAR_SUPABASE_URL: ''
          RADAR_SUPABASE_PUBLISHABLE_KEY: ''
          RADAR_SUPABASE_PRODUCTION_ACTIVATION_APPROVED: 'false'
        run: npx --yes vercel@56.2.0 build --token="${VERCEL_TOKEN}"

      - name: Validar manifesto isolado antes da publicação
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/radar-build-manifest.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('dist/radar-build-manifest.json', 'utf8'));
          const expected = {
            vercelEnvironment: 'preview',
            runtimeEnvironment: 'preview',
            dataMode: 'local',
            supabaseRepositoryEnabled: false,
            productionActivationApproved: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) {
              throw new Error(`Manifesto isolado inválido em ${key}: ${manifest[key]}`);
            }
          }
          NODE

      - name: Publicar somente Preview prebuilt
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 deploy --prebuilt --token="${VERCEL_TOKEN}" 2>&1 | tee /tmp/vercel-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-preview.log | tail -n 1)"
          test -n "${PREVIEW_URL}"
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${PREVIEW_URL}" > preview-url.txt

      - name: Validar Preview publicado
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PREVIEW_URL}/radar-build-manifest.json"             -o /tmp/radar-preview.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/radar-preview.json', 'utf8'));
          const expected = {
            runtimeEnvironment: 'preview',
            dataMode: 'local',
            supabaseRepositoryEnabled: false,
            productionActivationApproved: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) {
              throw new Error(`Preview publicado inválido em ${key}: ${manifest[key]}`);
            }
          }
          NODE

      - name: Confirmar Production inalterada
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://radarpdde-fix.vercel.app/radar-build-manifest.json"             -o /tmp/radar-production-after.json
          cmp /tmp/radar-production-before.json /tmp/radar-production-after.json

      - name: Preservar URL do Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-nav-ux-url-${{ github.run_id }}
          path: preview-url.txt
          if-no-files-found: error
          retention-days: 7
