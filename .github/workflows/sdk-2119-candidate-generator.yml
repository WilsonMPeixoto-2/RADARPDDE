name: SDK 2.119 candidate generator (temporary)

on:
  push:
    branches: [chore/supabase-js-2-119-0-20261105]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[sdk-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and SDK 2.119.0
        run: |
          set -euo pipefail
          npm ci
          npm install --save-dev --save-exact @supabase/supabase-js@2.119.0 --no-audit --no-fund
          npm run build:supabase-client

      - name: Align the browser, Edge Function, contracts and tracker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const replacements = [
            ['supabase/functions/team-account-management/index.ts', 'npm:@supabase/supabase-js@2.118.0', 'npm:@supabase/supabase-js@2.119.0'],
            ['tests/unit/tooling-contract.test.js', "assert.equal(packageJson.devDependencies['@supabase/supabase-js'], '2.118.0');", "assert.equal(packageJson.devDependencies['@supabase/supabase-js'], '2.119.0');"],
            ['docs/TECHNOLOGY_CAPABILITIES_TRACKER.md', '`@supabase/supabase-js@2.118.0`', '`@supabase/supabase-js@2.119.0`']
          ];
          for (const [name, oldText, newText] of replacements) {
            const before = fs.readFileSync(name, 'utf8');
            if (!before.includes(oldText)) throw new Error('Source anchor missing in ' + name);
            fs.writeFileSync(name, before.replace(oldText, newText));
          }
          const name = 'tests/unit/supabase-modernization.test.js';
          const before = fs.readFileSync(name, 'utf8');
          if ((before.match(/118/g) || []).length !== 4) throw new Error('Expected four exact Supabase SDK version references');
          fs.writeFileSync(name, before.replaceAll('118', '119'));
          NODE

      - name: Verify generated output and focused contracts
        run: |
          set -euo pipefail
          # O check CI=true compara com HEAD; nesta etapa o bundle ainda será commitado.
          CI=false npm run check:generated
          npm run check:search-ui-vendors
          npm run typecheck:database
          node --test tests/unit/supabase-modernization.test.js tests/unit/tooling-contract.test.js
          git diff --check

      - name: Commit reproducible candidate onto the PR branch
        env:
          SDK_CANDIDATE_BRANCH: chore/supabase-js-2-119-0-20261105
        run: |
          set -euo pipefail
          git add package.json package-lock.json vendor/supabase-client.js \
            supabase/functions/team-account-management/index.ts \
            tests/unit/supabase-modernization.test.js \
            tests/unit/tooling-contract.test.js \
            docs/TECHNOLOGY_CAPABILITIES_TRACKER.md
          git diff --cached --stat
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(deps): [sdk-generated] pin Supabase JS 2.119.0 and rebuild contracts'
          git push origin "HEAD:refs/heads/${SDK_CANDIDATE_BRANCH}"
