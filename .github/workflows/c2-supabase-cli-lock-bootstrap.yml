name: C2 Supabase CLI lock bootstrap

on:
  push:
    branches:
      - tmp/phase-c2-lock-2-118-0-2026-09-27

permissions:
  contents: read

jobs:
  lock:
    name: Gerar lock Supabase CLI 2.118.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Gerar lock reproduzível
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev supabase@2.118.0
          node -e "const p=require('./package-lock.json'); if(p.packages[''].devDependencies.supabase!=='2.118.0') process.exit(1)"
          npm ci --ignore-scripts
          node -e "const p=require('./node_modules/supabase/package.json'); if(p.version!=='2.118.0') process.exit(1); console.log('supabase='+p.version)"

      - name: Publicar lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c2-supabase-cli-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
