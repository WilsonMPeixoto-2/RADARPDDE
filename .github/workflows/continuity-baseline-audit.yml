name: Auditoria de continuidade — inventário integral

on:
  push:
    branches:
      - audit/continuity-source-traceability-2026-09-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventariar documentação, código e validação
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter repositório completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Executar inventário mecânico integral
        run: node scripts/audit-continuity-baseline.mjs

      - name: Congelar snapshot integral dos arquivos versionados
        run: git archive --format=tar.gz --output=audit-output/repository-snapshot.tar.gz HEAD

      - name: Publicar relatório completo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuity-baseline-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
