name: Continuidade documental e rastreabilidade

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - audit/continuity-source-traceability-2026-09-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    name: Validar porta de entrada, plano e impacto do PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter repositório completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Validar continuidade documental
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            node scripts/check-continuity-docs.mjs --pr-impact "${PR_BASE_SHA}"
          else
            node scripts/check-continuity-docs.mjs
          fi

      - name: Executar regressão específica da continuidade
        run: node --test tests/unit/continuity-docs.test.js

  inventory:
    name: Inventário integral sob demanda
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter repositório completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Executar inventário mecânico integral
        run: node scripts/audit-continuity-baseline.mjs

      - name: Congelar snapshot integral dos arquivos versionados
        run: git archive --format=tar.gz --output=audit-output/repository-snapshot.tar.gz HEAD

      - name: Publicar relatório completo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuity-baseline-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
