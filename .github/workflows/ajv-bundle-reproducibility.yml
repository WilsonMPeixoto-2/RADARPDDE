name: Reprodutibilidade do bundle Ajv

on:
  pull_request:
    paths:
      - '.github/workflows/ajv-bundle-reproducibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/vendor/ajv-entry.js'
      - 'scripts/build-ajv.mjs'
      - 'vendor/ajv.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout do branch do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Gerar duas vezes e comparar
        shell: bash
        run: |
          set -euo pipefail
          sha256sum vendor/ajv.js | tee /tmp/versioned.sha256
          npm run build:ajv
          cp vendor/ajv.js /tmp/ajv-first.js
          sha256sum /tmp/ajv-first.js | tee /tmp/first.sha256
          npm run build:ajv
          cp vendor/ajv.js /tmp/ajv-second.js
          sha256sum /tmp/ajv-second.js | tee /tmp/second.sha256
          cmp --silent /tmp/ajv-first.js /tmp/ajv-second.js
          node -e "const fs=require('fs'); const source=fs.readFileSync('/tmp/ajv-second.js','utf8'); if(!source.includes('Ajv 8.20.0') || !source.includes('RadarAjv')) process.exit(1);"
          {
            echo '### Bundle Ajv'
            echo '- O bundle foi gerado duas vezes com `npm ci` e produziu bytes idênticos.'
            echo '- Versão: Ajv 8.20.0.'
            echo '- Empacotador: esbuild 0.28.1.'
            echo '- Hash versionado anterior:'
            echo '```'
            cat /tmp/versioned.sha256
            echo '```'
            echo '- Hash reproduzido:'
            echo '```'
            cat /tmp/second.sha256
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Versionar saída reproduzida no branch do PR
        shell: bash
        run: |
          set -euo pipefail
          git add vendor/ajv.js
          if git diff --cached --quiet; then
            echo 'vendor/ajv.js já corresponde ao gerador e ao lockfile atuais.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: atualizar bundle Ajv reproduzível'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Publicar bundle reproduzido
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ajv-8.20.0-esbuild-0.28.1-${{ github.run_id }}
          path: /tmp/ajv-second.js
          if-no-files-found: error
          retention-days: 3
