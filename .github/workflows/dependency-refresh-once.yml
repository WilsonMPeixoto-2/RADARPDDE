name: Atualização única de dependências

on:
  push:
    branches:
      - maintenance/dependency-refresh-adversarial-2026-09-05

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Normalizar baseline
        run: npm ci

      - name: Atualizar Knip para 6.34.0
        run: npm install --save-dev --save-exact knip@6.34.0

      - name: Registrar dependências obsoletas e cadeia
        shell: bash
        run: |
          mkdir -p dependency-health
          {
            echo '# npm ls de transitivos depreciados'
            npm ls inflight lodash.isequal rimraf glob whatwg-encoding fstream uuid || true
          } > dependency-health/deprecated-chain-2026-09-05.txt 2>&1
          npm outdated --json > dependency-health/npm-outdated-2026-09-05.json 2>&1 || true
          npm audit --json > dependency-health/npm-audit-2026-09-05.json 2>&1 || true

      - name: Verificar lockfile e checks focais
        run: |
          npm ci
          npm run check
          npm run test:unit

      - name: Persistir atualização e evidências
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dependency-refresh-once.yml
          git add package.json package-lock.json dependency-health/deprecated-chain-2026-09-05.txt dependency-health/npm-outdated-2026-09-05.json dependency-health/npm-audit-2026-09-05.json
          git commit -m 'chore(deps): atualizar knip e mapear transitivos depreciados'
          git push origin HEAD:maintenance/dependency-refresh-adversarial-2026-09-05
