name: TEMP F06 invoice focus diagnostic
on:
  push:
    branches:
      - fix/f06-nf-modal-keyboard-clearance-20261023

permissions:
  contents: read

concurrency:
  group: temp-f06-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f06-focus:
    name: NF desktop focus and reflow
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Only real invoice F06 tests
        run: npx playwright test tests/e2e/invoice-focus-clearance.spec.js --project=desktop-chromium
      - name: Preserve traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temporary-f06-focused-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
