name: PR1 GREEN apply

on:
  push:
    branches:
      - fix/pr1-invoice-submit-guard
    paths:
      - '.github/workflows/pr1-green-apply.yml'

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch do PR1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pr1-invoice-submit-guard
          fetch-depth: 0

      - name: Aplicar patch mínimo do PR1
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 match, encontrado {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          marker = 'async function salvarDadosNota(e) {'
          if text.count(marker) != 1:
              raise SystemExit(f'app.js: marcador salvarDadosNota inesperado ({text.count(marker)})')
          if 'const invoiceSubmissionLocks = new WeakSet();' in text:
              raise SystemExit('app.js: guard já parece instalado')
          text = text.replace(
              marker,
              "const invoiceSubmissionLocks = new WeakSet();\n"
              "const invoiceSubmissionUiState = new WeakMap();\n\n"
              + marker,
              1
          )
          app.write_text(text, encoding='utf-8')

          old_opening = '''async function salvarDadosNota(e) {
              e.preventDefault();
              const accessProfile = getRadarAccessProfile();
              if (!radarCan(accessProfile, 'accountability.edit')) {
                  alert('Seu perfil não tem autorização para cadastrar ou editar notas fiscais.');
                  return false;
              }

              const id = document.getElementById('nota-id').value;
              const escolaId = document.getElementById('nota-escola-id').value;
              const compKey = document.getElementById('nota-comp-key').value;
              const desc = document.getElementById('nota-desc').value;
              const tipo = document.getElementById('nota-tipo').value;
              const numero = document.getElementById('nota-numero').value;
              const valor = parseFloat(document.getElementById('nota-valor').value);
              
              try {'''

          new_opening = '''async function salvarDadosNota(e) {
              e.preventDefault();
              const form = e?.currentTarget || document.getElementById('form-dados-nota');
              if (form && invoiceSubmissionLocks.has(form)) return false;

              const accessProfile = getRadarAccessProfile();
              if (!radarCan(accessProfile, 'accountability.edit')) {
                  alert('Seu perfil não tem autorização para cadastrar ou editar notas fiscais.');
                  return false;
              }

              const id = document.getElementById('nota-id').value;
              const escolaId = document.getElementById('nota-escola-id').value;
              const compKey = document.getElementById('nota-comp-key').value;
              const desc = document.getElementById('nota-desc').value;
              const tipo = document.getElementById('nota-tipo').value;
              const numero = document.getElementById('nota-numero').value;
              const valor = parseFloat(document.getElementById('nota-valor').value);

              const submitButton = form?.querySelector?.('button[type="submit"]')
                  || document.querySelector?.('#form-dados-nota button[type="submit"]')
                  || null;
              const formDismissButtons = Array.from(
                  form?.querySelectorAll?.('.btn-secondary, .btn-close, button[type="button"]') || []
              );
              const modal = form?.closest?.('.modal-overlay') || document.getElementById('modal-dados-nota');
              const modalDismissButtons = Array.from(
                  modal?.querySelectorAll?.('.btn-secondary, .btn-close, button[type="button"]') || []
              );
              const dismissButtons = [...new Set([...formDismissButtons, ...modalDismissButtons])]
                  .filter(button => button && button !== submitButton);

              if (form) {
                  invoiceSubmissionLocks.add(form);
                  invoiceSubmissionUiState.set(form, {
                      submitButton,
                      submitDisabled: Boolean(submitButton?.disabled),
                      submitLabel: submitButton?.textContent || '',
                      dismissButtons: dismissButtons.map(button => ({
                          button,
                          disabled: Boolean(button.disabled)
                      }))
                  });
                  form.setAttribute?.('aria-busy', 'true');
                  if (submitButton) {
                      submitButton.disabled = true;
                      submitButton.textContent = 'Salvando…';
                  }
                  dismissButtons.forEach(button => {
                      button.disabled = true;
                  });
              }
              
              try {'''

          replace_once('app.js', old_opening, new_opening)

          old_closing = '''    } catch (error) {
                  reportRadarActionError(error, 'salvar dados da nota fiscal');
              }
          }'''

          new_closing = '''    } catch (error) {
                  reportRadarActionError(error, 'salvar dados da nota fiscal');
              } finally {
                  if (form) {
                      const uiState = invoiceSubmissionUiState.get(form);
                      form.setAttribute?.('aria-busy', 'false');
                      if (uiState?.submitButton) {
                          uiState.submitButton.disabled = uiState.submitDisabled;
                          uiState.submitButton.textContent = uiState.submitLabel;
                      }
                      (uiState?.dismissButtons || []).forEach(({ button, disabled }) => {
                          button.disabled = disabled;
                      });
                      invoiceSubmissionUiState.delete(form);
                      invoiceSubmissionLocks.delete(form);
                  }
              }
              return false;
          }'''

          replace_once('app.js', old_closing, new_closing)

          replace_once(
              'src/application/invoice-service.js',
              "                name: 'invoice:save',\n                changedEntities: [",
              "                name: 'invoice:save',\n                remoteRefreshExemptEntities: ['administrativeLogs'],\n                changedEntities: ["
          )
          replace_once(
              'src/application/invoice-service.js',
              "                name: 'invoice:remove',\n                changedEntities: [",
              "                name: 'invoice:remove',\n                remoteRefreshExemptEntities: ['administrativeLogs'],\n                changedEntities: ["
          )

          replace_once(
              'src/integration/operational-write-performance.js',
              "    const REFRESH_EXEMPT_ENTITIES_BY_COMMAND = Object.freeze({\n        'invoice:save': Object.freeze(['administrativeLogs']),\n        'invoice:remove': Object.freeze(['administrativeLogs']),\n        'configuration:create-exercise': Object.freeze(['administrativeLogs'])\n    });",
              "    const REFRESH_EXEMPT_ENTITIES_BY_COMMAND = Object.freeze({\n        'configuration:create-exercise': Object.freeze(['administrativeLogs'])\n    });"
          )

          Path('tests/unit/operational-write-refresh-policy.test.js').write_text("""'use strict';

          const test = require('node:test');
          const assert = require('node:assert/strict');

          const policy = require('../../src/integration/operational-write-performance.js');

          const persist = async () => ({});

          test('extensão mantém somente a isenção de refresh que ainda lhe pertence', () => {
              const decorated = policy.decorateCommand({
                  name: 'configuration:create-exercise',
                  changedEntities: ['administrativeLogs'],
                  persist
              });
              assert.deepEqual(decorated.remoteRefreshExemptEntities, ['administrativeLogs']);
              assert.equal(decorated.remoteResultIsAuthoritative, undefined);
              assert.equal(decorated.remoteCommitIsAuthoritative, undefined);
          });

          test('extensão não sintetiza política de invoice e preserva declaração explícita do núcleo', () => {
              const implicit = policy.decorateCommand({
                  name: 'invoice:save',
                  changedEntities: ['registeredInvoices', 'administrativeLogs'],
                  persist
              });
              assert.equal(implicit.remoteRefreshExemptEntities, undefined);

              const explicit = policy.decorateCommand({
                  name: 'invoice:save',
                  changedEntities: ['registeredInvoices', 'administrativeLogs'],
                  remoteRefreshExemptEntities: ['administrativeLogs'],
                  persist
              });
              assert.deepEqual(explicit.remoteRefreshExemptEntities, ['administrativeLogs']);
          });

          test('isenção de refresh aceita somente o histórico administrativo append-only', () => {
              const decorated = policy.decorateCommand({
                  name: 'invoice:save',
                  changedEntities: ['registeredInvoices', 'administrativeLogs'],
                  remoteRefreshExemptEntities: ['registeredInvoices', 'administrativeLogs'],
                  persist
              });
              assert.deepEqual(decorated.remoteRefreshExemptEntities, ['administrativeLogs']);

              const genericUnsafe = policy.decorateCommand({
                  name: 'audit:record',
                  changedEntities: ['registeredInvoices'],
                  remoteRefreshExemptEntities: ['registeredInvoices'],
                  persist
              });
              assert.equal(genericUnsafe.remoteRefreshExemptEntities, undefined);

              const generic = policy.decorateCommand({
                  name: 'audit:record',
                  changedEntities: ['administrativeLogs'],
                  persist
              });
              assert.equal(generic.remoteRefreshExemptEntities, undefined);
          });
          """.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY

      - name: Validar GREEN direcionado
        run: >-
          node --test
          tests/unit/invoice-submit-guard.test.js
          tests/unit/invoice-core-refresh-policy.test.js
          tests/unit/operational-write-refresh-policy.test.js

      - name: Commitar implementação na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js src/application/invoice-service.js src/integration/operational-write-performance.js tests/unit/operational-write-refresh-policy.test.js
          git diff --cached --check
          git commit -m 'fix: conter submits repetidos de notas fiscais'
          git push origin HEAD:fix/pr1-invoice-submit-guard
