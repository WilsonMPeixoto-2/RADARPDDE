name: Publicação controlada PR438 — Production
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        required: true
        options: [preflight, backup, apply]
      confirmation:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr438-production-migration
  cancel-in-progress: false
jobs:
  release:
    if: inputs.phase != 'backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASS_REMOTE: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: scnryinorqeucbfkioxo
      CANDIDATE_SHA: 61e93b7fda69a51d592e5e5c9056f0d16d82c4d5
      MAIN_SHA: 113841bda52ce3bbda228524daf9a7464f12b462
      PGOPTIONS: '-c lock_timeout=5s -c statement_timeout=30s'
      PHASE: ${{ inputs.phase }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Verificar autorização, alvo e conteúdo certificado
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'PUBLICAR_PR438_EM_SCNRYINORQEUCBFKIOXO'
          test "$PROJECT_REF" = 'scnryinorqeucbfkioxo'
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$PGPASS_REMOTE"
          test "$(gh api repos/WilsonMPeixoto-2/RADARPDDE/pulls/438 --jq .head.sha)" = "$CANDIDATE_SHA"
          test "$(gh api repos/WilsonMPeixoto-2/RADARPDDE/branches/main --jq .commit.sha)" = "$MAIN_SHA"
          echo '42cbced36bb8ea5d563c8b389e666df34dc05180b807f35a62b29e07b5860589  supabase/migrations/20261011193500_inventory_terminal_delete_protection.sql' | sha256sum --check
          mkdir -p release-evidence
          if [ "$PHASE" = apply ]; then
            gh api "repos/WilsonMPeixoto-2/RADARPDDE/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100" > release-evidence/ci.json
            node -e "const d=require('./release-evidence/ci.json').workflow_runs;if(d.length<22||d.some(x=>x.status!=='completed'||x.conclusion!=='success'))throw Error('CI_FINAL_NOT_APPROVED');"
          fi
      - name: Instalar CLI canônico sem upgrade
        run: npm ci
      - name: Vincular Production explicitamente autorizada
        run: npx --no-install supabase link --project-ref "$PROJECT_REF" --password "$PGPASS_REMOTE"
      - name: Consultar backups gerenciados sem alterar configurações
        run: |
          python3 - <<'PYCODE'
          import urllib.request,json,os,pathlib
          req=urllib.request.Request('https://api.supabase.com/v1/projects/'+os.environ['PROJECT_REF']+'/database/backups',headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']})
          try:
            with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
            summary={k:d.get(k) for k in ('region','pitr_enabled','walg_enabled','physical_backup_data') if k in d}
            summary['response_keys']=list(d.keys())
            summary['backups']=[{k:b.get(k) for k in ('status','inserted_at','updated_at','created_at','is_physical_backup') if k in b} for b in d.get('backups',[])]
          except urllib.error.HTTPError as e: summary={'http_status':e.code,'available':False}
          pathlib.Path('release-evidence/managed-backups.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PYCODE
      - name: Preflight e cópia das definições afetadas
        run: |
          set -euo pipefail
          npx --no-install supabase migration list --linked --password "$PGPASS_REMOTE" > release-evidence/migrations-before.txt
          npx --no-install supabase db query --linked --file supabase/verification/pr438-release-preflight.sql > release-evidence/affected-schema-backup.json
          npx --no-install supabase db push --linked --dry-run --skip-vault --password "$PGPASS_REMOTE" 2>&1 | tee release-evidence/dry-run.txt
          python3 - <<'PYCODE'
          import re,pathlib
          pending=set(re.findall(r'\d{12,14}_[a-z0-9_]+\.sql',pathlib.Path('release-evidence/dry-run.txt').read_text()))
          assert pending=={'20261011193500_inventory_terminal_delete_protection.sql'},pending
          PYCODE
      - name: Preservar backup antes de qualquer DDL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr438-before-${{ github.run_id }}
          path: release-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Aplicar somente a migration homologada, sem seed ou Vault
        if: inputs.phase == 'apply'
        run: |
          set -euo pipefail
          npx --no-install supabase db push --linked --skip-vault --password "$PGPASS_REMOTE" --yes 2>&1 | tee release-evidence/apply.txt
      - name: Conferir proteções, histórico e integridade agregada
        if: inputs.phase == 'apply'
        run: |
          set -euo pipefail
          npx --no-install supabase db query --linked --file supabase/verification/pr438-release-postflight.sql > release-evidence/postflight.json
          npx --no-install supabase db query --linked --file supabase/verification/production-integrity-health.sql > release-evidence/integrity.json
          npx --no-install supabase migration list --linked --password "$PGPASS_REMOTE" > release-evidence/migrations-after.txt
      - name: Evidência final, sem credenciais ou registros pessoais
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr438-release-${{ github.run_id }}
          path: release-evidence/
          retention-days: 90
          if-no-files-found: warn

  backup:
    if: inputs.phase == 'backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir autorização e candidato
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CONFIRMATION" = 'PUBLICAR_PR438_EM_SCNRYINORQEUCBFKIOXO'
          test "$(gh api repos/WilsonMPeixoto-2/RADARPDDE/pulls/438 --jq .head.sha)" = '61e93b7fda69a51d592e5e5c9056f0d16d82c4d5'
          test "$(gh api repos/WilsonMPeixoto-2/RADARPDDE/branches/main --jq .commit.sha)" = '113841bda52ce3bbda228524daf9a7464f12b462'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test ops/pr397-backup/backup-snapshot.test.mjs
      - name: Iniciar apenas PostgreSQL descartável
        run: npx --no-install supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Gerar destinatário com chave privada cifrada
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/pr438-backup-sealed
        run: node ops/pr438-release/backup-key.mjs prepare
      - name: Backup somente leitura e restauração isolada — procedimento do PR397
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_TELEMETRY_DISABLED: '1'
          BACKUP_PUBLIC_KEY: ${{ runner.temp }}/pr438-backup-sealed/recipient-public.pem
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/pr438-backup-sealed
          BACKUP_PRIVATE_DIR: ${{ runner.temp }}/pr438-backup-private
        run: node ops/pr397-backup/backup-production.mjs
      - name: Conferir descriptografia autenticada e hash do arquivo
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/pr438-backup-sealed
        run: node ops/pr438-release/backup-key.mjs verify
      - name: Preservar somente backup cifrado, chave cifrada e evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr438-production-backup-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/pr438-backup-sealed/
          retention-days: 90
          if-no-files-found: error
      - name: Remover cópia em claro e banco descartável
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/pr438-backup-private"
          rm -f -- "${RUNNER_TEMP}/pr397-backup.tar.gz"
          npx --no-install supabase stop --no-backup
