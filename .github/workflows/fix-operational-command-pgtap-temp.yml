name: Corrigir contrato pgTAP final

on:
  push:
    branches:
      - docs/reconciliacao-integral-pos-pr162-20260807
    paths:
      - scripts/fix-operational-command-pgtap-temp.mjs
      - .github/workflows/fix-operational-command-pgtap-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/reconciliacao-integral-pos-pr162-20260807
          fetch-depth: 0

      - name: Corrigir entrada do throws_ok
        run: node scripts/fix-operational-command-pgtap-temp.mjs

      - name: Remover diagnósticos temporários
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            scripts/fix-operational-command-pgtap-temp.mjs \
            .github/workflows/fix-operational-command-pgtap-temp.yml \
            .github/workflows/diagnose-pgtap-current-schema-temp.yml

      - name: Validar e publicar
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/tests/database/operational-command-rpc.test.sql
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: corrigir contrato de log na criação de exercício"
          git push origin HEAD:docs/reconciliacao-integral-pos-pr162-20260807
