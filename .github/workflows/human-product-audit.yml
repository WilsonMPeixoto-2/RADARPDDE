name: Auditoria humana autenticada do produto

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/human-product-audit.yml'
      - 'tests/e2e/production-human-product-audit.spec.js'

permissions:
  contents: read

concurrency:
  group: human-product-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app

jobs:
  audit:
    name: Cinco perfis × superfícies visíveis
    if: ${{ startsWith(github.head_ref, 'audit/human-product-review-') && vars.RADAR_PRODUCTION_AUTH_READ_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Obter código sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium

      - name: Preparar contas técnicas protegidas
        id: credentials
        shell: bash
        env:
          ACCOUNTS_JSON: ${{ secrets.RADAR_PRODUCTION_READ_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${ACCOUNTS_JSON:-}"
          ACCOUNTS_FILE="${RUNNER_TEMP}/radar-production-read-accounts.json"
          printf '%s' "${ACCOUNTS_JSON}" > "${ACCOUNTS_FILE}"
          chmod 600 "${ACCOUNTS_FILE}"
          printf 'accounts_file=%s\n' "${ACCOUNTS_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Validar sintaxe da auditoria
        run: node --check tests/e2e/production-human-product-audit.spec.js

      - name: Navegar e capturar superfícies reais
        env:
          RADAR_E2E_PRODUCTION_HUMAN_AUDIT: '1'
          RADAR_PRODUCTION_READ_ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: npx playwright test tests/e2e/production-human-product-audit.spec.js --config=playwright.production-authenticated-read.config.js

      - name: Remover material de autenticação
        if: always()
        shell: bash
        env:
          ACCOUNTS_FILE: ${{ steps.credentials.outputs.accounts_file }}
        run: |
          set -euo pipefail
          if [ -n "${ACCOUNTS_FILE:-}" ]; then rm -f -- "${ACCOUNTS_FILE}"; fi

      - name: Publicar evidências visuais temporárias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: human-product-audit-${{ github.run_id }}
          path: artifacts/human-product-audit/
          if-no-files-found: error
          retention-days: 1
