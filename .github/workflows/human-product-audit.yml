name: Auditoria humana autenticada do produto

on:
  push:
    branches:
      - 'audit/human-product-review-2026-09-08'
    paths:
      - '.github/workflows/human-product-audit.yml'
      - 'tests/e2e/production-human-product-audit.spec.js'

permissions:
  contents: read

concurrency:
  group: human-product-audit-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RADAR_PRODUCTION_URL: https://radarpdde-fix.vercel.app
  RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
  RADAR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
  RADAR_ALLOW_REMOTE_HOMOLOGATION: 'true'

jobs:
  audit:
    name: Cinco perfis × superfícies visíveis
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Obter código sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium

      - name: Gerar credenciais efêmeras protegidas
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADAR_SUPABASE_URL:-}"
          test -n "${RADAR_SUPABASE_SERVICE_ROLE_KEY:-}"
          password="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(36).toString('base64url') + 'A1!')")"
          echo "::add-mask::${password}"
          echo "RADAR_HML_PASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "RADAR_HML_RUN_ID=human-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "RADAR_HML_FIXTURE_FILE=${RUNNER_TEMP}/radar-human-audit-users.json" >> "${GITHUB_ENV}"
          echo "RADAR_PRODUCTION_READ_ACCOUNTS_FILE=${RUNNER_TEMP}/radar-human-audit-accounts.json" >> "${GITHUB_ENV}"

      - name: Criar identidades temporárias e perfis funcionais
        run: node scripts/ops/prepare-remote-homologation-users.mjs

      - name: Preparar cinco perfis para a auditoria
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fixture = JSON.parse(fs.readFileSync(process.env.RADAR_HML_FIXTURE_FILE, 'utf8'));
          const required = ['controller', 'federal_assistant', 'inventory', 'sme_management', 'technical_admin'];
          const seen = new Set();
          const accounts = [];
          for (const user of fixture.users) {
            if (!required.includes(user.profileId) || seen.has(user.profileId)) continue;
            seen.add(user.profileId);
            accounts.push({ profileId: user.profileId, email: user.email, password: process.env.RADAR_HML_PASSWORD });
          }
          if (accounts.length !== required.length) throw new Error('Não foi possível montar os cinco perfis efêmeros.');
          fs.writeFileSync(process.env.RADAR_PRODUCTION_READ_ACCOUNTS_FILE, JSON.stringify({ accounts }, null, 2), { mode: 0o600 });
          NODE

      - name: Validar sintaxe da auditoria
        run: node --check tests/e2e/production-human-product-audit.spec.js

      - name: Navegar e capturar superfícies reais
        env:
          RADAR_E2E_PRODUCTION_HUMAN_AUDIT: '1'
        run: npx playwright test tests/e2e/production-human-product-audit.spec.js --config=playwright.production-authenticated-read.config.js

      - name: Publicar evidências visuais temporárias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: human-product-audit-${{ github.run_id }}
          path: artifacts/human-product-audit/
          if-no-files-found: warn
          retention-days: 1

      - name: Remover identidades temporárias e material de autenticação
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/ops/cleanup-remote-homologation-users.mjs
          rm -f -- "${RADAR_HML_FIXTURE_FILE:-}" "${RADAR_PRODUCTION_READ_ACCOUNTS_FILE:-}"
          exit 0
