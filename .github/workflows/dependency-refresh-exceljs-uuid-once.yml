name: Atualização única UUID transitivo do ExcelJS

on:
  push:
    branches:
      - maintenance/dependency-refresh-adversarial-2026-09-05

permissions:
  contents: write

jobs:
  refresh-exceljs-uuid:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Baseline limpa
        run: npm ci

      - name: Aplicar override restrito do UUID vulnerável do ExcelJS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.overrides ||= {};
          pkg.overrides.exceljs = { ...(pkg.overrides.exceljs || {}), uuid: '11.1.1' };
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ls exceljs uuid

      - name: Exigir auditoria sem vulnerabilidades
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-health
          npm audit --json > dependency-health/npm-audit-after-exceljs-uuid-2026-09-05.json 2>&1 || true
          cat dependency-health/npm-audit-after-exceljs-uuid-2026-09-05.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('dependency-health/npm-audit-after-exceljs-uuid-2026-09-05.json', 'utf8'));
          const counts = report?.metadata?.vulnerabilities || {};
          const total = ['info','low','moderate','high','critical'].reduce((n, key) => n + Number(counts[key] || 0), 0);
          if (total !== 0) throw new Error(`npm audit ainda registra ${total} vulnerabilidade(s).`);
          NODE

      - name: Validar APIs Node do ExcelJS com UUID 11
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ExcelJS = require('exceljs');
          (async () => {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('Teste');
            sheet.addRow(['Designação', 'Valor']);
            sheet.addRow(['04.31.001', 123.45]);
            sheet.getCell('A1').font = { bold: true };
            const bytes = await workbook.xlsx.writeBuffer();
            if (!bytes || bytes.length < 1000) throw new Error('ExcelJS não gerou XLSX válido em memória.');
            const roundTrip = new ExcelJS.Workbook();
            await roundTrip.xlsx.load(bytes);
            if (roundTrip.getWorksheet('Teste').getCell('B2').value !== 123.45) throw new Error('Round-trip do ExcelJS divergiu.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Reconstruir bundle e executar certificações Excel
        shell: bash
        run: |
          set -euo pipefail
          npm run build:exceljs
          npm run check
          CI=false npm run check:generated
          npm run certify:excel:fixture
          node --test \
            tests/unit/excel-export-audit.test.js \
            tests/unit/excel-integral-certification.test.js \
            tests/unit/excel-sme-export-integration.test.js \
            tests/unit/excel-sme-monthly.test.js \
            tests/unit/excel-sme-renderer.test.js \
            tests/unit/excel-sme-template-loader.test.js \
            tests/unit/excel-sme-template-renderer.test.js \
            tests/unit/exceljs-audit-policy.test.js
          npm run test:unit
          npm run test:integration
          npm run typecheck:database
          npm run analyze:unused

      - name: E2E dos botões Excel
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/assistant-dashboard-excel-actions.spec.js --project=desktop-chromium

      - name: Registrar árvore e obsolescências remanescentes
        shell: bash
        run: |
          set -euo pipefail
          npm outdated --json > dependency-health/npm-outdated-after-exceljs-uuid-2026-09-05.json 2>&1 || true
          npm ls exceljs uuid archiver glob inflight fast-csv lodash.isequal unzipper fstream rimraf > dependency-health/deprecated-chain-after-exceljs-uuid-2026-09-05.txt || true
          npm ls --all > dependency-health/npm-tree-after-exceljs-uuid-2026-09-05.txt
          cat dependency-health/npm-outdated-after-exceljs-uuid-2026-09-05.json
          cat dependency-health/deprecated-chain-after-exceljs-uuid-2026-09-05.txt

      - name: Commit local da atualização validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/exceljs.min.js dependency-health/npm-audit-after-exceljs-uuid-2026-09-05.json dependency-health/npm-outdated-after-exceljs-uuid-2026-09-05.json dependency-health/deprecated-chain-after-exceljs-uuid-2026-09-05.txt dependency-health/npm-tree-after-exceljs-uuid-2026-09-05.txt
          git commit -m 'chore(deps): corrigir UUID transitivo do ExcelJS'

      - name: Confirmar instalação versionada
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=low
          npm ls exceljs uuid
          git diff --exit-code

      - name: Publicar atualização validada na branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:maintenance/dependency-refresh-adversarial-2026-09-05
