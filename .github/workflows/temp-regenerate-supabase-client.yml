name: Regenerar cliente Supabase temporariamente

on:
  push:
    branches:
      - fix/ci-temporal-advisory-docs-deps-2026-08-31
    paths:
      - '.github/workflows/temp-regenerate-supabase-client.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/ci-temporal-advisory-docs-deps-2026-08-31

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Regenerar bundle Supabase
        run: npm run build:supabase-client

      - name: Versionar artefato e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-client.js
          git rm .github/workflows/temp-regenerate-supabase-client.yml
          git commit -m "chore: regenerar bundle Supabase JS 2.112.4"
          git push origin HEAD:fix/ci-temporal-advisory-docs-deps-2026-08-31
