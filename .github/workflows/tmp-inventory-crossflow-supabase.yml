name: Prova temporária NF inventariada com Supabase

on:
  push:
    branches:
      - fix/inventory-preserve-inventoried-2026-09-05

permissions:
  contents: write

jobs:
  crossflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Adicionar cenário adversarial create → inventariar → salvar origem → reload
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/supabase-functional-reliability.spec.js';
          let source = fs.readFileSync(path, 'utf8');
          const before = `    expect(await page.evaluate(context => ({\n      status: bens.find(item => item.id === context.assetId)?.status,\n      invoiceNumber: notasRegistradas.find(item => item.id === context.invoiceId)?.numero,\n      inventoryDelivery: verificacoes[context.schoolId]?.[context.compKey]?.bonificacao?.encampInventario\n    }), created)).toEqual({\n      status: 'Inventariada',\n      invoiceNumber: created.invoiceNumber,\n      inventoryDelivery: 'Sim'\n    });\n  });`;
          const after = `    expect(await page.evaluate(context => ({\n      status: bens.find(item => item.id === context.assetId)?.status,\n      invoiceNumber: notasRegistradas.find(item => item.id === context.invoiceId)?.numero,\n      inventoryDelivery: verificacoes[context.schoolId]?.[context.compKey]?.bonificacao?.encampInventario\n    }), created)).toEqual({\n      status: 'Inventariada',\n      invoiceNumber: created.invoiceNumber,\n      inventoryDelivery: 'Sim'\n    });\n\n    const resavedAfterInventory = await page.evaluate(async context => {\n      const result = await window.RadarApplicationServices.invoices.save({\n        id: context.invoiceId,\n        schoolId: context.schoolId,\n        compKey: context.compKey,\n        description: 'Impressora de confiabilidade funcional',\n        expenseType: 'permanente',\n        invoiceNumber: context.invoiceNumber,\n        amount: 2000,\n        profile: 'controlador'\n      });\n      const assets = await window.RadarApplicationServices.data.repository.load('assets');\n      const asset = assets.find(item => item.id === context.assetId);\n      return {\n        ok: result?.ok === true,\n        unchanged: result?.value?.unchanged === true,\n        status: asset?.status,\n        responsibleId: asset?.inventoried_by_member_id,\n        inventoriedAt: asset?.inventoried_at\n      };\n    }, created);\n    expect(resavedAfterInventory.ok).toBe(true);\n    expect(resavedAfterInventory.unchanged).toBe(true);\n    expect(resavedAfterInventory.status).toBe('Inventariada');\n    expect(resavedAfterInventory.responsibleId).toBe('inventory-local');\n    expect(resavedAfterInventory.inventoriedAt).toBeTruthy();\n\n    await page.reload();\n    await waitForRestoredController(page);\n    expect(await page.evaluate(context => ({\n      status: bens.find(item => item.id === context.assetId)?.status,\n      responsibleId: bens.find(item => item.id === context.assetId)?.inventariadorId,\n      inventoriedAt: bens.find(item => item.id === context.assetId)?.dataInventariacao\n    }), created)).toMatchObject({\n      status: 'Inventariada',\n      responsibleId: 'inventory-local'\n    });\n  });`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Trecho alvo esperado 1x; encontrado ${count}x`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Instalar dependências e Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Configurar origem local da Edge Function
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env
      - name: Iniciar Supabase descartável
        run: |
          npm run supabase:start
          npm run supabase:reset
      - name: Preparar autenticação e runtime
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true RADAR_SUPABASE_URL="${API_URL}" RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview RADAR_ENVIRONMENT=test RADAR_SUPABASE_REPOSITORY_ENABLED=true RADAR_SUPABASE_URL="${API_URL}" RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" npm run generate:runtime-config
          {
            printf 'RADAR_SUPABASE_URL=%s\n' "${API_URL}"
            printf 'RADAR_SUPABASE_PUBLISHABLE_KEY=%s\n' "${ANON_KEY}"
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
          } >> "${GITHUB_ENV}"
      - name: Executar cenário real com recarga
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: npx playwright test tests/e2e/supabase-functional-reliability.spec.js --project=desktop-chromium --workers=1
      - name: Unitários focais
        run: node --test tests/unit/invoice-inventoried-preservation.test.js
      - name: Persistir teste e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-inventory-crossflow-supabase.yml
          git add tests/e2e/supabase-functional-reliability.spec.js
          git commit -m 'test: cobrir NF inventariada após novo save e reload'
          git push origin HEAD:fix/inventory-preserve-inventoried-2026-09-05
      - name: Encerrar Supabase
        if: always()
        run: |
          npm run generate:runtime-config || true
          rm -f supabase/functions/.env
          npm run supabase:stop || true
