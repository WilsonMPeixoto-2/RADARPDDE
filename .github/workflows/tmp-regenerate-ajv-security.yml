# Temporário: regeneração autenticada do bundle Ajv a partir do lock revisto.
# Este workflow será REMOVIDO da branch antes de qualquer merge.
name: TEMP regenerar Ajv após fast-uri
on:
  push:
    branches:
      - fix/security-fast-uri-3-1-9-20261023

permissions:
  contents: write

jobs:
  build-vendor:
    if: github.repository == 'WilsonMPeixoto-2/RADARPDDE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch exata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Node homologado
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar lockfile e verificar versão corrigida
        run: |
          npm ci
          node -e "const v=JSON.parse(require('fs').readFileSync('node_modules/fast-uri/package.json','utf8')).version; if(v!=='3.1.9') throw new Error('fast-uri não corrigido: '+v);"
      - name: Regenerar somente bundle Ajv
        run: npm run build:ajv
      - name: Persistir artefato gerado na própria branch de hotfix
        run: |
          set -euo pipefail
          git add -- vendor/ajv.js
          if git diff --cached --quiet; then
            echo "Bundle Ajv já corresponde ao lockfile."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(security): regenerar vendor Ajv com fast-uri 3.1.9'
          git push origin HEAD:fix/security-fast-uri-3-1-9-20261023
