name: Materializar últimas dependências homologadas

on:
  push:
    branches:
      - chore/dependencies-current-2026-09-14

permissions:
  contents: write

jobs:
  refresh-current:
    if: ${{ !contains(github.event.head_commit.message, 'materializar dependências homologadas finais') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Materializar versões latest homologáveis diretamente do npm
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts dependency-cruiser@18.3.0 eslint@10.10.0

      - name: Alinhar contrato versionado do tooling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/unit/tooling-contract.test.js';
          const source = fs.readFileSync(path, 'utf8');
          const from = "packageJson.devDependencies.eslint, '10.9.1'";
          if (!source.includes(from)) throw new Error(`${path}: contrato antigo do ESLint não encontrado`);
          fs.writeFileSync(path, source.replace(from, "packageJson.devDependencies.eslint, '10.10.0'"));
          NODE

      - name: Instalar árvore reproduzível
        run: npm ci

      - name: Validar tooling atualizado
        run: |
          npm run check:architecture
          npm run lint:security
          node --test tests/unit/tooling-contract.test.js tests/unit/supabase-modernization.test.js
          npm run analyze:unused

      - name: Confirmar que só restam versões deliberadamente rejeitadas ou incompatíveis
        shell: bash
        run: |
          set +e
          npm outdated --json > /tmp/outdated.json
          code=$?
          set -e
          cat /tmp/outdated.json
          node <<'NODE'
          const fs = require('node:fs');
          const outdated = JSON.parse(fs.readFileSync('/tmp/outdated.json', 'utf8') || '{}');
          const allowed = new Set(['@types/node', 'supabase']);
          const unexpected = Object.keys(outdated).filter(name => !allowed.has(name));
          if (unexpected.length) throw new Error(`Ainda há dependências homologáveis desatualizadas: ${unexpected.join(', ')}`);
          if (outdated['@types/node']?.current !== '24.13.4' || outdated['@types/node']?.latest !== '26.5.1') {
            throw new Error('Estado de @types/node divergiu da decisão Node 24.');
          }
          if (outdated.supabase?.current !== '2.114.0' || outdated.supabase?.latest !== '2.117.0') {
            throw new Error('Estado do Supabase CLI divergiu da homologação atual.');
          }
          NODE
          test "$code" -eq 0 || test "$code" -eq 1

      - name: Registrar lockfile e contratos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/unit/tooling-contract.test.js
          git diff --cached --check
          git commit -m "chore: materializar dependências homologadas finais"
          git push origin HEAD:chore/dependencies-current-2026-09-14
