name: Homologar Stylelint 18

on:
  push:
    branches:
      - chore/stylelint-18-2026-11-04
    paths:
      - package.json
      - package-lock.json
      - stylelint.config.mjs
      - tests/unit/tooling-contract.test.js
      - docs/TECHNOLOGY_CAPABILITIES_TRACKER.md
      - .github/workflows/homologar-stylelint-18.yml

permissions:
  contents: write

jobs:
  homologar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/stylelint-18-2026-11-04

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materializar lockfile da major
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Instalação reproduzível
        run: npm ci

      - name: Confirmar versões resolvidas
        run: |
          node -e "const p=require('./node_modules/stylelint/package.json'); const r=require('./node_modules/stylelint-config-recommended/package.json'); console.log({stylelint:p.version,recommended:r.version})"

      - name: Executar lint CSS real
        run: npm run lint:css

      - name: Validar contrato de tooling
        run: node --test tests/unit/tooling-contract.test.js

      - name: Inventariar cadeia CSS
        shell: bash
        run: |
          mkdir -p artifacts/stylelint18
          npm ls stylelint stylelint-config-recommended globby fast-glob micromatch braces tinyglobby minimatch --all --json > artifacts/stylelint18/npm-ls.json || true

      - name: Auditar dependências
        shell: bash
        run: |
          mkdir -p dependency-health
          set +e
          npm audit --json > dependency-health/npm-audit.json
          set -e
          npm run audit:exceljs-policy

      - name: Verificar assinaturas
        run: npm audit signatures

      - name: Publicar evidências
        uses: actions/upload-artifact@v4
        with:
          name: stylelint-18-homologacao
          path: |
            artifacts/stylelint18/npm-ls.json
            dependency-health/npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Gravar lockfile aprovado
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile já sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(css): materializar lockfile do Stylelint 18"
          git push origin HEAD:chore/stylelint-18-2026-11-04
