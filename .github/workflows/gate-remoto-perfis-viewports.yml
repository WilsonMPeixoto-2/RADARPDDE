name: Gate remoto de perfis e viewports

on:
  workflow_dispatch:
  push:
    branches:
      - qa/supabase-preview-final
      - hardening/node24-profile-viewport-gate
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'src/**'
      - 'vendor/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/generate-runtime-config.mjs'
      - 'scripts/ops/prepare-remote-homologation-users.mjs'
      - 'scripts/ops/cleanup-remote-homologation-users.mjs'
      - 'tests/e2e/supabase-preview-remote.spec.js'
      - 'tests/e2e/supabase-preview-profile-viewport.spec.js'
      - 'tests/support/spa-server.mjs'
      - 'playwright.supabase-preview.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/gate-remoto-perfis-viewports.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'src/**'
      - 'vendor/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/generate-runtime-config.mjs'
      - 'scripts/ops/prepare-remote-homologation-users.mjs'
      - 'scripts/ops/cleanup-remote-homologation-users.mjs'
      - 'tests/e2e/supabase-preview-remote.spec.js'
      - 'tests/e2e/supabase-preview-profile-viewport.spec.js'
      - 'tests/support/spa-server.mjs'
      - 'playwright.supabase-preview.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/gate-remoto-perfis-viewports.yml'

permissions:
  contents: read

concurrency:
  group: gate-remoto-perfis-viewports-${{ github.ref }}
  cancel-in-progress: true

env:
  RADAR_DEPLOYMENT_URL: http://127.0.0.1:4175
  RADAR_REFERENCE_PREVIEW_URL: https://radarpdde-d5g8j0esm-wilson-m-peixotos-projects.vercel.app
  RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
  RADAR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
  RADAR_ALLOW_REMOTE_HOMOLOGATION: 'true'
  RADAR_E2E_SUPABASE_REMOTE: '1'

jobs:
  homologar:
    name: Perfis × Desktop, Android e iPhone
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Obter código
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium e WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Preparar caminhos temporários do runner
        shell: bash
        run: echo "RADAR_HML_FIXTURE_FILE=${RUNNER_TEMP}/radar-hml-users.json" >> "${GITHUB_ENV}"

      - name: Validar alvo remoto e obter chave publicável
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADAR_SUPABASE_URL}"
          test -n "${RADAR_SUPABASE_SERVICE_ROLE_KEY}"
          test "${RADAR_SUPABASE_URL}" = 'https://scnryinorqeucbfkioxo.supabase.co'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const response = await fetch(`${process.env.RADAR_REFERENCE_PREVIEW_URL}/config.runtime.js`);
          if (!response.ok) throw new Error(`Manifesto indisponível: ${response.status}`);
          const source = await response.text();
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const runtime = sandbox.window.RADAR_PDDE_RUNTIME_INPUT;
          if (runtime?.environment !== 'preview') throw new Error('Preview sem environment=preview.');
          if (runtime?.dataMode !== 'supabase-preview') throw new Error('Preview sem dataMode=supabase-preview.');
          if (runtime?.features?.supabaseRepositoryEnabled !== true) throw new Error('Repositório Supabase desativado no Preview.');
          if (runtime?.productionActivationApproved !== false) throw new Error('Preview com ativação de Production indevida.');
          if (runtime?.supabase?.url !== process.env.RADAR_SUPABASE_URL) throw new Error('Preview aponta para projeto Supabase inesperado.');
          const publishableKey = String(runtime?.supabase?.publishableKey || '').trim();
          if (!publishableKey.startsWith('sb_publishable_') && !publishableKey.startsWith('eyJ')) {
            throw new Error('Chave publicável ausente ou inválida.');
          }
          console.log(`::add-mask::${publishableKey}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RADAR_SUPABASE_PUBLISHABLE_KEY=${publishableKey}\n`);
          process.stdout.write('Manifesto Preview validado sem exibir credenciais.\n');
          NODE

      - name: Gerar manifesto local do código do PR
        env:
          RADAR_DATA_MODE: supabase-preview
          RADAR_ENVIRONMENT: preview
          RADAR_SUPABASE_REPOSITORY_ENABLED: 'true'
          RADAR_SUPABASE_PRODUCTION_ACTIVATION_APPROVED: 'false'
          RADAR_SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          npm run generate:runtime-config
          npm run generate:runtime-config -- --check

      - name: Gerar credencial efêmera protegida
        shell: bash
        run: |
          set -euo pipefail
          password="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(36).toString('base64url') + 'A1!')")"
          echo "::add-mask::${password}"
          echo "RADAR_HML_PASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "RADAR_HML_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Criar identidades temporárias e perfis funcionais
        run: node scripts/ops/prepare-remote-homologation-users.mjs

      - name: Homologar perfis, viewports, RLS e persistência
        run: npx playwright test --config=playwright.supabase-preview.config.js

      - name: Remover identidades e registros temporários
        if: always()
        run: node scripts/ops/cleanup-remote-homologation-users.mjs

      - name: Publicar evidências da homologação
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-remoto-perfis-viewports-${{ github.run_id }}
          path: |
            playwright-report-supabase-preview/
            test-results/
          if-no-files-found: warn
          retention-days: 14
