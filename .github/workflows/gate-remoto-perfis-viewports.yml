name: Gate remoto de perfis e viewports

on:
  workflow_dispatch:
  push:
    branches:
      - qa/supabase-preview-final
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'src/**'
      - 'vendor/**'
      - 'supabase/**'
      - 'scripts/bootstrap-local-auth-fixtures.mjs'
      - 'scripts/check-local-auth-fixtures.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'tests/e2e/supabase-auth-local.spec.js'
      - 'tests/e2e/supabase-full-contract.spec.js'
      - 'tests/e2e/pendency-reanalysis-auth.spec.js'
      - 'tests/e2e/supabase-preview-profile-viewport.spec.js'
      - 'tests/support/spa-server.mjs'
      - 'playwright.config.js'
      - 'playwright.supabase-preview.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/gate-remoto-perfis-viewports.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'src/**'
      - 'vendor/**'
      - 'supabase/**'
      - 'scripts/bootstrap-local-auth-fixtures.mjs'
      - 'scripts/check-local-auth-fixtures.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'tests/e2e/supabase-auth-local.spec.js'
      - 'tests/e2e/supabase-full-contract.spec.js'
      - 'tests/e2e/pendency-reanalysis-auth.spec.js'
      - 'tests/e2e/supabase-preview-profile-viewport.spec.js'
      - 'tests/support/spa-server.mjs'
      - 'playwright.config.js'
      - 'playwright.supabase-preview.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/gate-remoto-perfis-viewports.yml'

permissions:
  contents: read

concurrency:
  group: gate-remoto-perfis-viewports-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_TELEMETRY_DISABLED: '1'
  RADAR_DEPLOYMENT_URL: http://127.0.0.1:4175

jobs:
  homologar:
    name: Perfis × Desktop, Android e iPhone
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium e WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Configurar origem local da Edge Function
        shell: bash
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env

      - name: Iniciar Supabase descartável
        run: npm run supabase:start

      - name: Recriar banco com as migrations versionadas
        run: npm run supabase:reset

      - name: Preparar identidades, runtime e credenciais efêmeras
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_SUPABASE_URL=%s\n' "${API_URL}"
            printf 'RADAR_SUPABASE_PUBLISHABLE_KEY=%s\n' "${ANON_KEY}"
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
            printf 'RADAR_HML_FIXTURE_FILE=%s/supabase/fixtures/auth-users.json\n' "${GITHUB_WORKSPACE}"
            printf 'RADAR_E2E_PROFILE_VIEWPORT_GATE=%s\n' '1'
            printf 'RADAR_EXPECTED_RUNTIME_ENVIRONMENT=%s\n' 'test'
            printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175'
          } >> "${GITHUB_ENV}"

      - name: Validar autenticação das identidades descartáveis
        run: npm run check:auth-fixtures

      - name: Validar contratos Auth e RLS no desktop
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: >-
          npx playwright test
          tests/e2e/supabase-auth-local.spec.js
          tests/e2e/supabase-full-contract.spec.js
          tests/e2e/pendency-reanalysis-auth.spec.js
          --project=desktop-chromium

      - name: Validar papéis e viewports
        run: npx playwright test --config=playwright.supabase-preview.config.js

      - name: Publicar evidências do gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-remoto-perfis-viewports-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-report-profile-viewport/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Restaurar configuração e remover credencial local
        if: always()
        run: |
          npm run generate:runtime-config
          rm -f supabase/functions/.env

      - name: Encerrar Supabase descartável
        if: always()
        run: npm run supabase:stop || true
