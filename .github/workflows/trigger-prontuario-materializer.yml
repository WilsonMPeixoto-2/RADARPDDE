name: Trigger PR Navegacao Prontuario Materializer

on:
  push:
    branches:
      - feat/prontuario-navegacao-rapida

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ !contains(github.event.head_commit.message, 'feat: adicionar navegação rápida no prontuário') }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar materializador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prontuario-navigation-materializer.yml --ref feat/prontuario-navegacao-rapida
