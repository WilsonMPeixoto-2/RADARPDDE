name: Registrar prova dinâmica de autenticação e leituras

on:
  push:
    branches:
      - docs/auditoria-funcional-frontend-supabase-design-20260806
    paths:
      - .github/workflows/update-functional-audit-dynamic-read.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/auditoria-funcional-frontend-supabase-design-20260806
          fetch-depth: 0

      - name: Atualizar registro estruturado
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'docs/audits/2026-08-06-functional-supabase-audit.json';
          const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
          audit.dynamicReadReview = {
            completed: true,
            successfulRunId: 31071643516,
            diagnosticRunId: 31071070501,
            environment: 'Supabase local descartável + runtime sintético isolado',
            migrationsApplied: 27,
            syntheticAuthIdentities: 7,
            productionDataUsed: false,
            productionMutation: false,
            result: 'success',
            diagnosis: 'A execução inicial misturou suítes sem login com runtime supabase-preview. A repetição separou o modo autenticado do modo sintético e ambos passaram sem alteração do produto.'
          };
          const dynamic = {
            'AUTH-01': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/supabase-auth-local.spec.js'],
              finding: 'Cinco perfis ativos autenticaram; usuário inativo e usuário sem perfil foram negados; logout e simulação técnica passaram. O smoke autenticado recorrente de Production permanece desativado.'
            },
            'NAV-01': {
              status: 'confirmed',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/canonical-routes.spec.js', 'tests/e2e/frontend-contract.spec.js'],
              finding: 'Rotas canônicas, histórico, fallback autorizado, foco, rolagem e contratos de handlers passaram no modo sintético apropriado.'
            },
            'NAV-02': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/supabase-auth-local.spec.js'],
              finding: 'Escopos e negativas de leitura/escrita passaram localmente; a prova autenticada recorrente de Production permanece desativada.'
            },
            'COMP-01': {
              status: 'confirmed',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/canonical-routes.spec.js', 'tests/e2e/cycle-b-carteira.spec.js'],
              finding: 'Competência e contexto foram preservados em navegação, Carteira e retorno contextual.'
            },
            'READ-01': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/supabase-auth-local.spec.js', 'tests/e2e/frontend-contract.spec.js'],
              finding: 'Dashboard e bootstrap por perfil passaram localmente; Production continua sem smoke autenticado agendado.'
            },
            'READ-02': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/cycle-b-carteira.spec.js', 'tests/e2e/supabase-auth-local.spec.js'],
              finding: 'Carteira, filtros, dados, ações e escopos passaram; Production continua sem smoke autenticado agendado.'
            },
            'READ-03': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/canonical-routes.spec.js'],
              finding: 'Prontuário, aba de pendências, reload, histórico e nova aba passaram; Production continua sem smoke autenticado agendado.'
            },
            'READ-04': {
              status: 'local-confirmed-production-partial',
              evidence: ['GitHub Actions run 31071643516', 'tests/e2e/canonical-routes.spec.js', 'tests/e2e/cycle-b-carteira.spec.js'],
              finding: 'Pendências e transporte de filtros passaram no modo sintético; Production continua sem smoke autenticado agendado.'
            }
          };
          for (const operation of audit.operations) {
            const result = dynamic[operation.id];
            if (!result) continue;
            operation.dynamicStatus = result.status;
            operation.evidence = [...new Set([...(operation.evidence || []), ...result.evidence])];
            operation.findings = [...new Set([...(operation.findings || []), result.finding])];
          }
          fs.writeFileSync(file, `${JSON.stringify(audit, null, 2)}\n`);
          NODE

      - name: Validar e publicar
        shell: bash
        run: |
          node -e "const a=require('./docs/audits/2026-08-06-functional-supabase-audit.json'); if(a.operations.length!==41||a.dynamicReadReview?.result!=='success') process.exit(1);"
          git rm .github/workflows/update-functional-audit-dynamic-read.yml
          git add docs/audits/2026-08-06-functional-supabase-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: registrar prova dinâmica de autenticação e leituras"
          git push origin HEAD:docs/auditoria-funcional-frontend-supabase-design-20260806
