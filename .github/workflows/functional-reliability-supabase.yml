name: Confiabilidade funcional com Supabase real

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-reliability:
    name: Salvar, recarregar e reler fluxos críticos
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Configurar origem local da Edge Function
        run: |
          mkdir -p supabase/functions
          printf 'RADAR_ALLOWED_ORIGIN=%s\n' 'http://127.0.0.1:4175' > supabase/functions/.env
          chmod 600 supabase/functions/.env

      - name: Iniciar Supabase descartável
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Preparar autenticação e configuração runtime
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          FIXTURE_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url') + 'A1!')")"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          RADAR_ALLOW_LOCAL_AUTH_BOOTSTRAP=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_ADMIN_KEY="${SERVICE_ROLE_KEY}" \
          RADAR_AUTH_FIXTURE_PASSWORD="${FIXTURE_PASSWORD}" \
          npm run bootstrap:auth-fixtures
          RADAR_DATA_MODE=supabase-preview \
          RADAR_ENVIRONMENT=test \
          RADAR_SUPABASE_REPOSITORY_ENABLED=true \
          RADAR_SUPABASE_URL="${API_URL}" \
          RADAR_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}" \
          npm run generate:runtime-config
          {
            printf 'RADAR_SUPABASE_URL=%s\n' "${API_URL}"
            printf 'RADAR_SUPABASE_PUBLISHABLE_KEY=%s\n' "${ANON_KEY}"
            printf 'RADAR_AUTH_FIXTURE_PASSWORD=%s\n' "${FIXTURE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Executar jornada funcional real com recargas
        env:
          RADAR_E2E_SUPABASE_LOCAL: '1'
        run: npx playwright test tests/e2e/supabase-functional-reliability.spec.js --project=desktop-chromium --workers=1

      - name: Publicar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: functional-reliability-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Restaurar configuração e encerrar Supabase
        if: always()
        run: |
          npm run generate:runtime-config || true
          rm -f supabase/functions/.env
          npm run supabase:stop || true
