name: PR410 school apply GREEN rerun

on:
  push:
    branches:
      - refactor/simplify-operational-sync-2026-10-04
    paths:
      - .github/workflows/pr410-school-apply-rerun.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/simplify-operational-sync-2026-10-04
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Reuse verified patch script
        shell: bash
        run: |
          awk '
            /^          node <<.NODE./ { capture=1; next }
            capture && /^          NODE$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/pr410-school-apply-patch.yml > /tmp/pr410-school-apply.js
          test -s /tmp/pr410-school-apply.js
          node /tmp/pr410-school-apply.js
      - name: Targeted GREEN verification
        run: |
          node --check src/application/data-service.js
          node --test tests/unit/school-operational-context-application.test.js
          git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/data-service.js
          git commit -m "feat: aplicar fatia operacional escolar com cobertura segura"
          git push origin HEAD:refactor/simplify-operational-sync-2026-10-04
