name: PR179 regenerar tipos Supabase

on:
  push:
    branches:
      - feat/despesa-a-identificar-20260816
    paths:
      - '.github/workflows/pr179-regenerate-types.yml'

permissions:
  contents: write

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/despesa-a-identificar-20260816
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar e recriar Supabase local
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Regenerar tipos canônicos
        run: |
          mkdir -p src/types
          npm run supabase:gen:types
          test -s src/types/database.types.ts
          grep -q 'invoice_number: string | null' src/types/database.types.ts

      - name: Commitar artefato completo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.types.ts
          if git diff --cached --quiet; then
            echo 'Tipos já estavam sincronizados.'
          else
            git commit -m 'chore: regenerar tipos Supabase completos'
            git push origin HEAD:feat/despesa-a-identificar-20260816
          fi

      - name: Encerrar Supabase local
        if: always()
        run: npm run supabase:stop || true
