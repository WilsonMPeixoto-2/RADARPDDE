name: Saúde das dependências

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - knip.config.cjs
      - eslint.config.js
      - lighthouserc.cjs
      - scripts/run-lighthouse-baseline.mjs
      - scripts/check-exceljs-audit-policy.mjs
      - scripts/check-workflow-references.mjs
      - scripts/apply-round-2-wiring.mjs
      - tests/unit/workflow-references.test.js
      - vendor/exceljs.min.js
      - src/domain/excel-sme-template-renderer.js
      - src/domain/excel-sme-monthly-renderer.js
      - src/integration/excel-sme-runtime-loader.js
      - src/integration/excel-export-integration.js
      - src/integration/load-excel-export.js
      - .github/dependabot.yml
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - knip.config.cjs
      - eslint.config.js
      - lighthouserc.cjs
      - scripts/run-lighthouse-baseline.mjs
      - scripts/check-exceljs-audit-policy.mjs
      - scripts/check-workflow-references.mjs
      - tests/unit/workflow-references.test.js
      - vendor/exceljs.min.js
      - src/domain/excel-sme-template-renderer.js
      - src/domain/excel-sme-monthly-renderer.js
      - src/integration/excel-sme-runtime-loader.js
      - src/integration/excel-export-integration.js
      - src/integration/load-excel-export.js
      - .github/dependabot.yml
      - .github/workflows/**
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-rodada-2:
    name: Gerar wiring e bundles da Rodada 2
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/rodada-2-busca-flutuantes-transicoes-20260801' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter branch da rodada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rodada-2-busca-flutuantes-transicoes-20260801
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Aplicar package e ligação ao HTML
        run: node scripts/apply-round-2-wiring.mjs

      - name: Regenerar lockfile e instalar dependências
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Gerar bundles locais
        run: npm run build:search-ui-vendors

      - name: Validar implementação focal
        run: |
          node --test tests/unit/search-ui-vendor-contract.test.js tests/unit/global-search-index.test.js tests/unit/global-search-integration.test.js tests/unit/floating-ui-bootstrap.test.js tests/unit/view-transitions.test.js
          npm run check
          npm run check:search-ui-vendors

      - name: Registrar somente artefatos permanentes
        shell: bash
        run: |
          rm -f scripts/apply-round-2-wiring.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json index.html vendor/fuse.js vendor/floating-ui.js
          git add -A scripts/apply-round-2-wiring.mjs
          git commit -m 'build: integrar dependências da rodada 2'
          git push origin HEAD:feat/rodada-2-busca-flutuantes-transicoes-20260801

  audit:
    name: Vulnerabilidades, integridade e inventário
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar referências locais dos workflows
        run: node scripts/check-workflow-references.mjs

      - name: Preparar diretório de evidências
        run: mkdir -p dependency-health

      - name: Gerar relatório HTML do lint de segurança
        run: npm run lint:security:html

      - name: Inventariar dependências e imports com Knip
        id: knip-audit
        shell: bash
        run: |
          set +e
          npm run analyze:unused > dependency-health/knip.txt 2>&1
          knip_exit=$?
          set -e
          cat dependency-health/knip.txt
          if grep -Eq '(^ERROR:|Error loading)' dependency-health/knip.txt; then
            echo 'O Knip registrou erro interno ou falha ao carregar configuração.' >&2
            knip_exit=1
          fi
          printf '{"exitCode":%s}\n' "${knip_exit}" > dependency-health/knip-exit.json
          exit "${knip_exit}"

      - name: Gerar relatório completo de vulnerabilidades
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-health/npm-audit.json
          audit_exit=$?
          set -e
          printf '{"exitCode":%s}\n' "$audit_exit" > dependency-health/npm-audit-exit.json

      - name: Aplicar política de alcance e bloquear alertas novos
        run: npm run audit:exceljs-policy

      - name: Verificar assinaturas e proveniência
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit signatures --json --include-attestations > dependency-health/npm-signatures.json 2> dependency-health/npm-signatures.stderr.txt
          signature_exit=$?
          set -e
          printf '{"exitCode":%s}\n' "$signature_exit" > dependency-health/npm-signatures-exit.json

      - name: Registrar pacotes desatualizados
        shell: bash
        run: |
          set +e
          npm outdated --json > dependency-health/npm-outdated.json
          outdated_exit=$?
          set -e
          printf '{"exitCode":%s}\n' "$outdated_exit" > dependency-health/npm-outdated-exit.json

      - name: Gerar SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx --sbom-type application > dependency-health/sbom.cdx.json

      - name: Registrar árvore instalada
        run: npm ls --all --json > dependency-health/npm-tree.json

      - name: Resumir auditoria
        if: always()
        shell: bash
        run: |
          echo "### Saúde das dependências" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ESLint: relatório HTML navegável preservado como evidência do lint de segurança." >> "${GITHUB_STEP_SUMMARY}"
          echo "- Referências locais de workflows: bloqueantes quando apontam para arquivos, ações locais ou scripts npm inexistentes." >> "${GITHUB_STEP_SUMMARY}"
          echo "- Knip: bloqueante para dependências não usadas, não declaradas, não resolvidas e falhas internas de análise." >> "${GITHUB_STEP_SUMMARY}"
          echo "- Vulnerabilidades: relatório integral preservado; alertas novos e críticos continuam bloqueantes." >> "${GITHUB_STEP_SUMMARY}"
          echo "- ExcelJS: somente dois advisories conhecidos podem ser aceitos nos caminhos transitivos não alcançados pelo runtime documental do navegador." >> "${GITHUB_STEP_SUMMARY}"
          echo "- Bundle oficial, escopo de runtime, assinaturas, pacotes desatualizados, SBOM e árvore instalada são verificados ou registrados como evidência." >> "${GITHUB_STEP_SUMMARY}"

      - name: Publicar evidências de dependências
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-health-${{ github.run_id }}
          path: dependency-health
          retention-days: 30
          if-no-files-found: error
