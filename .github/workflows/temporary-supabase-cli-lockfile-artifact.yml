name: Temporary Supabase CLI lockfile artifact

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile-artifact:
    if: github.event.pull_request.head.ref == 'chore/rodada-3b-supabase-cli-2-110-0-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate exact dependency files
        run: npm install --save-dev --save-exact supabase@2.110.0

      - name: Verify exact installed version
        run: |
          test "$(node -p "require('./package.json').devDependencies.supabase")" = "2.110.0"
          test "$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")" = "2.110.0"
          test "$(npx supabase --version)" = "2.110.0"
          git status --short

      - name: Prepare artifact
        run: |
          mkdir -p generated-lockfile
          cp package.json package-lock.json generated-lockfile/
          sha256sum generated-lockfile/package.json generated-lockfile/package-lock.json

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: supabase-cli-2-110-0-lockfile
          path: generated-lockfile
          if-no-files-found: error
          retention-days: 1
