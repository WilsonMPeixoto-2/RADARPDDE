name: Regenerar lockfile do toolchain

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/refresh-tooling-lock.yml'

permissions:
  contents: write

concurrency:
  group: refresh-tooling-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter branch do pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Alinhar Edge Function e regenerar lockfile
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#npm:@supabase/supabase-js@2\.110\.7#npm:@supabase/supabase-js@2.110.8#' \
            supabase/functions/team-account-management/index.ts
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Registrar diagnóstico completo do npm audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tooling-refresh
          set +e
          npm audit --json > tooling-refresh/npm-audit.json
          status=$?
          set -e
          printf '{"exitCode":%s}\n' "${status}" > tooling-refresh/npm-audit-exit.json
          npm audit || true
          exit "${status}"

      - name: Publicar alterações reproduzíveis na própria branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json supabase/functions/team-account-management/index.ts; then
            echo 'Lockfile e Edge Function já estão alinhados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json supabase/functions/team-account-management/index.ts
          git commit -m 'chore: regenerar lockfile e alinhar Supabase JS'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Publicar diagnóstico temporário
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-refresh-${{ github.run_id }}
          path: tooling-refresh
          retention-days: 1
          if-no-files-found: warn
