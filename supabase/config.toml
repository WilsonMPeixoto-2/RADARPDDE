project_id = "radar-pdde"

[api]
enabled = true
# Preserva o bootstrap local homologado: grants são definidos pelas migrations.
# A CLI 2.121 passou a preservar grants automáticos quando esta opção é omitida.
auto_expose_new_tables = false
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["http://localhost:4175"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.team-account-management]
verify_jwt = true
